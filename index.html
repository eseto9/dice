<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Caravan Dice</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=DM+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: everything on one screen, no page scroll. Phones: header, flat scene, then a control panel that fills the rest.
   Wide screens: the scene on the left, the control panel on the right.
   Single light look on purpose: clean white page, beige icon tiles, orange accent, soft shadows. */
:root {
  --bg: #fafaf8;
  --card: #ffffff;
  --tile: #f3ede3;
  --line: #e9e4db;
  --ink: #262b29;
  --muted: #6a6f6b;
  --accent: #ef8a26;
  --accent-ink: #ffffff;
  --atk: #d4532d;
  --shd: #477b9b;
  --coin: #b9860c;
  --heal: #5f9334;
  --shadow: 0 1px 0 rgba(70, 50, 20, 0.05), 0 6px 18px rgba(70, 50, 20, 0.08);
  --font-display: 'Poppins', 'Segoe UI', system-ui, sans-serif;
  --font-body: 'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: light;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.4;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.ic { width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.num { font-variant-numeric: tabular-nums; }

.shell {
  height: 100%;
  max-width: 640px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px;
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  grid-template-rows: auto auto minmax(0, 1fr);
  gap: 10px;
  overflow: hidden;
}
#app { min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }

.stack { display: flex; flex-direction: column; gap: 14px; }

/* Header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 10px 12px; flex-wrap: wrap; }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 1.35rem; line-height: 1; letter-spacing: -0.01em; display: flex; flex-direction: column; gap: 6px; }
.brand::after { content: ""; width: 34px; height: 4px; border-radius: 3px; background: var(--accent); }
.res { display: flex; gap: 6px; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 5px 11px; border-radius: 999px; background: var(--card); box-shadow: var(--shadow); font-weight: 700; font-variant-numeric: tabular-nums; }
.chip.coin .ic { color: var(--coin); }
.iconbtn { width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--card); box-shadow: var(--shadow); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; color: var(--muted); font-size: 1.05rem; }
.road { display: flex; align-items: center; gap: 8px; width: 100%; font-size: 0.8rem; color: var(--muted); }
.road b { color: var(--ink); font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.road .dots { display: flex; gap: 5px; margin-left: auto; flex: none; }
.road .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--line); }
.road .dot.done { background: var(--accent); }
.road .dot.here { background: var(--card); box-shadow: inset 0 0 0 3px var(--accent); }
.road .dot.boss { border-radius: 3px; }

/* Stage: flat side-view scene */
.scene { position: relative; width: min(100%, 60vh); justify-self: center; max-width: 100%; aspect-ratio: 16 / 9; border-radius: 16px; overflow: hidden; touch-action: manipulation; }
.scene svg.stage { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.scene .overlay { position: absolute; inset: 8px 8px auto 8px; pointer-events: none; display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.stage [data-crew] { cursor: pointer; }
.stage .pos { transition: transform 320ms ease; }
.stage .fig { animation: breathe 3.2s ease-in-out infinite; }
.stage .walking .fig { animation: walk 0.55s ease-in-out infinite; }
.stage .fallen .fig { animation: none; transform-box: fill-box; transform-origin: 50% 100%; transform: rotate(-84deg); opacity: 0.85; }
.stage .swing { transform-box: fill-box; transform-origin: 50% 6%; }
.stage .bob { animation: bob 2.4s ease-in-out infinite; }
.stage .flicker { transform-box: fill-box; transform-origin: 50% 100%; animation: flicker 0.3s steps(2) infinite; }
@keyframes breathe { 50% { transform: translateY(-0.8px); } }
@keyframes walk { 50% { transform: translateY(-2.5px); } }
@keyframes bob { 50% { transform: translateY(-4px); } }
@keyframes flicker { 50% { transform: scale(0.9, 1.14); } }
@media (prefers-reduced-motion: reduce) { .stage *, .stage .fig { animation: none !important; transition: none !important; } }
.ctx { background: color-mix(in srgb, var(--card) 94%, transparent); box-shadow: var(--shadow); border-radius: 12px; padding: 6px 10px; display: flex; flex-direction: column; gap: 4px; min-width: 120px; max-width: 48%; }
.ctx .row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.ctx b { font-family: var(--font-display); font-weight: 600; font-size: 0.92rem; line-height: 1.2; }
.ctx .hp { font-weight: 700; color: var(--atk); font-variant-numeric: tabular-nums; font-size: 0.85rem; }
.ctx .block { font-size: 0.75rem; color: var(--shd); font-weight: 700; display: flex; align-items: center; gap: 4px; }
.wchips { display: flex; flex-wrap: wrap; gap: 5px; }
.wchip { background: color-mix(in srgb, var(--card) 92%, transparent); box-shadow: var(--shadow); border-radius: 9px; padding: 4px 7px; font-size: 0.68rem; font-weight: 700; display: flex; flex-direction: column; gap: 3px; min-width: 70px; border: 1.5px solid transparent; }
.wchip.rear { border-color: color-mix(in srgb, var(--atk) 45%, transparent); }
.wchip.dead { opacity: 0.5; }
.wchip .bar { height: 4px; }
.bar { height: 7px; border-radius: 4px; background: var(--tile); overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--atk); border-radius: 4px; transition: width 400ms ease; }
.bar.fill-ok > span { background: var(--heal); }
.float {
  position: absolute; z-index: 3; pointer-events: none; white-space: nowrap;
  font-family: var(--font-display); font-weight: 700; font-size: 1.3rem; line-height: 1;
  text-shadow: 0 2px 0 #fff, 0 0 6px #fff, 0 0 2px #fff;
  transform: translate(-50%, -50%);
  animation: floatUp 1.1s ease-out forwards;
}
@keyframes floatUp {
  0% { opacity: 0; transform: translate(-50%, -20%) scale(0.6); }
  15% { opacity: 1; transform: translate(-50%, -50%) scale(1.15); }
  70% { opacity: 1; }
  100% { opacity: 0; transform: translate(-50%, -190%) scale(1); }
}

/* Shared */
.label { font-size: 0.78rem; font-weight: 700; color: var(--muted); display: flex; align-items: center; gap: 8px; justify-content: space-between; }
.label > span:first-child { display: flex; align-items: center; gap: 8px; color: var(--ink); }
.label > span:first-child::before { content: ""; width: 3px; height: 14px; border-radius: 2px; background: var(--accent); flex: none; }
.tile { background: var(--tile); border-radius: 12px; display: flex; align-items: center; justify-content: center; flex: none; }
.card { background: var(--card); box-shadow: var(--shadow); border-radius: 16px; }

/* Intent */
.intent { display: flex; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 16px; background: var(--card); box-shadow: var(--shadow); transition: box-shadow 200ms; }
.intent .tile { width: 40px; height: 40px; font-size: 1.3rem; color: var(--atk); }
.intent .txt { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.intent .eyebrow { font-size: 0.72rem; font-weight: 700; color: var(--muted); }
.intent strong { font-family: var(--font-display); font-weight: 600; font-size: 1rem; line-height: 1.25; }
.intent .detail { font-size: 0.8rem; color: var(--muted); }
.intent.cancelled { opacity: 0.55; }
.intent.cancelled strong { text-decoration: line-through; }
.intent.acting { box-shadow: 0 0 0 3px var(--atk), var(--shadow); }

/* Dice tray */
.tray { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; max-width: 280px; width: 100%; margin-inline: auto; }
.die {
  aspect-ratio: 1.15; width: 100%; max-width: 100%;
  border-radius: 16px; border: 0; background: var(--card);
  box-shadow: 0 4px 0 #e6dccb, 0 10px 20px rgba(70, 50, 20, 0.1);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  cursor: pointer; position: relative; padding: 4px;
}
.die .face { display: flex; align-items: center; gap: 4px; font-family: var(--font-display); font-weight: 700; font-size: clamp(1.35rem, 6.4vw, 2rem); line-height: 1; }
.die .face .ic { font-size: 0.75em; }
.die .who { font-size: 0.7rem; color: var(--muted); font-weight: 700; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.die.acting { transform: translateY(-6px) scale(1.06); box-shadow: 0 0 0 3px var(--accent), 0 10px 22px rgba(239, 138, 38, 0.35); transition: transform 150ms; }
.die.spent { opacity: 0.45; }
.die.held { box-shadow: 0 0 0 3px var(--accent), 0 4px 0 3px #f3c08d, 0 10px 20px rgba(70, 50, 20, 0.1); }
.die .held-tag { position: absolute; top: -9px; left: 50%; transform: translateX(-50%); background: var(--accent); color: var(--accent-ink); font-size: 0.64rem; font-weight: 700; padding: 1px 8px; border-radius: 999px; }
.die:disabled { cursor: default; }
.t-atk { color: var(--atk); } .t-shd { color: var(--shd); } .t-coin { color: var(--coin); }
.t-heal { color: var(--heal); } .t-blank { color: #b9b2a6; }
.tumble { animation: tumble 420ms cubic-bezier(.3,1.4,.5,1); }
@keyframes tumble { 0% { transform: rotate(-160deg) scale(.6); opacity: 0.2; } 100% { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .tumble, .float { animation-duration: 1ms; } .bar > span { transition: none; } }

.preview { display: flex; flex-wrap: wrap; gap: 4px 12px; font-weight: 700; font-size: 0.92rem; min-height: 1.3em; }
.preview span { display: inline-flex; align-items: center; gap: 4px; }
.preview .hint { font-weight: 400; color: var(--muted); }

/* Crew (compact) */
.roster { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.crew { position: relative; text-align: left; padding: 7px 6px; border-radius: 14px; background: var(--card); box-shadow: var(--shadow); border: 2px solid transparent; display: flex; flex-direction: column; gap: 6px; cursor: pointer; min-width: 0; }
.crew .head { display: flex; gap: 7px; align-items: center; min-width: 0; }
.crew .tile { width: 30px; height: 30px; border-radius: 8px; overflow: hidden; align-items: flex-end; }
.crew .tile svg { width: 24px; height: 28px; }
@media (max-width: 420px) { .crew .head { flex-direction: column; align-items: flex-start; gap: 3px; } }
.crew .nm { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.crew .nm b { font-family: var(--font-display); font-weight: 600; font-size: 0.88rem; line-height: 1.15; }
.crew .role { font-size: 0.7rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.crew .badge { position: absolute; top: -8px; right: 6px; font-size: 0.62rem; font-weight: 700; padding: 1px 7px; border-radius: 999px; background: var(--accent); color: #fff; }
.crew.sel { border-color: var(--accent); }
.crew:disabled { cursor: default; }
.faces { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; }
.mini { height: 22px; border-radius: 6px; background: var(--tile); display: flex; align-items: center; justify-content: center; gap: 1px; font-size: 0.7rem; font-weight: 700; border: 0; padding: 0; }
.mini .ic { font-size: 0.76rem; }
button.mini { cursor: pointer; height: 34px; font-size: 0.85rem; }
button.mini:disabled { cursor: default; opacity: 0.4; }
button.mini:not(:disabled):hover { box-shadow: 0 0 0 2px var(--accent); }

/* Actions */
.actions { display: flex; gap: 8px; margin-top: auto; padding-top: 2px; }
.btn { flex: 1; min-height: 50px; border-radius: 14px; border: 0; background: var(--card); box-shadow: var(--shadow); font-family: var(--font-display); font-weight: 600; font-size: 0.98rem; cursor: pointer; padding: 6px 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.15; }
.btn small { font-family: var(--font-body); font-weight: 500; font-size: 0.74rem; color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-ink); flex: 1.4; box-shadow: 0 4px 0 #c96d14, 0 8px 16px rgba(239, 138, 38, 0.25); }
.btn.primary small { color: inherit; opacity: 0.85; }
.btn:disabled { opacity: 0.4; cursor: default; }
.btn:not(:disabled):active { transform: translateY(2px); }
.btn.solo { flex: none; }


/* Panels (map, market, camp...) */
.panel { display: flex; flex-direction: column; gap: 12px; flex: 1; min-height: 0; }
.panel h1 { font-family: var(--font-display); font-weight: 700; font-size: 1.45rem; margin: 0; line-height: 1.12; letter-spacing: -0.01em; text-wrap: balance; }
.panel p { margin: 0; color: var(--muted); max-width: 60ch; }
.choices { display: grid; gap: 10px; }
.choice { text-align: left; padding: 11px; border-radius: 16px; border: 2px solid transparent; background: var(--card); box-shadow: var(--shadow); cursor: pointer; display: flex; gap: 12px; align-items: center; width: 100%; }
.choice .tile { width: 46px; height: 46px; font-size: 1.35rem; }
.choice .txt { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0; }
.choice b { font-family: var(--font-display); font-weight: 600; font-size: 0.98rem; }
.choice span.d { color: var(--muted); font-size: 0.86rem; }
.choice .price { font-weight: 700; display: inline-flex; align-items: center; gap: 4px; color: var(--coin); white-space: nowrap; font-variant-numeric: tabular-nums; }
.choice:not(:disabled):hover { border-color: var(--accent); }
.choice:disabled { opacity: 0.45; cursor: default; }
.choice.done { opacity: 0.55; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat { padding: 12px; border-radius: 14px; background: var(--card); box-shadow: var(--shadow); }
.stat b { display: block; font-family: var(--font-display); font-weight: 700; font-size: 1.5rem; }
.stat span { font-size: 0.78rem; color: var(--muted); }

/* Route map */
.map { position: relative; width: 100%; max-width: 100%; flex: 1 1 auto; min-height: 230px; margin-inline: auto; border-radius: 20px; background: linear-gradient(#f6efe2, #efe3cc); box-shadow: var(--shadow); overflow: hidden; }
.map svg.lines { position: absolute; inset: 0; width: 100%; height: 100%; }
.node { position: absolute; transform: translate(-50%, -50%); width: 64px; border: 0; background: none; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: default; }
.node .disc { width: 50px; height: 50px; border-radius: 16px; background: var(--card); box-shadow: var(--shadow); display: flex; align-items: center; justify-content: center; font-size: 1.35rem; color: var(--muted); }
.node .nl { font-size: 0.68rem; font-weight: 700; color: var(--muted); background: color-mix(in srgb, var(--card) 85%, transparent); padding: 0 5px; border-radius: 6px; white-space: nowrap; }
.node.reach { cursor: pointer; }
.node.reach .disc { box-shadow: 0 0 0 3px var(--accent), var(--shadow); color: var(--ink); animation: pulse 1.6s ease-in-out infinite; }
.node.reach .nl { color: var(--ink); }
.node.visited .disc { background: var(--tile); box-shadow: none; color: #b5a98f; }
.node.here .disc { background: var(--accent); color: #fff; box-shadow: 0 4px 0 #c96d14; }
.node.far { opacity: 0.5; }
.node.boss .disc { width: 60px; height: 60px; border-radius: 18px; color: var(--atk); }
.node.boss.reach .disc { color: var(--atk); }
.node[data-t="ambush"] .disc { color: var(--atk); } .node[data-t="camp"] .disc { color: var(--accent); }
.node[data-t="market"] .disc { color: var(--coin); }
.node.visited .disc, .node.here .disc { color: inherit; }
@keyframes pulse { 50% { transform: translateY(-3px); } }
@media (prefers-reduced-motion: reduce) { .node.reach .disc { animation: none; } }

/* Title */
.hero h1 { font-size: 2rem; }
.hero .cta { display: flex; flex-direction: column; gap: 10px; }
.credit { font-size: 0.75rem; color: var(--muted); }
@media (min-width: 700px) and (min-aspect-ratio: 5/4) {
  .shell { max-width: 1200px; grid-template-columns: minmax(0, 1.55fr) minmax(300px, 1fr); grid-template-rows: auto minmax(0, 1fr); column-gap: 18px; }
  #top { grid-column: 1 / -1; }
  #scene { grid-column: 1; grid-row: 2; align-self: start; width: min(100%, calc((100vh - 110px) * 16 / 9)); justify-self: center; }
  #app { grid-column: 2; grid-row: 2; }
  .roster { grid-template-columns: repeat(2, 1fr) !important; }
}
/* Phones held sideways: little height, so a one-line header, a wider panel and all four crew in one row. */
@media (max-height: 520px) and (min-aspect-ratio: 5/4) {
  .shell { grid-template-columns: minmax(0, 1fr) minmax(380px, 1.05fr); padding-block: 6px; row-gap: 6px; }
  #scene { width: min(100%, calc((100vh - 64px) * 16 / 9)); }
  .top { flex-wrap: nowrap; }
  .brand { font-size: 1.1rem; }
  .brand::after { display: none; }
  .road { order: 1; width: auto; flex: 1; min-width: 0; }
  .res { order: 2; }
  .roster { grid-template-columns: repeat(4, 1fr) !important; }
  .intent .detail { display: none; }
  .crew .head { flex-direction: column; align-items: flex-start; gap: 3px; }
  .panel { gap: 8px; }
  .panel h1 { font-size: 1.15rem; }
  .choices { gap: 6px; }
  .choice { padding: 6px 8px; }
  .choice .tile { width: 34px; height: 34px; font-size: 1.1rem; }
  .btn { min-height: 44px; }
}
</style>
</head>
<body>
<div class="shell" id="root">
  <div id="top"></div>
  <div class="scene" id="scene">
    <div class="overlay" id="overlay"></div>
  </div>
  <div class="stack" id="app"></div>
</div>
<script>
'use strict';

/* =========================================================
   Icons
   ========================================================= */
const ICON_D = {
  atk: 'M19 4l-9.5 9.5M19 4h-4.5M19 4v4.5M7 13.5l3.5 3.5M5 19l3.2-3.2',
  shd: 'M12 3.5l7 2.8v5c0 4.6-3 7.8-7 9.7-4-1.9-7-5.1-7-9.7v-5z',
  coin: 'M20 12a8 8 0 1 1-16 0a8 8 0 1 1 16 0M15.5 12a3.5 3.5 0 1 1-7 0a3.5 3.5 0 1 1 7 0',
  heal: 'M12 5v14M5 12h14',
  blank: 'M7 12h10',
  bag: 'M5 8h14l-1 12H6zM9 8a3 3 0 0 1 6 0',
  fire: 'M12 3c1 4 5 5.5 5 10a5 5 0 0 1-10 0c0-2.5 1.5-4 2.5-5 .3 2 1.5 3 2.5 3-1-3 0-6 0-8z',
  crown: 'M4 18l-1-10 5 4 4-7 4 7 5-4-1 10z',
  cart: 'M3 7h14v8H3zM17 10h4M7 19a1.5 1.5 0 1 0 0.1 0M14 19a1.5 1.5 0 1 0 0.1 0',
  flag: 'M5 21V4M5 4h11l-2 4 2 4H5',
  sound: 'M4 9h4l5-4v14l-5-4H4zM16.5 9a4 4 0 0 1 0 6M19 6.5a7.5 7.5 0 0 1 0 11',
  mute: 'M4 9h4l5-4v14l-5-4H4zM17 9l5 6M22 9l-5 6',
};
const icon = (t) => `<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="${ICON_D[t]}"/></svg>`;
const FACE_NAME = { atk: 'Attack', shd: 'Block', coin: 'Coin', heal: 'Mend', blank: 'Blank' };
const FACE_COLOR = { atk: '#d4532d', shd: '#477b9b', coin: '#b9860c', heal: '#5f9334', blank: '#b9b2a6' };

function parseFace(s) {
  if (s === '-') return { t: 'blank', v: 0 };
  if (s === 'h') return { t: 'heal', v: 0 };
  return { t: { a: 'atk', s: 'shd', c: 'coin' }[s[0]], v: Number(s.slice(1)) };
}
const hasValue = (f) => f.t !== 'blank' && f.t !== 'heal';
const faceLabel = (f) => (hasValue(f) ? `${FACE_NAME[f.t]} ${f.v}` : FACE_NAME[f.t]);

/* =========================================================
   Game data
   ========================================================= */
const MEND = 3; // health restored by each Mend face

// The four members of the caravan. Each is a six-sided die; their looks are in LOOKS (flat art section).
const CREW_POOL = {
  amir: { name: 'Amir', role: 'Guard', faces: ['a3', 'a3', 'a4', 's3', 's3', 's4'] },
  zane: { name: 'Zane', role: 'Sellsword', faces: ['-', '-', 'a5', 'a6', 'a7', 'a8'] },
  noor: { name: 'Noor', role: 'Medic', faces: ['h', 'h', 's3', 's2', 'a2', 'a2'] },
  oskar: { name: 'Oskar', role: 'Trader', faces: ['c2', 'c3', 'c4', 'c2', 'a2', 's2'] },
};
const START_CREW = ['amir', 'zane', 'noor', 'oskar'];
const MAX_CREW = 4;
const MAX_WAGONS = 4;

// Each wagon adds to the caravan's health and may have a perk.
const WAGON_TYPES = {
  supply: { name: 'Supply Cart', hp: 20, perk: 'Carries the supplies. No perk.' },
  armory: { name: 'Armoury', hp: 20, perk: 'Guards get +1 on Attack.' },
  bulwark: { name: 'Bulwark', hp: 18, perk: 'Start every turn with 2 block.' },
  bell: { name: 'Bell Wagon', hp: 12, perk: 'Each matching pair of faces deals +3 damage.' },
  cook: { name: 'Cook Wagon', hp: 12, perk: 'Heal 4 after every fight.' },
  spice: { name: 'Spice Wagon', hp: 12, perk: 'Coin faces give +1 coin.' },
};

// Enemy moves: 'atk' hits the caravan; 'guard' absorbs some of your damage this turn, then hits.
const ENEMY_TYPES = {
  bandits: { name: 'Dune Bandits', hp: 14, loot: 5, pattern: [{ k: 'atk', v: 4 }, { k: 'atk', v: 6 }, { k: 'guard', v: 2, dmg: 3 }, { k: 'atk', v: 6 }] },
  skeletons: { name: 'Tomb Guards', hp: 12, loot: 5, pattern: [{ k: 'atk', v: 4 }, { k: 'atk', v: 4 }, { k: 'guard', v: 2, dmg: 3 }, { k: 'atk', v: 4 }] },
  king: { name: 'The Bandit King', boss: true, hp: 25, loot: 12, pattern: [{ k: 'guard', v: 4, dmg: 4 }, { k: 'atk', v: 7 }, { k: 'atk', v: 6 }, { k: 'atk', v: 8 }] },
  wraith: { name: 'Sand Wraith', hp: 24, loot: 6, pattern: [{ k: 'atk', v: 7 }, { k: 'atk', v: 6 }, { k: 'atk', v: 8 }, { k: 'guard', v: 4, dmg: 4 }] },
  siege: { name: 'Raider Siege Tower', hp: 25, loot: 6, pattern: [{ k: 'guard', v: 5, dmg: 6 }, { k: 'atk', v: 10 }, { k: 'atk', v: 6 }, { k: 'atk', v: 7 }] },
  storm: { name: 'The Storm Mother', boss: true, hp: 42, loot: 12, pattern: [{ k: 'atk', v: 7 }, { k: 'atk', v: 8 }, { k: 'guard', v: 5, dmg: 6 }, { k: 'atk', v: 11 }] },
  sentinel: { name: 'Brass Sentinel', hp: 29, loot: 7, pattern: [{ k: 'atk', v: 8 }, { k: 'guard', v: 5, dmg: 6 }, { k: 'atk', v: 8 }, { k: 'atk', v: 11 }] },
  legion: { name: 'Tomb Legion', hp: 28, loot: 7, pattern: [{ k: 'atk', v: 8 }, { k: 'atk', v: 8 }, { k: 'guard', v: 4, dmg: 7 }, { k: 'atk', v: 8 }] },
  warden: { name: 'The Gate Warden', boss: true, hp: 50, loot: 0, pattern: [{ k: 'guard', v: 6, dmg: 6 }, { k: 'atk', v: 11 }, { k: 'atk', v: 8 }, { k: 'atk', v: 14 }, { k: 'atk', v: 7 }] },
};

const LEGS = [
  { name: 'The Salt Flats', normals: ['bandits', 'skeletons'], boss: 'king' },
  { name: 'The Shifting Sea', normals: ['wraith', 'siege'], boss: 'storm' },
  { name: 'The Brass Road', normals: ['sentinel', 'legion'], boss: 'warden' },
];

const NODE_INFO = {
  ambush: { label: 'Fight', icon: 'atk' },
  camp: { label: 'Camp', icon: 'fire' },
  market: { label: 'Market', icon: 'bag' },
  boss: { label: 'Boss', icon: 'crown' },
};

const DICE_PER_TURN = 2;
const REROLLS = 2;
const CAMP_HEAL = 10;
const PRICES = { wagon: 12, repair: 4 };
const REPAIR = 8;

/* =========================================================
   State, saving, helpers
   ========================================================= */
const SAVE_KEY = 'caravan-dice-save-v4';
let S = null;
let pendingFx = [];
const rand = (n) => Math.floor(Math.random() * n);
const pick = (arr) => arr[rand(arr.length)];
const shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = rand(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const crewById = (id) => S.crew.find((c) => c.id === id);
const has = (type) => S.wagons.some((w) => w.type === type);
const maxHp = () => S.wagons.reduce((s, w) => s + WAGON_TYPES[w.type].hp, 0);
const heal = (n) => { const before = S.hp; S.hp = Math.min(maxHp(), S.hp + n); return S.hp - before; };
function log(msg) { S.log.unshift(msg); S.log.length = Math.min(S.log.length, 20); }
function fx(e) { pendingFx.push(e); }

function save() {
  if (!S) return;
  try {
    if (!['victory', 'defeat'].includes(S.screen)) localStorage.setItem(SAVE_KEY, JSON.stringify(S));
    else localStorage.removeItem(SAVE_KEY);
  } catch (err) { /* storage unavailable: the run still works, it just won't resume */ }
}
function loadSave() {
  try { const s = localStorage.getItem(SAVE_KEY); return s ? JSON.parse(s) : null; } catch (err) { return null; }
}

// Delayed steps (the enemy's turn, the end of a fight). Ignored if a new run started meanwhile.
function later(ms, fn) {
  const run = S && S.runId;
  setTimeout(() => { if (S && S.runId === run) { fn(); render(); } }, ms);
}

function mkCrew(id) {
  const d = CREW_POOL[id];
  return { id, name: d.name, role: d.role, faces: d.faces.map(parseFace) };
}

function genLeg() {
  const weights = (row) => (row === 0 ? [['ambush', 70], ['camp', 30]] : [['ambush', 50], ['market', 25], ['camp', 25]]);
  const roll = (row) => { const w = weights(row); let r = Math.random() * 100; for (const [t, n] of w) { if ((r -= n) < 0) return t; } return 'ambush'; };
  const rows = [];
  for (let r = 0; r < 3; r++) {
    const lanes = [1];
    if (Math.random() < 0.7) lanes.unshift(0);
    if (Math.random() < 0.7) lanes.push(2);
    if (lanes.length === 1) { lanes.push(Math.random() < 0.5 ? 0 : 2); lanes.sort(); }
    rows.push(lanes.map((lane) => ({ lane, type: roll(r) })));
  }
  if (!rows.flat().some((n) => n.type === 'market')) pick(rows[1 + rand(2)]).type = 'market';
  if (!rows[0].some((n) => n.type === 'ambush')) rows[0][0].type = 'ambush';
  return { rows };
}

function newRun() {
  S = {
    runId: Math.random(),
    crew: START_CREW.map(mkCrew),
    wagons: [{ type: 'supply' }, { type: 'armory' }],
    hp: 0, coin: 4, leg: 0, pos: { row: -1, lane: 1 },
    map: LEGS.map(() => genLeg()), visited: [],
    screen: 'map', log: [], fight: null, market: null, upgrade: null, lastSel: null,
    upgradeCost: 5,
    stats: { dmg: 0, turns: 0, coinEarned: 0, fights: 0 },
  };
  S.hp = maxHp();
  log(`The caravan sets out across ${LEGS[0].name}.`);
}

/* =========================================================
   Route map
   ========================================================= */
function reachable() {
  const leg = S.map[S.leg], p = S.pos;
  if (p.row >= 3) return [];
  if (p.row === 2) return [{ key: 'boss', row: 3, lane: 1, type: 'boss' }];
  return leg.rows[p.row + 1].filter((n) => Math.abs(n.lane - p.lane) <= 1)
    .map((n) => ({ key: `${p.row + 1}-${n.lane}`, row: p.row + 1, lane: n.lane, type: n.type }));
}

function enterNode(type) {
  const leg = LEGS[S.leg];
  if (type === 'ambush') startFight(pick(leg.normals));
  else if (type === 'boss') startFight(leg.boss);
  else if (type === 'market') { S.market = genMarket(); S.screen = 'market'; }
  else if (type === 'camp') {
    const got = heal(CAMP_HEAL);
    log(`Rested at camp: +${got} health.`);
    fx({ k: 'gain', text: `+${got} health`, cls: 't-heal', sfx: 'block' });
  }
}

function nextLeg() {
  S.leg++;
  S.pos = { row: -1, lane: 1 };
  S.screen = 'map';
  log(`On to ${LEGS[S.leg].name}.`);
}

/* =========================================================
   Fights
   ========================================================= */
const rollFace = (id) => ({ ...pick(crewById(id).faces) });
function defaultSel() {
  const ids = S.crew.map((c) => c.id);
  const sel = (S.lastSel || []).filter((id) => ids.includes(id));
  for (const id of ids) if (sel.length < DICE_PER_TURN && !sel.includes(id)) sel.push(id);
  return sel.slice(0, DICE_PER_TURN);
}

function totals(f) {
  const t = { atk: 0, shd: 0, coin: 0, heal: 0, bell: 0 };
  const counts = {};
  for (const d of f.dice) {
    const c = crewById(d.crew);
    if (d.face.t === 'atk') t.atk += d.face.v + (has('armory') && c.role === 'Guard' ? 1 : 0);
    else if (d.face.t === 'shd') t.shd += d.face.v;
    else if (d.face.t === 'coin') t.coin += d.face.v + (has('spice') ? 1 : 0);
    else if (d.face.t === 'heal') t.heal += MEND;
    if (hasValue(d.face)) { const k = d.face.t + d.face.v; counts[k] = (counts[k] || 0) + 1; }
  }
  if (has('bell')) { for (const k in counts) t.bell += Math.floor(counts[k] / 2) * 3; t.atk += t.bell; }
  if (has('bulwark')) t.shd += 2;
  return t;
}

function startFight(kind) {
  const e = ENEMY_TYPES[kind];
  S.fight = {
    id: Math.random(), kind,
    enemy: { name: e.name, hp: e.hp, max: e.hp, block: 0, step: 0 },
    intent: null, selected: defaultSel(), dice: [], rerolls: 0, phase: 'pick', turn: 1, shield: 0,
  };
  S.screen = 'fight';
  S.stats.fights++;
  nextIntent();
}

function nextIntent() {
  const f = S.fight, e = f.enemy, pattern = ENEMY_TYPES[f.kind].pattern;
  const base = pattern[e.step % pattern.length];
  const bump = Math.floor(e.step / pattern.length); // a little meaner each time the pattern repeats
  e.step++;
  f.intent = { k: base.k, v: base.v + bump, dmg: (base.dmg || 0) + bump };
  e.block = f.intent.k === 'guard' ? f.intent.v : 0;
}

function intentText(it) {
  return it.k === 'guard'
    ? { icon: 'shd', title: `Brace, then attack for ${it.dmg}`, detail: `Absorbs ${it.v} of your damage this turn.` }
    : { icon: 'atk', title: `Attack for ${it.v}`, detail: 'Your block reduces it.' };
}

// Your turn resolves one die at a time, in roll order: that crew member steps up and acts, then the next.
function playerPhase() {
  const f = S.fight;
  S.stats.turns++;
  const steps = f.dice.map((d, i) => ({ die: i }));
  if (has('bell')) {
    const counts = {};
    for (const d of f.dice) if (hasValue(d.face)) { const k = d.face.t + d.face.v; counts[k] = (counts[k] || 0) + 1; }
    let bell = 0; for (const k in counts) bell += Math.floor(counts[k] / 2) * 3;
    if (bell) steps.push({ bell });
  }
  f.steps = steps;
  f.shield = has('bulwark') ? 2 : 0;
  f.guardLeft = f.enemy.block;
  f.active = null;
  f.phase = 'resolving';
  later(250, nextStep);
}

function hitEnemy(f, v) {
  const absorbed = Math.min(f.guardLeft, v);
  f.guardLeft -= absorbed;
  const dealt = v - absorbed;
  f.enemy.hp = Math.max(0, f.enemy.hp - dealt);
  S.stats.dmg += dealt;
  return { dealt, absorbed };
}

function nextStep() {
  const f = S.fight;
  const st = f.steps.shift();
  if (!st) { f.active = null; f.phase = 'enemy'; later(650, enemyPhase); return; }
  let wait = 560;
  if (st.bell) {
    f.active = null;
    const r = hitEnemy(f, st.bell);
    fx({ k: 'bell', dmg: r.dealt, absorbed: r.absorbed });
    wait = 700;
  } else {
    const d = f.dice[st.die], c = crewById(d.crew);
    f.active = st.die;
    d.done = true;
    const t = d.face.t, v = d.face.v;
    if (t === 'atk') {
      const r = hitEnemy(f, v + (has('armory') && c.role === 'Guard' ? 1 : 0));
      fx({ k: 'strike', id: c.id, dmg: r.dealt, absorbed: r.absorbed });
      wait = 820;
    } else if (t === 'shd') {
      f.shield += v;
      fx({ k: 'act', id: c.id, text: `+${v} block`, cls: 't-shd', sfx: 'block', burst: '#6fa8d0' });
    } else if (t === 'coin') {
      const n = v + (has('spice') ? 1 : 0);
      S.coin += n; S.stats.coinEarned += n;
      fx({ k: 'act', id: c.id, text: `+${n} coin`, cls: 't-coin', sfx: 'coin', burst: '#e0b23a' });
    } else if (t === 'heal') {
      const got = heal(MEND);
      fx({ k: 'act', id: c.id, text: `+${got} health`, cls: 't-heal', sfx: 'block', burst: '#7fbf5a' });
    } else {
      fx({ k: 'act', id: c.id, text: 'Nothing', cls: 't-blank' });
      wait = 450;
    }
  }
  if (f.enemy.hp <= 0) { f.phase = 'done'; f.steps = []; fx({ k: 'edown' }); later(1700, () => { f.active = null; winFight(); }); return; }
  later(wait, nextStep);
}

function enemyPhase() {
  const f = S.fight, it = f.intent;
  const dmg = it.k === 'guard' ? it.dmg : it.v;
  const taken = Math.max(0, dmg - f.shield);
  S.hp = Math.max(0, S.hp - taken);
  fx({ k: 'eshot', to: 'wagon', id: S.wagons[S.wagons.length - 1].type, dmg: taken, blocked: taken === 0 });
  if (S.hp <= 0) { f.phase = 'done'; later(1300, lose); return; }
  f.dice = [];
  f.phase = 'pick';
  f.turn++;
  nextIntent();
}

function winFight() {
  const f = S.fight, e = ENEMY_TYPES[f.kind];
  S.lastSel = f.selected.slice();
  S.coin += e.loot; S.stats.coinEarned += e.loot;
  let note = `Beat ${e.name}.${e.loot ? ` +${e.loot} coin.` : ''}`;
  if (has('cook')) { const got = heal(4); if (got) note += ` Cook Wagon: +${got} health.`; }
  log(note);
  Sfx.play('win');
  if (f.kind === LEGS[LEGS.length - 1].boss) { S.screen = 'victory'; return; }
  if (e.boss) { S.hp = maxHp(); S.screen = 'camp'; return; }
  S.screen = 'map';
}
function lose() { S.screen = 'defeat'; log(`The caravan fell to ${S.fight.enemy.name}.`); Sfx.play('lose'); }

/* =========================================================
   Market and training
   ========================================================= */
function genMarket() {
  const wagons = Object.keys(WAGON_TYPES).filter((t) => !has(t));
  return { wagon: wagons.length ? pick(wagons) : null, bought: [] };
}
function upgradeFace(c, i) {
  const f = c.faces[i];
  const before = faceLabel(f);
  if (f.t === 'blank') { f.t = 'atk'; f.v = 3; } else f.v += 2;
  log(`${c.name}: ${before} became ${faceLabel(f)}.`);
}

/* =========================================================
   Player actions
   ========================================================= */
const A = {
  newRun() { newRun(); },
  resume() { const s = loadSave(); if (s) { S = s; resumePending(); } },
  mute() { Sfx.toggle(); },

  go(key) {
    if (S.screen !== 'map') return;
    const n = reachable().find((x) => x.key === key);
    if (!n) return;
    S.pos = { row: n.row, lane: n.lane };
    S.visited.push(`${S.leg}-${n.row}-${n.lane}`);
    Sfx.play('click');
    enterNode(n.type);
  },

  pick(id) {
    const f = S.fight;
    if (!f || f.phase !== 'pick' || !crewById(id)) return;
    const i = f.selected.indexOf(id);
    if (i >= 0) f.selected.splice(i, 1);
    else if (f.selected.length < DICE_PER_TURN) f.selected.push(id);
    else { f.selected.shift(); f.selected.push(id); }
    Sfx.play('click');
  },
  roll() {
    const f = S.fight;
    if (!f || f.phase !== 'pick' || !f.selected.length) return;
    f.dice = f.selected.map((id) => ({ crew: id, face: rollFace(id), held: false, fresh: true }));
    f.rerolls = REROLLS;
    f.phase = 'roll';
    Sfx.play('roll');
  },
  hold(i) {
    const f = S.fight;
    const d = f && f.phase === 'roll' && f.dice[+i];
    if (d) { d.held = !d.held; Sfx.play('click'); }
  },
  reroll() {
    const f = S.fight;
    if (!f || f.phase !== 'roll' || f.rerolls < 1) return;
    const free = f.dice.filter((d) => !d.held);
    if (!free.length) return;
    f.rerolls--;
    for (const d of free) { d.face = rollFace(d.crew); d.fresh = true; }
    Sfx.play('roll');
  },
  end() { if (S.screen === 'fight' && S.fight.phase === 'roll') playerPhase(); },

  camp(kind) {
    if (kind === 'spoils') { S.coin += 12; S.stats.coinEarned += 12; log('Took the spoils: +12 coin.'); }
    if (kind === 'train') { S.upgrade = { free: true, crew: null }; S.screen = 'upgrade'; return; }
    nextLeg();
  },

  buy(key) {
    const m = S.market;
    if (S.screen !== 'market' || m.bought.includes(key)) return;
    const [kind, arg] = key.split(':');
    const cost = kind === 'upgrade' ? S.upgradeCost : PRICES[kind];
    if (S.coin < cost) return;
    if (kind === 'wagon') {
      if (S.wagons.length >= MAX_WAGONS) return;
      S.wagons.push({ type: arg }); S.hp += WAGON_TYPES[arg].hp; log(`Bought a ${WAGON_TYPES[arg].name}.`);
    } else if (kind === 'repair') {
      if (S.hp >= maxHp()) return;
      log(`Repairs: +${heal(REPAIR)} health.`);
    } else if (kind === 'upgrade') { S.upgrade = { free: false, crew: null }; S.screen = 'upgrade'; Sfx.play('click'); return; }
    S.coin -= cost;
    if (kind === 'wagon') m.bought.push(key);
    Sfx.play('coin');
  },
  leave() { S.screen = 'map'; },
  upCrew(id) { if (S.upgrade) S.upgrade.crew = id; Sfx.play('click'); },
  upFace(i) {
    const u = S.upgrade, c = u && crewById(u.crew);
    if (!c || c.faces[+i].t === 'heal') return;
    if (!u.free) { if (S.coin < S.upgradeCost) return; S.coin -= S.upgradeCost; S.upgradeCost += 2; }
    upgradeFace(c, +i);
    Sfx.play('coin');
    S.upgrade = null;
    if (u.free) nextLeg(); else S.screen = 'market';
  },
  upBack() {
    const u = S.upgrade;
    if (u.crew) { u.crew = null; return; }
    S.upgrade = null;
    S.screen = u.free ? 'camp' : 'market';
  },
};

// A save made in the middle of an enemy turn picks up where it stopped.
function resumePending() {
  if (S.screen !== 'fight') return;
  const f = S.fight;
  if (f.phase === 'resolving') later(300, nextStep);
  else if (f.phase === 'enemy') enemyPhase();
  else if (f.phase === 'done') { if (f.enemy.hp <= 0) winFight(); else lose(); }
}
/* =========================================================
   Sound (synthesised with Web Audio, starts after the first tap)
   ========================================================= */
const Sfx = (() => {
  let ctx = null;
  let muted = false;
  try { muted = localStorage.getItem('caravan-mute') === '1'; } catch (err) { /* ignore */ }
  function ac() {
    if (!ctx) { const C = window.AudioContext || window.webkitAudioContext; if (!C) return null; try { ctx = new C(); } catch (err) { return null; } }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  function tone(freq, dur, type, vol, when = 0, slide = 0) {
    const c = ac(); if (!c) return;
    const t = c.currentTime + when;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq * slide), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g).connect(c.destination); o.start(t); o.stop(t + dur + 0.02);
  }
  function noise(dur, vol, when = 0, freq = 1800) {
    const c = ac(); if (!c) return;
    const t = c.currentTime + when;
    const len = Math.max(1, Math.floor(c.sampleRate * dur));
    const buf = c.createBuffer(1, len, c.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const s = c.createBufferSource(); s.buffer = buf;
    const f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = 1.2;
    const g = c.createGain(); g.gain.value = vol;
    s.connect(f).connect(g).connect(c.destination); s.start(t);
  }
  const P = {
    roll() { for (let i = 0; i < 7; i++) noise(0.045, 0.35, i * 0.055 + Math.random() * 0.03, 2200 + Math.random() * 1800); },
    land() { noise(0.06, 0.4, 0, 1100); },
    hit() { tone(150, 0.25, 'sine', 0.35, 0, 0.4); noise(0.12, 0.3, 0, 700); },
    hurt() { tone(95, 0.35, 'triangle', 0.3, 0, 0.5); noise(0.22, 0.25, 0, 420); },
    block() { tone(880, 0.18, 'triangle', 0.12); tone(1320, 0.24, 'sine', 0.08, 0.02); },
    coin() { tone(1568, 0.08, 'square', 0.05); tone(2093, 0.16, 'square', 0.045, 0.07); },
    click() { tone(680, 0.05, 'triangle', 0.06); },
    win() { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.28, 'triangle', 0.12, i * 0.11)); },
    lose() { [392, 330, 262].forEach((f, i) => tone(f, 0.45, 'triangle', 0.12, i * 0.2)); },
  };
  return {
    play(n) { if (muted) return; try { P[n] && P[n](); } catch (err) { /* ignore */ } },
    get muted() { return muted; },
    toggle() { muted = !muted; try { localStorage.setItem('caravan-mute', muted ? '1' : '0'); } catch (err) { /* ignore */ } if (!muted) ac(); },
    unlock() { if (!muted) ac(); },
  };
})();

/* =========================================================
   Flat art: characters, wagons and enemies drawn as SVG
   ========================================================= */
// Darken a hex colour (amt 0..1).
function shade(hex, amt = 0.18) {
  const n = parseInt(hex.slice(1), 16);
  const f = (v) => Math.round(v * (1 - amt)).toString(16).padStart(2, '0');
  return `#${f(n >> 16)}${f((n >> 8) & 255)}${f(n & 255)}`;
}

// How each person looks. Side view, facing right, feet at (0, 0), about 92 units tall.
const LOOKS = {

function figure(L) {
  const hw = L.thin ? 10.5 : 13, sw = L.thin ? 8.5 : 10;
  const coat2 = shade(L.coat, 0.2);
  const s = [];
  s.push('<ellipse cx="0" cy="0" rx="16" ry="3" fill="#000" opacity=".14"/>');
  if (L.cloak) s.push(`<path d="M-7 -64C-19 -52 -24 -34 -23 -16L-19.5 -20L-16.5 -13L-13 -19L-9.5 -13L-6 -21L-4 -62Z" fill="${L.cloak}"/>`);
  s.push(`<g transform="translate(-2,-61) rotate(14)"><rect x="-3.4" y="0" width="6.8" height="25" rx="3.4" fill="${coat2}"/><circle cx="0" cy="27" r="3.2" fill="${L.skin}"/></g>`);
  s.push(`<rect x="-7" y="-36" width="7.5" height="30" fill="${shade(L.pants)}"/><path d="M-8 -7h10v7h-11z" fill="${L.boots}"/>`);
  s.push(`<rect x="0" y="-36" width="7.5" height="30" fill="${L.pants}"/><path d="M-1 -7h9q5 0 5 4v3h-14z" fill="${L.boots}"/>`);
  // Long coat with a frayed hem and a patch, so it reads as worn travelling clothes.
  s.push(`<path d="M${-sw} -66L${sw} -66L${hw} -24L${hw - 3} -21L${hw - 6} -24L${hw - 9} -21.5L${-hw + 3} -22L${-hw} -24Z" fill="${L.coat}"/>`);
  s.push(`<rect x="1.5" y="-35" width="5" height="5" fill="${coat2}"/>`);
  s.push(`<rect x="${-hw + 1.5}" y="-43" width="${2 * hw - 3}" height="4" fill="${L.belt}"/>`);
  if (L.bag) s.push(`<rect x="-13" y="-41" width="9" height="11" rx="2" fill="${L.bag}"/>`);
  s.push(`<rect x="-3" y="-71" width="6" height="6" fill="${L.skin}"/>`);
  if (L.scarf) s.push(`<path d="M-8 -69h16v6h-16z" fill="${L.scarf}"/><path d="M-7 -66l-10 11l3 2l10 -10z" fill="${L.scarf}"/>`);
  s.push(`<rect x="-8" y="-87" width="17" height="18" rx="5" fill="${L.skin}"/><path d="M8.5 -80l3.5 4l-3.5 1z" fill="${L.skin}"/>`);
  s.push(`<rect x="3.5" y="-81" width="2.2" height="2.6" fill="${L.eye || '#231b16'}"/><rect x="2.5" y="-84" width="5" height="1.4" fill="${shade(L.hair, 0.1)}"/>`);
  if (L.beard) s.push(`<path d="M-3 -75h12.5q0 8 -7 9q-6 0 -5.5 -9z" fill="${L.hair}"/>`);
  if (L.mask) s.push(`<path d="M0 -77h12.5v6h-12.5z" fill="${L.mask}"/>`);
  const hc = L.headC;
  if (L.head === 'helmet') s.push(`<path d="M-9 -79q0 -12 9.5 -12q9.5 0 9.5 12z" fill="${hc}"/><rect x="7.5" y="-80" width="2" height="7" fill="${hc}"/>`);
  else if (L.head === 'wrap') s.push(`<path d="M-10 -79q0 -12 10.5 -12q10 0 10 10l-0.5 3h-20z" fill="${hc}"/><rect x="-10" y="-83" width="20" height="2" fill="${shade(hc)}"/><path d="M-9 -81l-9 13l3 1.5l8 -11z" fill="${shade(hc)}"/>`);
  else if (L.head === 'hood') s.push(`<path d="M-11 -66q-3 -26 11.5 -26q12 0 12 13h-4q0 -7 -7 -7h-5v20z" fill="${hc}"/>`);
  else if (L.head === 'hat') s.push(`<rect x="-15" y="-90" width="30" height="3.5" rx="1.7" fill="${hc}"/><path d="M-8 -90q0 -9 8 -9q8 0 8 9z" fill="${hc}"/>`);
  else s.push(`<path d="M-9 -79q0 -10 9 -10q9 0 9 6h-11v5z" fill="${L.hair}"/>`);
  s.push(`<g transform="translate(3,-61)"><g class="swing"><rect x="-3.5" y="0" width="7" height="25" rx="3.5" fill="${coat2}"/><circle cx="0" cy="27" r="3.4" fill="${L.skin}"/>${WEAPONS[L.weapon] || ''}</g></g>`);
  return s.join('');
}

function wraith(big) {
  return `<g transform="scale(${big ? 1.6 : 1.1})"><g class="bob">

function siegeTower() {
  const w = '#6e4b30', d = '#5c3e27';
  let planks = '';
  for (const y of [-100, -80, -60, -40]) planks += `<rect x="-26" y="${y}" width="52" height="2" fill="${d}"/>`;
  return `<ellipse cx="0" cy="0" rx="34" ry="4" fill="#000" opacity=".14"/>
    <rect x="-26" y="-118" width="52" height="104" fill="${w}"/>${planks}
    <path d="M-32 -118L0 -136L32 -118Z" fill="${d}"/>
    <rect x="-10" y="-112" width="20" height="14" fill="#2e2219"/>
    <rect x="-3" y="-108" width="8" height="8" rx="2" fill="#9a6644"/><rect x="-4" y="-111" width="10" height="3" fill="#3a2a22"/>
    <g transform="translate(-15,-10)"><circle r="10" fill="#3b2c22"/><circle r="6" fill="${w}"/></g><g transform="translate(15,-10)"><circle r="10" fill="#3b2c22"/><circle r="6" fill="${w}"/></g>`;
}

// One enemy group. Drawn facing right, then mirrored so it faces the caravan.
function enemySvg(kind) {
  const at = (x, y, sc, inner) => `<g transform="translate(${x},${y}) scale(${sc})">${inner}</g>`;
  let g = '';
  if (kind === 'bandits') g = at(-26, -6, 0.92, figure(LOOKS.bandit)) + at(0, 0, 1, figure(LOOKS.bandit));
  else if (kind === 'king') g = at(-40, -6, 0.9, figure(LOOKS.bandit)) + at(0, 0, 1.3, figure(LOOKS.king));
  else if (kind === 'skeletons') g = at(-26, -6, 0.92, figure(LOOKS.tomb)) + at(0, 0, 1, figure(LOOKS.tomb));
  else if (kind === 'legion') g = at(-48, -8, 0.86, figure(LOOKS.tomb)) + at(-24, -4, 0.93, figure(LOOKS.tomb)) + at(0, 0, 1, figure(LOOKS.tomb));
  else if (kind === 'wraith') g = wraith(false);
  else if (kind === 'storm') g = wraith(true);
  else if (kind === 'siege') g = at(-26, 0, 1, siegeTower()) + at(16, 0, 1, figure(LOOKS.bandit));
  else if (kind === 'sentinel') g = automaton(false);
  else if (kind === 'warden') g = `<rect x="-112" y="-170" width="20" height="170" fill="#cdb894"/><rect x="-46" y="-170" width="20" height="170" fill="#cdb894"/><path d="M-116 -170h94v-14h-94z" fill="#b8a27c"/><path d="M-92 -150q23 -26 46 0z" fill="#b8a27c"/>${automaton(true)}`;
  return `<g transform="scale(-1,1)">${g}</g>`;
}

/* =========================================================
   The stage: a flat side-view scene (SVG) that follows the game state
   ========================================================= */
const Scene = (() => {
  const host = document.getElementById('scene');
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const VW = 480, VH = 270, BASE = 250;
  const CREW_X = [58, 104, 150, 196];
  const WAGON_X = [246, 176, 106, 36]; // front wagon first
  const WAGON_Y = 216;
  const ENEMY_X = 396;

  const background = `<rect width="480" height="270" fill="#f1e2c4"/>
    <circle cx="398" cy="58" r="24" fill="#f3c27c"/>
    <path d="M0 150L40 138L70 142L95 118L150 118L170 140L240 146L300 130L340 136L380 124L420 140L480 132V270H0Z" fill="#e2c193"/>
    <path d="M0 186Q60 158 130 174T262 168T400 166T480 170V270H0Z" fill="#d7ac76"/>
    <rect y="200" width="480" height="70" fill="#c99a63"/>
    <rect y="232" width="480" height="28" fill="#d3a873"/>
    <rect x="60" y="208" width="6" height="3" fill="#b4864f"/><rect x="300" y="214" width="9" height="3" fill="#b4864f"/><rect x="430" y="262" width="7" height="3" fill="#b4864f"/><rect x="190" y="264" width="10" height="3" fill="#b4864f"/>`;

  const PROPS = {
    market: `<rect x="372" y="168" width="4" height="56" fill="#5c3e27"/><rect x="452" y="168" width="4" height="56" fill="#5c3e27"/>
      <path d="M364 166h100l-8 14h-84z" fill="#a8553a"/><path d="M380 166h12l-2 14h-10zM404 166h12l-1 14h-11zM428 166h12l1 14h-12z" fill="#d8c3a0"/>
      <rect x="372" y="200" width="84" height="24" fill="#7a5a3c"/><rect x="380" y="190" width="12" height="10" fill="#c49a4a"/><circle cx="410" cy="195" r="6" fill="#8a4a2a"/><rect x="424" y="188" width="16" height="12" fill="#a08660"/>`,
    camp: `<path d="M398 222L428 176L458 222Z" fill="#8f7d60"/><path d="M420 222L428 196L436 222Z" fill="#5a4a38"/>
      <rect x="320" y="246" width="26" height="5" rx="2" fill="#5c3e27" transform="rotate(-12 333 248)"/><rect x="320" y="246" width="26" height="5" rx="2" fill="#4a3426" transform="rotate(14 333 248)"/>
      <path class="flicker" d="M324 246q9 -30 9 -30q9 18 9 30z" fill="#e8892e"/><path class="flicker" d="M328 246q5 -18 5 -18q5 10 5 18z" fill="#f6c454"/>`,
    victory: `<rect x="372" y="120" width="108" height="104" fill="#cdb894"/><path d="M372 120h108v-10h-108z" fill="#b8a27c"/>
      <path d="M372 110h10v-8h-10zM394 110h10v-8h-10zM416 110h10v-8h-10zM438 110h10v-8h-10zM460 110h10v-8h-10z" fill="#b8a27c"/>
      <path d="M404 224v-50q22 -26 44 0v50z" fill="#4a3a2c"/>`,
  };

  host.insertAdjacentHTML('afterbegin', `<svg class="stage" viewBox="0 0 ${VW} ${VH}" role="img" aria-label="Your caravan on the road">
    ${background}<g id="st-props"></g><g id="st-wagons"></g><g id="st-enemy"></g><g id="st-crew"></g></svg>`);
  const L = (id) => host.querySelector(`#${id}`);
  const layers = { props: L('st-props'), wagons: L('st-wagons'), enemy: L('st-enemy'), crew: L('st-crew') };
  const keys = { props: null, wagons: null, enemy: null, crew: null };
  const crewPos = {};
  let enemyEl = null, dying = false;
  const handlers = { crew: null };

  const tr = (x, y) => `transform:translate(${x}px,${y}px)`;
  const anim = (el, frames, opts) => { if (!el || reduced) return null; return el.animate(frames, opts); };

  function floatAt(x, y, text, cls, delay = 0) {
    setTimeout(() => {
      const el = document.createElement('div');
      el.className = `float ${cls || ''}`;
      el.textContent = text;
      el.style.left = `${(x / VW) * 100}%`;
      el.style.top = `${(y / VH) * 100}%`;
      host.appendChild(el);
      el.addEventListener('animationend', () => el.remove());
      setTimeout(() => el.remove(), 2000);
    }, delay);
  }

  const crewEl = (id) => layers.crew.querySelector(`[data-crew="${id}"]`);
  const wagonEl = (type) => layers.wagons.querySelector(`[data-wagon="${type}"]`);

  function swing(el, delay = 0) {
    const arm = el && el.querySelector('.swing');
    anim(arm, [{ transform: 'rotate(0deg)' }, { transform: 'rotate(-165deg)', offset: 0.4 }, { transform: 'rotate(-35deg)', offset: 0.75 }, { transform: 'rotate(0deg)' }], { duration: 420, delay, easing: 'ease-out' });
  }
  function knock(el, dx, delay = 0) {
    anim(el && el.querySelector('.mover'), [{ transform: 'translateX(0)' }, { transform: `translateX(${dx}px)`, offset: 0.3 }, { transform: 'translateX(0)' }], { duration: 360, delay });
  }

  function play(list) {
    for (const f of list) {
      if (f.k === 'strike') {
        const el = crewEl(f.id);
        swing(el, 260);
        setTimeout(() => {
          knock(enemyEl, 10);
          Sfx.play('hit');
          floatAt(ENEMY_X - 6, 128, f.dmg > 0 ? `−${f.dmg}` : '0', 't-atk');
          if (f.absorbed) floatAt(ENEMY_X - 6, 156, `${f.absorbed} absorbed`, 't-shd small', 120);
        }, 430);
      }
      if (f.k === 'act') {
        setTimeout(() => {
          const el = crewEl(f.id), p = crewPos[f.id] || { x: 150, y: BASE };
          anim(el && el.querySelector('.mover'), [{ transform: 'translateY(0)' }, { transform: 'translateY(-7px)', offset: 0.4 }, { transform: 'translateY(0)' }], { duration: 380 });
          floatAt(p.x, p.y - 104, f.text, f.cls);
          if (f.sfx) Sfx.play(f.sfx);
        }, 320);
      }
      if (f.k === 'bell') { knock(enemyEl, 8); Sfx.play('hit'); floatAt(ENEMY_X - 6, 128, `Bell −${f.dmg}`, 't-coin'); }
      if (f.k === 'gain') {
        floatAt(WAGON_X[0], 150, f.text, f.cls, f.delay || 0);
        if (f.sfx) setTimeout(() => Sfx.play(f.sfx), f.delay || 0);
      }
      if (f.k === 'eshot') {
        anim(enemyEl && enemyEl.querySelector('.mover'), [{ transform: 'translateX(0)' }, { transform: 'translateX(-46px)', offset: 0.45 }, { transform: 'translateX(0)' }], { duration: 560, easing: 'ease-in-out' });
        if (enemyEl) enemyEl.querySelectorAll('.swing').forEach((a, i) => anim(a, [{ transform: 'rotate(0deg)' }, { transform: 'rotate(-165deg)', offset: 0.4 }, { transform: 'rotate(-35deg)', offset: 0.75 }, { transform: 'rotate(0deg)' }], { duration: 420, delay: 80 + i * 60 }));
        setTimeout(() => {
          const w = wagonEl(f.id);
          const x = WAGON_X[Math.max(0, S.wagons.findIndex((v) => v.type === f.id))];
          if (f.blocked) { floatAt(x, 140, 'Blocked', 't-shd'); Sfx.play('block'); }
          else {
            anim(w && w.querySelector('.mover'), [{ transform: 'translateX(0)' }, { transform: 'translateX(-4px)' }, { transform: 'translateX(4px)' }, { transform: 'translateX(-2px)' }, { transform: 'translateX(0)' }], { duration: 360 });
            floatAt(x, 140, `−${f.dmg}`, 't-atk');
            Sfx.play('hurt');
          }
        }, 300);
      }
      if (f.k === 'edown' && enemyEl) {
        dying = true;
        const el = enemyEl;
        const done = () => { el.style.opacity = '0'; dying = false; };
        const a = anim(el.querySelector('.mover'), [{ opacity: 1, transform: 'translateY(0)' }, { opacity: 0, transform: 'translateY(16px)' }], { duration: 900, delay: 500, fill: 'forwards' });
        if (a) a.finished.then(done); else setTimeout(done, 600);
      }
    }
  }

  function sync(state) {
    const scr = state ? state.screen : 'title';
    const f = state && state.fight;

    const propKey = scr === 'market' || (scr === 'upgrade' && state.upgrade && !state.upgrade.free) ? 'market' : scr === 'camp' ? 'camp' : scr === 'victory' ? 'victory' : '';
    if (propKey !== keys.props) { layers.props.innerHTML = PROPS[propKey] || ''; keys.props = propKey; }

    const wagons = state ? state.wagons.map((w) => w.type) : ['supply', 'armory'];
    const wk = wagons.join(',');
    if (wk !== keys.wagons) {
      layers.wagons.innerHTML = wagons.map((t, i) => `<g data-wagon="${t}" style="${tr(WAGON_X[i], WAGON_Y)}"><g class="mover">${wagonSvg(t)}</g></g>`).reverse().join('');
      keys.wagons = wk;
    }

    const ek = scr === 'fight' && f ? f.id : null;
    if (ek && ek !== keys.enemy) {
      layers.enemy.innerHTML = `<g class="enemy" style="${tr(ENEMY_X, BASE)}"><g class="mover"><g class="fig">${enemySvg(f.kind)}</g></g></g>`;
      enemyEl = layers.enemy.firstElementChild; dying = false; keys.enemy = ek;
    }
    if (enemyEl && !dying) enemyEl.style.opacity = scr === 'fight' && f && f.enemy.hp > 0 ? '1' : '0';

    const crew = state ? state.crew.map((c) => c.id) : START_CREW;
    const ck = crew.join(',');
    if (ck !== keys.crew) {
      layers.crew.innerHTML = crew.map((id) => `<g class="pos" data-crew="${id}" style="${tr(150, BASE)}"><g class="mover">
          <ellipse class="ring" cx="0" cy="1" rx="17" ry="4.5" fill="none" stroke="#ef8a26" stroke-width="2.5" opacity="0"/>
          <g class="fig">${figure(LOOKS[id])}</g></g></g>`).join('');
      keys.crew = ck;
    }
    const R = scr === 'fight' ? f : null;
    const activeDie = R && R.active != null ? R.dice[R.active] : null;
    crew.forEach((id, i) => {
      const el = crewEl(id); if (!el) return;
      let x = CREW_X[i], y = BASE;
      const picked = R && R.phase === 'pick' && R.selected.includes(id);
      const rolled = R && R.phase !== 'pick' && R.dice.some((d) => d.crew === id);
      if (picked || rolled) y += 6;
      if (activeDie && activeDie.crew === id) { x = activeDie.face.t === 'atk' ? ENEMY_X - 58 : 270; y = BASE + 4; }
      if (scr === 'camp') { x = [262, 294, 372, 404][i] || 300; y = BASE - (i % 2) * 5; }
      crewPos[id] = { x, y };
      el.style.transform = `translate(${x}px,${y}px)`;
      el.classList.toggle('walking', scr === 'map');
      el.classList.toggle('fallen', scr === 'defeat');
      el.querySelector('.ring').setAttribute('opacity', picked ? '1' : '0');
    });
  }

  host.addEventListener('click', (ev) => {
    const g = ev.target.closest('[data-crew]');
    if (g && handlers.crew) handlers.crew(g.dataset.crew);
  });

  return { sync, play, handlers };
})();

/* =========================================================
   Rendering (DOM)
   ========================================================= */
function headerHtml() {
  const muteBtn = `<button class="iconbtn" data-act="mute" aria-label="${Sfx.muted ? 'Turn sound on' : 'Turn sound off'}">${icon(Sfx.muted ? 'mute' : 'sound')}</button>`;
  if (!S) return `<header class="top"><div class="brand">Caravan</div><div class="res">${muteBtn}</div></header>`;
  const p = S.pos;
  const dots = [0, 1, 2, 3].map((r) => {
    const cls = r < p.row || (r === p.row && S.screen === 'map') ? 'done' : r === p.row ? 'here' : '';
    return `<span class="dot ${cls} ${r === 3 ? 'boss' : ''}"></span>`;
  }).join('');
  return `<header class="top">
    <div class="brand">Caravan</div>
    <div class="res">
      <span class="chip coin" title="Coin">${icon('coin')}<span class="num">${S.coin}</span></span>
      ${muteBtn}
    </div>
    <div class="road"><span>Leg ${S.leg + 1} of ${LEGS.length}</span><b>${LEGS[S.leg].name}</b><span class="dots">${dots}</span></div>
  </header>`;
}

function overlayHtml() {
  if (!S) return '';
  let ctx = '';
  if (S.screen === 'fight') {
    const e = S.fight.enemy;
    ctx = `<div class="ctx">
      <div class="row"><b>${e.name}</b><span class="hp">${e.hp}/${e.max}</span></div>
      <div class="bar"><span style="width:${(100 * e.hp) / e.max}%"></span></div>
    </div>`;
  }
  const mx = maxHp();
  return `${ctx || '<span></span>'}<div class="ctx">
      <div class="row"><b>Caravan</b><span class="hp" style="color:var(--heal)">${S.hp}/${mx}</span></div>
      <div class="bar fill-ok"><span style="width:${(100 * S.hp) / mx}%"></span></div>
    </div>`;
}

function faceHtml(f, bonus = 0) {
  return `<span class="face t-${f.t}">${icon(f.t)}${hasValue(f) ? `<span class="num">${f.v + bonus}</span>` : ''}</span>`;
}
function miniFaces(c, act) {
  return c.faces.map((fc, i) => {
    const inner = `${icon(fc.t)}${hasValue(fc) ? fc.v : ''}`;
    if (!act) return `<span class="mini t-${fc.t}" title="${faceLabel(fc)}">${inner}</span>`;
    return `<button class="mini t-${fc.t}" data-act="${act}" data-arg="${i}" ${fc.t === 'heal' ? 'disabled' : ''} aria-label="Upgrade ${faceLabel(fc)}">${inner}</button>`;
  }).join('');
}
function crewCard(c, act, opts = {}) {
  return `<button class="crew ${opts.sel ? 'sel' : ''}" data-act="${act}" data-arg="${c.id}" ${opts.disabled ? 'disabled' : ''} ${opts.sel != null ? `aria-pressed="${!!opts.sel}"` : ''}>
    ${opts.sel ? '<span class="badge">Rolling</span>' : ''}
    <span class="head"><span class="tile">${portrait(c.id)}</span><span class="nm"><b>${c.name}</b><span class="role">${c.role}</span></span></span>
    <span class="faces">${miniFaces(c)}</span>
  </button>`;
}

function fightHtml() {
  const f = S.fight, it = intentText(f.intent);
  let body, actions;
  if (f.phase === 'pick') {
    body = `<div class="label"><span>Choose two to roll</span><span>${f.selected.length}/${Math.min(DICE_PER_TURN, S.crew.length)}</span></div>
      <div class="roster">${S.crew.map((c) => crewCard(c, 'pick', { sel: f.selected.includes(c.id) })).join('')}</div>`;
    actions = `<button class="btn primary" data-act="roll" ${f.selected.length ? '' : 'disabled'}>Roll ${f.selected.length} crew</button>`;
  } else {
    const t = totals(f);
    const dice = f.dice.map((d, i) => {
      const c = crewById(d.crew);
      const bonus = (d.face.t === 'atk' && c.role === 'Guard' && has('armory') ? 1 : 0) + (d.face.t === 'coin' && has('spice') ? 1 : 0);
      const st = f.active === i ? 'acting' : d.done ? 'spent' : '';
      return `<button class="die ${d.held && f.phase === 'roll' ? 'held' : ''} ${d.fresh ? 'tumble' : ''} ${st}" data-act="hold" data-arg="${i}" ${f.phase === 'roll' ? '' : 'disabled'} aria-pressed="${d.held}" aria-label="${c.name}: ${faceLabel(d.face)}${d.held ? ', held' : ''}">
        ${d.held && f.phase === 'roll' ? '<span class="held-tag">Held</span>' : ''}${faceHtml(d.face, bonus)}<span class="who">${c.name}</span></button>`;
    }).join('');
    const sum = [`<span class="t-atk">${icon('atk')}<span class="num">${Math.max(0, t.atk - f.enemy.block)}</span>&nbsp;damage</span>`,
      `<span class="t-shd">${icon('shd')}<span class="num">${t.shd}</span>&nbsp;block</span>`];
    if (t.coin) sum.push(`<span class="t-coin">${icon('coin')}+${t.coin}</span>`);
    if (t.heal) sum.push(`<span class="t-heal">${icon('heal')}+${t.heal}</span>`);
    body = `<div class="label"><span>${f.phase === 'roll' ? 'Tap a die to keep it' : f.phase === 'resolving' ? 'Your crew acts' : 'Enemy turn'}</span><span></span></div>
      <div class="tray">${dice}</div><div class="preview">${sum.join('')}</div>`;
    actions = f.phase === 'roll'
      ? `<button class="btn" data-act="reroll" ${f.rerolls > 0 && f.dice.some((d) => !d.held) ? '' : 'disabled'}>Reroll<small>${f.rerolls} left</small></button>
         <button class="btn primary" data-act="end">End turn</button>`
      : `<button class="btn primary" disabled>${f.phase === 'resolving' ? 'Your crew acts…' : f.phase === 'enemy' ? `${f.enemy.name} attacks…` : 'Fight over'}</button>`;
  }
  return `
  <div class="intent ${f.phase === 'enemy' ? 'acting' : ''}">
    <span class="tile">${icon(it.icon)}</span>
    <span class="txt"><span class="eyebrow">Enemy's next move</span><strong>${it.title}</strong><span class="detail">${it.detail}</span></span>
  </div>
  <section class="stack" style="gap:10px">${body}</section>
  <div class="actions">${actions}</div>`;
}

function mapHtml() {
  const leg = S.map[S.leg], p = S.pos;
  const reachKeys = reachable().map((n) => n.key);
  const X = (lane) => ((lane + 0.5) / 3) * 100;
  const Y = (row) => ((4 - (row + 1) + 0.5) / 5) * 100; // start at the bottom, boss at the top
  const lines = [];
  const link = (r1, l1, r2, l2, hot) => lines.push(`<line x1="${X(l1) * 3}" y1="${Y(r1) * 3.4}" x2="${X(l2) * 3}" y2="${Y(r2) * 3.4}" stroke="${hot ? '#ef8a26' : '#d6c5a5'}" stroke-width="${hot ? 3 : 2}" stroke-dasharray="${hot ? '0' : '5 5'}" stroke-linecap="round"/>`);
  leg.rows[0].forEach((n) => link(-1, 1, 0, n.lane, p.row === -1));
  for (let r = 0; r < 2; r++) for (const a of leg.rows[r]) for (const b of leg.rows[r + 1]) if (Math.abs(a.lane - b.lane) <= 1) link(r, a.lane, r + 1, b.lane, p.row === r && p.lane === a.lane);
  leg.rows[2].forEach((n) => link(2, n.lane, 3, 1, p.row === 2 && p.lane === n.lane));
  const node = (row, lane, type) => {
    const key = row === 3 ? 'boss' : `${row}-${lane}`;
    const here = p.row === row && p.lane === lane;
    const visited = S.visited.includes(`${S.leg}-${row}-${lane}`);
    const can = reachKeys.includes(key);
    const label = type === 'boss' ? ENEMY_TYPES[LEGS[S.leg].boss].name.replace('The ', '') : NODE_INFO[type].label;
    const cls = [here ? 'here' : visited ? 'visited' : can ? 'reach' : (row <= p.row ? 'far' : ''), type === 'boss' ? 'boss' : ''].join(' ');
    return `<button class="node ${cls}" data-t="${type}" style="left:${X(lane)}%;top:${Y(row)}%" ${can ? `data-act="go" data-arg="${key}"` : 'tabindex="-1" aria-disabled="true"'} aria-label="${label}${can ? ', go here' : ''}">
      <span class="disc">${icon(NODE_INFO[type].icon)}</span><span class="nl">${label}</span></button>`;
  };
  const nodes = [`<div class="node ${p.row === -1 ? 'here' : 'visited'}" style="left:${X(1)}%;top:${Y(-1)}%"><span class="disc">${icon('flag')}</span><span class="nl">Start</span></div>`];
  leg.rows.forEach((row, r) => row.forEach((n) => nodes.push(node(r, n.lane, n.type))));
  nodes.push(node(3, 1, 'boss'));
  return `<section class="panel">
    <p>${S.log[0] || ''} Tap a glowing stop to move on.</p>
    <div class="map">
      <svg class="lines" viewBox="0 0 300 340" preserveAspectRatio="none" aria-hidden="true">${lines.join('')}</svg>
      ${nodes.join('')}
    </div>
  </section>`;
}

function choice(act, arg, ic, cls, title, desc, opts = {}) {
  return `<button class="choice ${opts.done ? 'done' : ''}" data-act="${act}" data-arg="${arg}" ${opts.disabled ? 'disabled' : ''}>
    <span class="tile ${cls}">${ic.startsWith('<') ? ic : icon(ic)}</span>
    <span class="txt"><b>${title}</b><span class="d">${desc}</span></span>
    ${opts.price != null ? `<span class="price">${icon('coin')}${opts.price}</span>` : ''}
  </button>`;
}

function campHtml() {
  return `<section class="panel">
    <h1>${ENEMY_TYPES[S.fight.kind].name} is beaten</h1>
    <p>The caravan is fully repaired. Choose one before you set out for ${LEGS[S.leg + 1].name}.</p>
    <div class="choices">
      ${choice('camp', 'train', 'atk', 't-atk', 'Train', 'Upgrade any one face.')}
      ${choice('camp', 'spoils', 'coin', 't-coin', 'Take the spoils', '+12 coin for the markets ahead.')}
    </div>
  </section>`;
}

function marketHtml() {
  const m = S.market;
  const items = [];
  if (m.wagon) {
    const key = `wagon:${m.wagon}`, bought = m.bought.includes(key), def = WAGON_TYPES[m.wagon];
    items.push(choice('buy', key, 'cart', '', `Buy a ${def.name}`, bought ? 'Bought.' : `+${def.hp} caravan health. ${def.perk}`,
      { price: PRICES.wagon, done: bought, disabled: bought || S.coin < PRICES.wagon || S.wagons.length >= MAX_WAGONS }));
  }
  items.push(choice('buy', 'upgrade', 'atk', 't-atk', 'Upgrade a face', '+2 to one face, or a blank becomes Attack 3.', { price: S.upgradeCost, disabled: S.coin < S.upgradeCost }));
  items.push(choice('buy', 'repair', 'heal', 't-heal', 'Repairs', `+${REPAIR} caravan health.`, { price: PRICES.repair, disabled: S.coin < PRICES.repair || S.hp >= maxHp() }));
  return `<section class="panel">
    <h1>Market</h1>
    <div class="choices">${items.join('')}</div>
    <button class="btn primary solo" data-act="leave">Leave</button>
  </section>`;
}

function upgradeHtml() {
  const u = S.upgrade;
  const cost = u.free ? 'Free' : `${S.upgradeCost} coin`;
  if (!u.crew) {
    return `<section class="panel">
      <h1>Who trains?</h1>
      <p>${cost}.</p>
      <div class="roster">${S.crew.map((c) => crewCard(c, 'upCrew')).join('')}</div>
      <button class="btn solo" data-act="upBack">Back</button>
    </section>`;
  }
  const c = crewById(u.crew);
  return `<section class="panel">
    <h1>Pick one of ${c.name}'s faces</h1>
    <p>It gets +2, or a blank becomes Attack 3. ${cost}.</p>
    <div class="card" style="padding:12px"><div class="faces" style="gap:8px">${miniFaces(c, 'upFace')}</div></div>
    <button class="btn solo" data-act="upBack">Back</button>
  </section>`;
}

function endHtml(won) {
  return `<section class="panel">
    <h1>${won ? 'You reached the city' : 'The caravan fell'}</h1>
    <p>${won ? 'The Gate Warden fell and the caravan rolled through the gate.' : `${S.log[0]} Every run starts fresh, so try a different route.`}</p>
    <div class="stats">
      <div class="stat"><b class="num">${S.stats.fights}</b><span>fights</span></div>
      <div class="stat"><b class="num">${S.stats.dmg}</b><span>damage dealt</span></div>
      <div class="stat"><b class="num">${S.stats.coinEarned}</b><span>coin earned</span></div>
    </div>
    <button class="btn primary solo" data-act="newRun">Ride again</button>
  </section>`;
}

function titleHtml() {
  const s = loadSave();
  const cont = s ? `<button class="btn primary solo" data-act="resume">Continue<small>Leg ${s.leg + 1}: ${LEGS[s.leg].name}</small></button>` : '';
  return `<section class="panel hero">
    <h1>Cross the desert, one roll at a time</h1>
    <p>Four travellers, four dice. Each turn, choose two of them to roll, keep the faces you like, reroll the rest, then watch them act one by one. Attack hurts the enemy, Block stops its next hit, Coin pays at markets and Mend repairs the caravan.</p>
    <div class="cta">${cont}<button class="btn ${s ? '' : 'primary'} solo" data-act="newRun">${s ? 'New run' : 'Start'}</button></div>
  </section>`;
}

const VIEWS = { map: mapHtml, fight: fightHtml, camp: campHtml, market: marketHtml, upgrade: upgradeHtml, victory: () => endHtml(true), defeat: () => endHtml(false) };

function render() {
  document.getElementById('top').innerHTML = headerHtml();
  document.getElementById('overlay').innerHTML = overlayHtml();
  document.getElementById('app').innerHTML = S ? VIEWS[S.screen]() : titleHtml();
  if (Scene) { Scene.play(pendingFx); Scene.sync(S); }
  pendingFx = [];
  if (S && S.fight) for (const d of S.fight.dice) d.fresh = false;
  save();
}

function act(name, arg) {
  if (!A[name]) return;
  Sfx.unlock();
  const prev = S && S.screen;
  A[name](arg);
  render();
  if (S && S.screen !== prev) document.getElementById('app').scrollTop = 0;
}
document.getElementById('root').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]');
  if (!b || b.disabled) return;
  act(b.dataset.act, b.dataset.arg);
});
if (Scene) {
  Scene.handlers.crew = (id) => act('pick', id);
  Scene.handlers.die = (i) => act('hold', i);
}

function start(saved) {
  if (saved && saved.S) S = saved.S;
  render();
}
window.claude?.hot?.snapshot?.(() => ({ S }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
</body>
</html>
