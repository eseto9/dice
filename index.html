<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Caravan Dice</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=DM+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: one light column. A low-poly diorama of the fight sits on top, then the enemy's move, wagons, dice, crew, and a sticky action bar.
   Single light look on purpose: clean white page, beige icon tiles, orange accent, soft shadows. */
:root {
  --bg: #fafaf8;
  --card: #ffffff;
  --tile: #f3ede3;
  --line: #e9e4db;
  --ink: #262b29;
  --muted: #6a6f6b;
  --accent: #ef8a26;
  --accent-ink: #ffffff;
  --atk: #d4532d;
  --shd: #477b9b;
  --coin: #b9860c;
  --water: #2f8ea6;
  --heal: #5f9334;
  --rr: #8466ad;
  --shadow: 0 1px 0 rgba(70, 50, 20, 0.05), 0 6px 18px rgba(70, 50, 20, 0.08);
  --font-display: 'Poppins', 'Segoe UI', system-ui, sans-serif;
  --font-body: 'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: light;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.4;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.ic { width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.num { font-variant-numeric: tabular-nums; }

.shell {
  max-width: 600px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px 0;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.stack { display: flex; flex-direction: column; gap: 16px; }

/* Header */
.top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 1.75rem; line-height: 1; letter-spacing: -0.01em; display: flex; flex-direction: column; gap: 8px; }
.brand::after { content: ""; width: 40px; height: 5px; border-radius: 3px; background: var(--accent); }
.res { display: flex; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 999px; background: var(--card); box-shadow: var(--shadow); font-weight: 700; font-variant-numeric: tabular-nums; }
.chip.water .ic { color: var(--water); }
.chip.coin .ic { color: var(--coin); }
.road { display: flex; align-items: center; gap: 6px; width: 100%; font-size: 0.82rem; color: var(--muted); }
.road .leg { flex: 1; height: 3px; border-radius: 2px; background: var(--line); }
.road .stop { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.road .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--line); }
.road .stop.done .dot { background: var(--accent); }
.road .stop.here { color: var(--ink); font-weight: 700; }
.road .stop.here .dot { background: var(--card); border: 3px solid var(--accent); }
@media (max-width: 430px) { .road .stop:not(.here) .label { display: none; } }

/* Diorama */
.scene {
  position: relative;
  width: 100%;
  max-width: 100%;
  aspect-ratio: 16 / 10.5;
  max-height: 380px;
  margin-inline: auto;
}
.scene canvas { display: block; width: 100% !important; height: 100% !important; }
.scene .overlay { position: absolute; left: 0; top: 0; pointer-events: none; }
.hpcard { background: var(--card); box-shadow: var(--shadow); border-radius: 12px; padding: 8px 12px; display: flex; flex-direction: column; gap: 5px; min-width: 150px; }
.hpcard .row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.hpcard b { font-family: var(--font-display); font-weight: 600; font-size: 0.98rem; }
.hpcard .hp { font-weight: 700; color: var(--atk); font-variant-numeric: tabular-nums; font-size: 0.9rem; }
.hpcard .block { font-size: 0.78rem; color: var(--shd); font-weight: 700; display: flex; align-items: center; gap: 4px; }
.bar { height: 7px; border-radius: 4px; background: var(--tile); overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--atk); border-radius: 4px; transition: width 400ms ease; }
.bar.fill-acc > span { background: var(--accent); }
.bar.fill-ok > span { background: var(--heal); }

/* Shared */
.label { font-size: 0.78rem; font-weight: 700; color: var(--muted); display: flex; align-items: center; gap: 8px; justify-content: space-between; }
.label > span:first-child { display: flex; align-items: center; gap: 8px; color: var(--ink); }
.label > span:first-child::before { content: ""; width: 3px; height: 14px; border-radius: 2px; background: var(--accent); }
.tile { background: var(--tile); border-radius: 12px; display: flex; align-items: center; justify-content: center; flex: none; }

/* Intent */
.intent { display: flex; gap: 14px; align-items: center; padding: 12px; border-radius: 16px; background: var(--card); box-shadow: var(--shadow); }
.intent .tile { width: 56px; height: 56px; font-size: 1.7rem; color: var(--atk); }
.intent .txt { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.intent .eyebrow { font-size: 0.75rem; font-weight: 700; color: var(--muted); }
.intent strong { font-family: var(--font-display); font-weight: 600; font-size: 1.05rem; line-height: 1.25; }
.intent .detail { font-size: 0.88rem; color: var(--muted); }
.intent.cancelled { opacity: 0.55; }
.intent.cancelled strong { text-decoration: line-through; }

/* Wagons */
.wagons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.wagon { padding: 10px; border-radius: 14px; background: var(--card); box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 6px; min-width: 0; border: 2px solid transparent; }
.wagon .wtop { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
.wagon .wname { font-family: var(--font-display); font-weight: 600; font-size: 0.95rem; }
.wagon .perk { font-size: 0.8rem; color: var(--muted); }
.wagon.rear { border-color: color-mix(in srgb, var(--atk) 35%, transparent); }
.wagon.dead { opacity: 0.5; }
.tag { font-size: 0.7rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.tag.target { color: var(--atk); background: color-mix(in srgb, var(--atk) 12%, transparent); }
.tag.out { color: var(--muted); background: var(--tile); }
.tag.go { color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); }

/* Dice */
.tray { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.slot { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.die {
  aspect-ratio: 1; width: 100%; max-width: 100%;
  border-radius: 18px; border: 0; background: var(--card);
  box-shadow: 0 4px 0 #e6dccb, 0 10px 20px rgba(70, 50, 20, 0.1);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  cursor: pointer; position: relative; padding: 4px;
}
.die .face { display: flex; align-items: center; gap: 4px; font-family: var(--font-display); font-weight: 700; font-size: clamp(1.5rem, 7vw, 2.2rem); line-height: 1; }
.die .face .ic { font-size: 0.75em; }
.die .who { font-size: 0.72rem; color: var(--muted); font-weight: 700; margin-top: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.die.held { box-shadow: 0 0 0 3px var(--accent), 0 4px 0 3px #f3c08d, 0 10px 20px rgba(70, 50, 20, 0.1); }
.die .held-tag { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); background: var(--accent); color: var(--accent-ink); font-size: 0.66rem; font-weight: 700; padding: 1px 8px; border-radius: 999px; }
.die.empty { cursor: default; box-shadow: none; background: transparent; border: 2px dashed var(--line); }
.die.empty .who { color: var(--muted); }
.die.ready { background: var(--tile); border: 0; box-shadow: none; }
.die.ready .face { color: #c9b89a; font-size: 1.5rem; }
.die.ready .who { color: var(--ink); }
.t-atk { color: var(--atk); } .t-shd { color: var(--shd); } .t-coin { color: var(--coin); }
.t-water { color: var(--water); } .t-heal { color: var(--heal); } .t-rr { color: var(--rr); } .t-blank { color: #b9b2a6; }
.pour { border: 0; background: var(--card); box-shadow: var(--shadow); color: var(--water); border-radius: 10px; padding: 5px 0; font-size: 0.8rem; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 3px; cursor: pointer; }
.pour:disabled { opacity: 0.35; cursor: default; box-shadow: none; background: transparent; }
.pour.done { color: #fff; background: var(--water); opacity: 1; }
.tumble { animation: tumble 420ms cubic-bezier(.3,1.4,.5,1); }
@keyframes tumble { 0% { transform: rotate(-160deg) scale(.6); opacity: 0.2; } 100% { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .tumble { animation: none; } .bar > span { transition: none; } }

.preview { display: flex; flex-wrap: wrap; gap: 6px 14px; font-weight: 700; font-size: 0.95rem; min-height: 1.4em; }
.preview span { display: inline-flex; align-items: center; gap: 4px; }
.preview .hint { font-weight: 400; color: var(--muted); }
.log { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 3px; font-size: 0.88rem; color: var(--muted); }
.log li:first-child { color: var(--ink); font-weight: 500; }

/* Crew */
.roster { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (min-width: 560px) { .roster { grid-template-columns: repeat(3, 1fr); } }
.crew { text-align: left; padding: 10px; border-radius: 16px; background: var(--card); box-shadow: var(--shadow); border: 2px solid transparent; display: flex; flex-direction: column; gap: 8px; cursor: pointer; min-width: 0; }
.crew .head { display: flex; gap: 10px; align-items: center; min-width: 0; }
.crew .tile { width: 40px; height: 40px; border-radius: 10px; }
.crew .tile svg { width: 26px; height: 26px; }
.crew .nm { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.crew .nm b { font-family: var(--font-display); font-weight: 600; font-size: 1rem; line-height: 1.15; }
.crew .role { font-size: 0.78rem; color: var(--muted); }
.crew .head .tag { align-self: flex-start; }
.crew.sel { border-color: var(--accent); }
.crew.ko { opacity: 0.45; cursor: not-allowed; }
.crew:disabled { cursor: default; }
.faces { display: grid; grid-template-columns: repeat(6, 1fr); gap: 3px; }
.mini { aspect-ratio: 1; max-width: 100%; border-radius: 6px; background: var(--tile); display: flex; align-items: center; justify-content: center; gap: 1px; font-size: 0.7rem; font-weight: 700; }
.mini .ic { font-size: 0.78rem; }

/* Actions */
.actions {
  position: sticky; bottom: 0; z-index: 5;
  margin-left: calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
  margin-right: calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(8px);
  border-top: 1px solid var(--line);
  display: flex; gap: 8px;
}
.btn { flex: 1; min-height: 52px; border-radius: 14px; border: 0; background: var(--card); box-shadow: var(--shadow); font-family: var(--font-display); font-weight: 600; font-size: 1rem; cursor: pointer; padding: 6px 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.15; }
.btn small { font-family: var(--font-body); font-weight: 500; font-size: 0.75rem; color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-ink); flex: 1.4; box-shadow: 0 4px 0 #c96d14, 0 8px 16px rgba(239, 138, 38, 0.25); }
.btn.primary small { color: inherit; opacity: 0.85; }
.btn:disabled { opacity: 0.4; cursor: default; }
.btn:not(:disabled):active { transform: translateY(2px); }

details.help { font-size: 0.92rem; color: var(--muted); padding-bottom: 6px; }
details.help summary { cursor: pointer; font-weight: 700; color: var(--ink); }
details.help ol { padding-left: 20px; margin: 8px 0 0; display: flex; flex-direction: column; gap: 4px; }

/* Camp and end screens */
.panel { display: flex; flex-direction: column; gap: 14px; padding-bottom: 28px; }
.panel h1 { font-family: var(--font-display); font-weight: 700; font-size: 1.9rem; margin: 0; line-height: 1.1; letter-spacing: -0.01em; text-wrap: balance; }
.panel p { margin: 0; color: var(--muted); max-width: 60ch; }
.choices { display: grid; gap: 10px; }
.choice { text-align: left; padding: 12px; border-radius: 16px; border: 2px solid transparent; background: var(--card); box-shadow: var(--shadow); cursor: pointer; display: flex; gap: 14px; align-items: center; }
.choice .tile { width: 52px; height: 52px; font-size: 1.5rem; }
.choice .txt { display: flex; flex-direction: column; gap: 2px; }
.choice b { font-family: var(--font-display); font-weight: 600; font-size: 1rem; }
.choice span.d { color: var(--muted); font-size: 0.88rem; }
.choice:hover { border-color: var(--accent); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat { padding: 12px; border-radius: 14px; background: var(--card); box-shadow: var(--shadow); }
.stat b { display: block; font-family: var(--font-display); font-weight: 700; font-size: 1.6rem; }
.stat span { font-size: 0.8rem; color: var(--muted); }
</style>
</head>
<body>
<div class="shell" id="root">
  <div id="top"></div>
  <div class="scene" id="scene"><div class="overlay" id="overlay"></div></div>
  <div class="stack" id="app"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';

/* ---------- Data ---------- */
const ICONS = {
  atk: '<path d="M19 4l-9.5 9.5M19 4h-4.5M19 4v4.5M7 13.5l3.5 3.5M5 19l3.2-3.2"/>',
  shd: '<path d="M12 3.5l7 2.8v5c0 4.6-3 7.8-7 9.7-4-1.9-7-5.1-7-9.7v-5z"/>',
  coin: '<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.5"/>',
  rr: '<path d="M19.5 12a7.5 7.5 0 1 1-2.6-5.7M19.5 4v4.6h-4.6"/>',
  heal: '<path d="M12 5v14M5 12h14"/>',
  water: '<path d="M12 3.5c3 4.6 6 7.6 6 11.5a6 6 0 0 1-12 0c0-3.9 3-6.9 6-11.5z"/>',
  blank: '<path d="M7 12h10"/>',
};
const icon = (t) => `<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${ICONS[t]}</svg>`;
const FACE_NAME = { atk: 'Attack', shd: 'Block', coin: 'Coin', rr: 'Reroll', heal: 'Mend', water: 'Water', blank: 'Blank' };

function parseFace(s) {
  if (s === '-') return { t: 'blank', v: 0 };
  if (s === 'r') return { t: 'rr', v: 0 };
  if (s === 'h') return { t: 'heal', v: 0 };
  return { t: { a: 'atk', s: 'shd', c: 'coin', w: 'water' }[s[0]], v: Number(s.slice(1)) };
}

// Robe colours are shared by the crew cards and the 3D figures.
const CREW_DEFS = [
  { id: 'amir', name: 'Amir', role: 'Guard', color: '#4f7f9c', faces: ['a2', 'a3', 'a4', 's2', 's3', 's3'] },
  { id: 'lena', name: 'Lena', role: 'Guard', color: '#3f6a86', faces: ['a2', 'a3', 'a3', 's2', 's3', 's4'] },
  { id: 'tavi', name: 'Tavi', role: 'Scout', color: '#7f9c45', faces: ['r', 'r', 'a2', 's2', 'a1', 'w1'] },
  { id: 'oskar', name: 'Oskar', role: 'Trader', color: '#d8a21d', faces: ['c2', 'c3', 'c4', 'c2', 'a1', 'w1'] },
  { id: 'noor', name: 'Noor', role: 'Medic', color: '#ece6da', faces: ['h', 'h', 's3', 's2', 'w2', 'a1'] },
  { id: 'zane', name: 'Zane', role: 'Fire-eater', color: '#d4532d', faces: ['-', '-', 'a5', 'a6', 'a7', 'a8'] },
];

const ENEMIES = [
  { kind: 'bandits', name: 'Dune Bandits', blurb: 'Raiders on a sand-skiff. They hit the back of the line first.', hp: 28,
    pattern: [{ k: 'atk', v: 6 }, { k: 'snipe', v: 5 }, { k: 'atk', v: 8 }, { k: 'guard', v: 5, dmg: 3 }] },
  { kind: 'wraith', name: 'Sand Wraith', blurb: 'A storm with a face. It drinks whatever water you carry.', hp: 36,
    pattern: [{ k: 'atk', v: 7 }, { k: 'drain', v: 2, dmg: 4 }, { k: 'snipe', v: 6 }, { k: 'atk', v: 10 }] },
  { kind: 'warden', name: 'The Gate Warden', blurb: 'A brass colossus at the city gate. Get past it and the road is yours.', hp: 44,
    pattern: [{ k: 'guard', v: 6, dmg: 4 }, { k: 'atk', v: 9 }, { k: 'snipe', v: 8 }, { k: 'atk', v: 13 }] },
];

const WAGON_DEFS = [
  { id: 'water', name: 'Water Cart', max: 14, perk: 'Pour water on a die for +2.' },
  { id: 'armory', name: 'Armoury', max: 14, perk: 'Guards get +1 on Attack.' },
];

const DICE_PER_TURN = 4;
const BASE_REROLLS = 2;
const ROAD_WATER = 2;

/* ---------- State ---------- */
let S;
let pendingFx = [];
const rand = (n) => Math.floor(Math.random() * n);
const crewById = (id) => S.crew.find((c) => c.id === id);
const wagonAlive = (id) => S.wagons.some((w) => w.id === id && w.hp > 0);
const rearWagon = () => [...S.wagons].reverse().find((w) => w.hp > 0);
function log(msg) { S.log.unshift(msg); S.log.length = Math.min(S.log.length, 30); }

function newRun() {
  S = {
    crew: CREW_DEFS.map((c) => ({ ...c, faces: c.faces.map(parseFace) })),
    wagons: WAGON_DEFS.map((w) => ({ ...w, hp: w.max })),
    water: 5, coin: 0, stop: 0, screen: 'fight', log: [], fight: null,
    stats: { dmg: 0, turns: 0, coinEarned: 0 },
  };
  startFight();
}

function startFight() {
  const e = ENEMIES[S.stop];
  S.fight = {
    id: Math.random(),
    enemy: { kind: e.kind, name: e.name, blurb: e.blurb, hp: e.hp, max: e.hp, block: 0, pattern: e.pattern, step: 0 },
    intent: null, knocked: [], selected: ['amir', 'lena', 'noor', 'zane'], dice: [],
    rerolls: 0, phase: 'pick', bribeCost: 6, turn: 1,
  };
  S.screen = 'fight';
  log(`${e.name} block the road.`);
  nextIntent();
}

function nextIntent() {
  const f = S.fight, e = f.enemy, len = e.pattern.length;
  const base = e.pattern[e.step % len];
  const bump = Math.floor(e.step / len) * 2; // enemies get meaner each time their pattern loops
  e.step++;
  const it = { k: base.k, v: base.k === 'drain' ? base.v : base.v + bump, dmg: base.dmg != null ? base.dmg + bump : 0 };
  if (it.k === 'snipe') {
    const pool = S.crew.filter((c) => !f.knocked.includes(c.id));
    it.target = pool[rand(pool.length)].id;
  }
  e.block = it.k === 'guard' ? it.v : 0;
  f.intent = it;
}

function intentInfo(it) {
  const rear = rearWagon();
  const rn = rear ? rear.name : 'caravan';
  switch (it.k) {
    case 'atk': return { icon: 'atk', title: `Attack the ${rn} for ${it.v}`, detail: 'Block reduces the damage.' };
    case 'guard': return { icon: 'shd', title: `Brace, then hit the ${rn} for ${it.dmg}`, detail: `Absorbs ${it.v} of your damage this turn.` };
    case 'drain': return { icon: 'water', title: `Steal ${it.v} water, hit the ${rn} for ${it.dmg}`, detail: 'Spend your water now or lose it.' };
    case 'snipe': {
      const n = crewById(it.target).name;
      return { icon: 'atk', title: `Snipe ${n} for ${it.v}`, detail: `If ${n} rolls and you block less than ${it.v}, ${n} is knocked out. If ${n} stays back, the ${rn} takes it.` };
    }
  }
}

/* ---------- Turn actions ---------- */
const rollFace = (id) => ({ ...crewById(id).faces[rand(6)] });

function gainRerolls(dice) {
  const n = dice.filter((d) => d.face.t === 'rr').length;
  if (n) { S.fight.rerolls += n; log(`Tavi found an opening: +${n} reroll${n > 1 ? 's' : ''}.`); }
}

function totals() {
  const f = S.fight, armoury = wagonAlive('armory');
  const t = { atk: 0, shd: 0, coin: 0, water: 0, heal: 0 };
  for (const d of f.dice) {
    const v = d.face.v + (d.poured ? 2 : 0);
    const c = crewById(d.crew);
    if (d.face.t === 'atk') t.atk += v + (armoury && c.role === 'Guard' ? 1 : 0);
    else if (d.face.t === 'shd') t.shd += v;
    else if (d.face.t === 'coin') t.coin += v;
    else if (d.face.t === 'water') t.water += v;
    else if (d.face.t === 'heal') t.heal += 1;
  }
  return t;
}

const canPour = (d) => wagonAlive('water') && S.water > 0 && !d.poured && ['atk', 'shd', 'coin'].includes(d.face.t);

const A = {
  pick(id) {
    const f = S.fight;
    if (f.phase !== 'pick' || f.knocked.includes(id)) return;
    const i = f.selected.indexOf(id);
    if (i >= 0) f.selected.splice(i, 1);
    else if (f.selected.length < DICE_PER_TURN) f.selected.push(id);
    else { f.selected.shift(); f.selected.push(id); }
  },
  roll() {
    const f = S.fight;
    if (f.phase !== 'pick' || !f.selected.length) return;
    f.dice = f.selected.map((id) => ({ crew: id, face: rollFace(id), held: false, poured: false, fresh: true }));
    f.rerolls = BASE_REROLLS;
    f.phase = 'roll';
    gainRerolls(f.dice);
  },
  hold(i) {
    const d = S.fight.dice[+i];
    if (d && !d.poured) d.held = !d.held;
  },
  reroll() {
    const f = S.fight;
    const free = f.dice.filter((d) => !d.held);
    if (f.phase !== 'roll' || f.rerolls < 1 || !free.length) return;
    f.rerolls--;
    for (const d of free) { d.face = rollFace(d.crew); d.fresh = true; }
    gainRerolls(free);
  },
  pour(i) {
    const d = S.fight.dice[+i];
    if (!d || !canPour(d)) return;
    S.water--; d.poured = true; d.held = true;
  },
  bribe() {
    const f = S.fight;
    if (S.coin < f.bribeCost || f.intent.cancelled) return;
    S.coin -= f.bribeCost;
    log(`Paid ${f.bribeCost} coin. The enemy skips its move.`);
    f.bribeCost += 3;
    f.intent.cancelled = true;
  },
  end() { if (S.fight.phase === 'roll') resolveTurn(); },
  reward(kind) {
    if (kind === 'repair') { for (const w of S.wagons) w.hp = Math.min(w.max, Math.max(w.hp, 0) + 7); log('Wagons repaired.'); }
    if (kind === 'water') { S.water += 4; log('Filled the water skins.'); }
    if (kind === 'train') { S.screen = 'train'; return; }
    travel();
  },
  train(id) {
    const c = crewById(id);
    const score = (f) => (f.t === 'blank' ? -1 : f.t === 'rr' || f.t === 'heal' ? 3 : f.v);
    let worst = 0;
    c.faces.forEach((f, i) => { if (score(f) < score(c.faces[worst])) worst = i; });
    const f = c.faces[worst];
    const before = faceLabel(f);
    if (f.t === 'blank') { f.t = 'atk'; f.v = 3; }
    else if (f.t === 'rr' || f.t === 'heal') { c.faces[worst] = { t: 'atk', v: 4 }; }
    else f.v += 2;
    log(`${c.name} trained: ${before} became ${faceLabel(c.faces[worst])}.`);
    travel();
  },
  swap() { S.wagons.reverse(); },
  again() { newRun(); },
};

function faceLabel(f) { return f.t === 'blank' || f.t === 'rr' || f.t === 'heal' ? FACE_NAME[f.t] : `${FACE_NAME[f.t]} ${f.v}`; }

function travel() {
  if (S.water >= ROAD_WATER) { S.water -= ROAD_WATER; log(`The road cost ${ROAD_WATER} water.`); }
  else {
    S.water = 0;
    for (const w of S.wagons) if (w.hp > 0) w.hp = Math.max(1, w.hp - 4);
    log('Out of water on the road. Every wagon took 4 damage.');
  }
  S.stop++;
  startFight();
}

function hitCaravan(dmg, state) {
  const target = rearWagon();
  const blocked = Math.min(state.shield, dmg);
  state.shield -= blocked;
  let rem = dmg - blocked;
  if (target) pendingFx.push({ k: 'eshot', to: 'wagon', id: target.id, blocked: rem === 0 });
  const parts = [];
  if (blocked) parts.push(`${blocked} blocked`);
  while (rem > 0) {
    const w = rearWagon();
    if (!w) break;
    const take = Math.min(rem, w.hp);
    w.hp -= take; rem -= take;
    parts.push(`${w.name} −${take}`);
    if (w.hp === 0) parts.push(`${w.name} wrecked`);
  }
  return parts.join(', ');
}

function resolveTurn() {
  const f = S.fight, e = f.enemy, it = f.intent;
  const t = totals();
  const dealt = Math.max(0, t.atk - e.block);
  e.hp = Math.max(0, e.hp - dealt);
  S.stats.dmg += dealt; S.stats.turns++;
  S.coin += t.coin; S.stats.coinEarned += t.coin;
  S.water += t.water;
  if (t.atk) pendingFx.push({ k: 'pshot', ids: f.dice.filter((d) => d.face.t === 'atk').map((d) => d.crew) });
  const state = { shield: t.shd };
  for (let i = 0; i < t.heal; i++) {
    if (f.knocked.length) { const id = f.knocked.pop(); log(`Noor patched up ${crewById(id).name}.`); }
    else state.shield += 2;
  }
  const bits = [`Hit for ${dealt}`];
  if (e.block && t.atk) bits.push(`${Math.min(e.block, t.atk)} absorbed`);
  if (t.coin) bits.push(`+${t.coin} coin`);
  if (t.water) bits.push(`+${t.water} water`);
  log(bits.join(', ') + '.');

  if (e.hp <= 0) { pendingFx.push({ k: 'edown' }); win(); return; }

  if (!it.cancelled) {
    if (it.k === 'atk') log(`${e.name}: ${hitCaravan(it.v, state)}.`);
    if (it.k === 'guard') log(`${e.name}: ${hitCaravan(it.dmg, state)}.`);
    if (it.k === 'drain') {
      const lost = Math.min(S.water, it.v); S.water -= lost;
      log(`Lost ${lost} water. ${hitCaravan(it.dmg, state)}.`);
    }
    if (it.k === 'snipe') {
      const c = crewById(it.target);
      if (f.dice.some((d) => d.crew === it.target)) {
        const blocked = state.shield >= it.v;
        pendingFx.push({ k: 'eshot', to: 'crew', id: c.id, blocked });
        if (blocked) log(`The shot at ${c.name} was blocked.`);
        else { f.knocked.push(c.id); log(`${c.name} was knocked out for this fight.`); }
      } else log(`${c.name} stayed back. ${hitCaravan(it.v, state)}.`);
    }
  }

  if (!rearWagon()) { lose('Every wagon was wrecked.'); return; }
  if (f.knocked.length >= S.crew.length) { lose('The whole crew was knocked out.'); return; }

  f.dice = [];
  f.phase = 'pick';
  f.turn++;
  f.selected = f.selected.filter((id) => !f.knocked.includes(id));
  nextIntent();
}

function win() {
  log(`${S.fight.enemy.name} defeated.`);
  S.screen = S.stop === ENEMIES.length - 1 ? 'victory' : 'reward';
}
function lose(why) { S.screen = 'defeat'; S.loseReason = why; }

/* ---------- 3D diorama (three.js, low-poly, flat shaded) ---------- */

      const lintel = mesh(new T.BoxGeometry(0.9, 0.6, 4.4), C.stoneLight); lintel.position.set(1.6, 4.1, 0); gate.add(lintel);
      const banner = mesh(new T.BoxGeometry(0.06, 1.0, 0.6), C.orange); banner.position.set(1.15, 3.2, 0); gate.add(banner);
      g.add(gate);
      const body = new T.Group();
      for (const z of [-0.35, 0.35]) { const leg = mesh(new T.BoxGeometry(0.45, 1.1, 0.42), C.brassDark); leg.position.set(0, 0.55, z); body.add(leg); }
      const torso = mesh(new T.BoxGeometry(1.0, 1.25, 1.4), C.brass); torso.position.y = 1.72; body.add(torso);
      const belt = mesh(new T.BoxGeometry(1.04, 0.18, 1.44), C.brassDark); belt.position.y = 1.2; body.add(belt);
      for (const z of [-0.9, 0.9]) {
        const arm = mesh(new T.BoxGeometry(0.4, 1.2, 0.36), C.brassDark); arm.position.set(0, 1.65, z); body.add(arm);
        const fist = mesh(new T.BoxGeometry(0.46, 0.4, 0.42), C.brass); fist.position.set(0, 0.95, z); body.add(fist);
      }
      const head = mesh(new T.BoxGeometry(0.7, 0.6, 0.7), C.brass); head.position.y = 2.65; body.add(head);
      const eyeMat = new T.MeshBasicMaterial({ color: C.ember });
      for (const z of [-0.16, 0.16]) { const eye = new T.Mesh(new T.BoxGeometry(0.08, 0.1, 0.14), eyeMat); eye.position.set(-0.36, 2.7, z); body.add(eye); }
      const crest = mesh(new T.ConeGeometry(0.2, 0.4, 4), C.orange); crest.position.y = 3.15; body.add(crest);
      g.add(body);
    }
    e.outer.position.set(3.6, 0, 0.3);
    Object.assign(e.outer.userData, { tx: 3.6, tz: 0.3, ty: 0, trz: 0 });
    return e;
  }

  /* Tweens and effects */
  const tweens = [];
  function tween(dur, fn, done, delay = 0) { tweens.push({ t0: performance.now() + delay, dur, fn, done }); }
  function bump(obj, delay) {
    tween(320, (p) => obj.scale.setScalar(1 + Math.sin(p * PI) * 0.16), () => obj.scale.setScalar(1), delay);
  }
  function shake(obj, delay) {
    tween(420, (p) => { obj.rotation.z = Math.sin(p * PI * 6) * 0.12 * (1 - p); }, () => { obj.rotation.z = 0; }, delay);
  }
  function burst(pos, color, delay) {
    const m = new T.Mesh(new T.IcosahedronGeometry(0.6, 1), new T.MeshBasicMaterial({ color, transparent: true, opacity: 0.5 }));
    m.position.copy(pos); m.visible = false; W.add(m);
    tween(380, (p) => { m.visible = true; m.scale.setScalar(0.4 + p * 1.2); m.material.opacity = 0.5 * (1 - p); }, () => { W.remove(m); m.geometry.dispose(); m.material.dispose(); }, delay);
  }
  function shot(from, to, color, delay, onHit) {
    const m = new T.Mesh(new T.OctahedronGeometry(0.2, 0), new T.MeshBasicMaterial({ color }));
    m.visible = false; W.add(m);
    const a = from.clone(), b = to.clone();
    tween(460, (p) => {
      m.visible = true;
      m.position.lerpVectors(a, b, p);
      m.position.y += Math.sin(p * PI) * 1.8;
      m.rotation.x += 0.25; m.rotation.y += 0.2;
    }, () => { W.remove(m); m.geometry.dispose(); m.material.dispose(); if (onHit) onHit(); }, delay);
  }
  const posOf = (e, dy) => new T.Vector3(e.outer.userData.tx, dy, e.outer.userData.tz);

  function play(list) {
    let enemyDelay = 0;
    for (const fx of list) {
      if (fx.k === 'pshot' && enemy) {
        fx.ids.forEach((id, i) => {
          const d = i * 110;
          shot(posOf(crewObj[id], 0.9), posOf(enemy, 1.4), C.orange, d, () => { bump(enemy.inner); burst(posOf(enemy, 1.4), C.orange, 0); });
        });
        enemyDelay = 650 + fx.ids.length * 110;
      }
      if (fx.k === 'eshot' && enemy) {
        const target = fx.to === 'wagon' ? wagonObj[fx.id] : crewObj[fx.id];
        const tpos = posOf(target, fx.to === 'wagon' ? 1.0 : 0.7);
        tween(300, (p) => { enemy.inner.position.x = -Math.sin(p * PI) * 0.5; }, () => { enemy.inner.position.x = 0; }, enemyDelay);
        shot(posOf(enemy, 1.6), tpos, fx.blocked ? C.teal : C.maroon, enemyDelay + 120, () => {
          if (fx.blocked) burst(tpos, '#6fa8d0', 0); else { shake(target.inner, 0); burst(tpos, '#d4532d', 0); }
        });
        enemyDelay += 300;
      }
      if (fx.k === 'edown' && enemy) {
        dying = true;
        const e = enemy;
        tween(900, (p) => { e.inner.rotation.z = p * 0.9; e.inner.position.y = -p * 1.5; e.inner.scale.setScalar(1 - p * 0.5); },
          () => { e.outer.visible = false; dying = false; }, enemyDelay + 500);
      }
    }
  }

  /* Sync scene to game state */
  function sync(S) {
    const f = S.fight;
    if (f && f.id !== enemyFightId) {
      if (enemy) { W.remove(enemy.outer); }
      enemy = buildEnemy(f.enemy.kind);
      enemyFightId = f.id; enemyKind = f.enemy.kind; dying = false;
    }
    if (enemy && !dying) enemy.outer.visible = S.screen === 'fight';
    camp.visible = S.screen === 'reward' || S.screen === 'train' || S.screen === 'victory';

    S.wagons.forEach((w, i) => {
      const o = wagonObj[w.id].outer.userData;
      o.tx = -1.4 - i * 2.2; o.tz = 0.5;
      const dead = w.hp <= 0;
      o.ty = dead ? -0.2 : 0; o.trz = dead ? 0.35 : 0;
    });

    const fighting = S.screen === 'fight' && f;
    const forward = fighting ? (f.phase === 'pick' ? f.selected : f.dice.map((d) => d.crew)) : [];
    const knocked = f ? f.knocked : [];
    S.crew.forEach((c, i) => {
      const e = crewObj[c.id], o = e.outer.userData;
      if (S.screen !== 'fight') {
        const a = (i / S.crew.length) * PI * 2;
        o.tx = 2.6 + Math.cos(a) * 1.35; o.tz = 1.0 + Math.sin(a) * 1.0; o.ty = 0; o.trz = 0;
        return;
      }
      o.tx = e.home.x; o.tz = forward.includes(c.id) ? e.home.z + 0.65 : e.home.z - 0.1;
      const ko = knocked.includes(c.id);
      o.ty = ko ? 0.17 : 0; o.trz = ko ? PI / 2 : 0;
    });
  }

  /* Size and render loop */
  function resize() {
    const w = host.clientWidth, h = host.clientHeight;
    if (!w || !h) return;
    renderer.setSize(w, h, false);
    const aspect = w / h;
    let worldW = 17, worldH = worldW / aspect;
    if (worldH < 9.6) { worldH = 9.6; worldW = worldH * aspect; }
    cam.left = -worldW / 2; cam.right = worldW / 2; cam.top = worldH / 2 + 0.6; cam.bottom = -worldH / 2 + 0.6;
    cam.updateProjectionMatrix();
  }
  new ResizeObserver(resize).observe(host);
  resize();

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    for (let i = tweens.length - 1; i >= 0; i--) {
      const tw = tweens[i];
      const p = (now - tw.t0) / tw.dur;
      if (p < 0) continue;
      tw.fn(Math.min(p, 1));
      if (p >= 1) { tweens.splice(i, 1); if (tw.done) tw.done(); }
    }
    const k = 1 - Math.pow(0.0015, dt);
    const ents = [...Object.values(wagonObj), ...Object.values(crewObj)];
    if (enemy) ents.push(enemy);
    for (const e of ents) {
      const o = e.outer, u = o.userData;
      o.position.x += (u.tx - o.position.x) * k;
      o.position.z += (u.tz - o.position.z) * k;
      o.position.y += (u.ty - o.position.y) * k;
      o.rotation.x += (u.trz - o.rotation.x) * k;
    }
    if (!reduced) {
      const t = now / 1000;
      if (enemy && !dying) {
        if (enemyKind === 'bandits') enemy.inner.position.y = 0.12 + Math.sin(t * 2) * 0.08;
        if (enemyKind === 'wraith') { enemy.inner.position.y = Math.sin(t * 1.6) * 0.15; if (enemy.spin) enemy.spin.rotation.y = t * 1.2; }
      }
      flame.scale.set(1 + Math.sin(t * 13) * 0.08, 1 + Math.sin(t * 9) * 0.15, 1);
      flame2.scale.y = 1 + Math.sin(t * 11 + 1) * 0.2;
    }
    renderer.render(scene, cam);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  return { sync, play };
})();

/* ---------- Rendering ---------- */
function personSvg(color) {
  return `<svg viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="8" r="4.2" fill="#c99a72"/><rect x="8.6" y="2.6" width="8.8" height="3.2" rx="1.6" fill="#f3ece0"/><path d="M7 23c0-6 2.6-10 6-10s6 4 6 10z" fill="${color}" stroke="#00000018"/></svg>`;
}

function headerHtml() {
  const stops = ENEMIES.map((e, i) => {
    const cls = i < S.stop ? 'done' : i === S.stop ? 'here' : '';
    return `<span class="stop ${cls}"><span class="dot"></span><span class="label">${e.name}</span></span>`;
  }).join('<span class="leg"></span>');
  return `<header class="top">
    <div class="brand">Caravan</div>
    <div class="res">
      <span class="chip water" title="Water">${icon('water')}<span class="num">${S.water}</span></span>
      <span class="chip coin" title="Coin">${icon('coin')}<span class="num">${S.coin}</span></span>
    </div>
    <div class="road">${stops}</div>
  </header>`;
}

function overlayHtml() {
  if (S.screen !== 'fight') {
    const title = S.screen === 'defeat' ? 'The caravan fell' : S.screen === 'victory' ? 'At the city gate' : 'Camp';
    return `<div class="hpcard"><b>${title}</b></div>`;
  }
  const e = S.fight.enemy;
  return `<div class="hpcard">
    <div class="row"><b>${e.name}</b><span class="hp">${e.hp}/${e.max}</span></div>
    <div class="bar"><span style="width:${(100 * e.hp) / e.max}%"></span></div>
    ${e.block ? `<span class="block">${icon('shd')} Absorbs ${e.block} this turn</span>` : ''}
  </div>`;
}

function wagonsHtml() {
  const rear = rearWagon();
  return [...S.wagons].reverse().map((w) => {
    const dead = w.hp <= 0;
    const tag = dead ? '<span class="tag out">Wrecked</span>' : w === rear ? '<span class="tag target">Rear</span>' : '<span class="tag out">Front</span>';
    return `<div class="wagon ${dead ? 'dead' : ''} ${w === rear ? 'rear' : ''}">
      <div class="wtop"><span class="wname">${w.name}</span>${tag}</div>
      <div class="bar fill-ok"><span style="width:${(100 * Math.max(0, w.hp)) / w.max}%"></span></div>
      <div class="perk"><b class="num">${Math.max(0, w.hp)}/${w.max}</b> · ${w.perk}</div>
    </div>`;
  }).join('');
}

function faceHtml(f, bonus = 0) {
  const showV = f.t !== 'blank' && f.t !== 'rr' && f.t !== 'heal';
  return `<span class="face t-${f.t}">${icon(f.t)}${showV ? `<span class="num">${f.v + bonus}</span>` : ''}</span>`;
}

function trayHtml() {
  const f = S.fight;
  if (f.phase === 'pick') {
    const slots = [];
    for (let i = 0; i < DICE_PER_TURN; i++) {
      const id = f.selected[i];
      slots.push(id
        ? `<div class="slot"><div class="die ready"><span class="face">?</span><span class="who">${crewById(id).name}</span></div></div>`
        : `<div class="slot"><div class="die empty"><span class="who">Empty</span></div></div>`);
    }
    return slots.join('');
  }
  return f.dice.map((d, i) => {
    const c = crewById(d.crew);
    const bonus = (d.poured ? 2 : 0) + (d.face.t === 'atk' && c.role === 'Guard' && wagonAlive('armory') ? 1 : 0);
    return `<div class="slot">
      <button class="die ${d.held ? 'held' : ''} ${d.fresh ? 'tumble' : ''}" data-act="hold" data-arg="${i}" aria-pressed="${d.held}" aria-label="${c.name}: ${faceLabel(d.face)}${d.held ? ', held' : ''}">
        ${d.held ? '<span class="held-tag">Held</span>' : ''}
        ${faceHtml(d.face, bonus)}
        <span class="who">${c.name}</span>
      </button>
      <button class="pour ${d.poured ? 'done' : ''}" data-act="pour" data-arg="${i}" ${canPour(d) ? '' : 'disabled'} aria-label="Pour water on ${c.name} for +2">${icon('water')}+2</button>
    </div>`;
  }).join('');
}

function previewHtml() {
  const f = S.fight;
  if (f.phase === 'pick') return `<span class="hint">Choose up to ${DICE_PER_TURN} crew below, then roll. Chosen crew step forward on the map.</span>`;
  const t = totals();
  const out = [];
  const net = Math.max(0, t.atk - f.enemy.block);
  out.push(`<span class="t-atk">${icon('atk')}<span class="num">${net}</span>&nbsp;damage${f.enemy.block && t.atk ? ` (${Math.min(f.enemy.block, t.atk)} absorbed)` : ''}</span>`);
  out.push(`<span class="t-shd">${icon('shd')}<span class="num">${t.shd}</span>&nbsp;block</span>`);
  if (t.coin) out.push(`<span class="t-coin">${icon('coin')}+${t.coin}</span>`);
  if (t.water) out.push(`<span class="t-water">${icon('water')}+${t.water}</span>`);
  if (t.heal) out.push(`<span class="t-heal">${icon('heal')}${t.heal} mend</span>`);
  return out.join('');
}

function miniFaces(c) {
  return c.faces.map((fc) => {
    const showV = fc.t !== 'blank' && fc.t !== 'rr' && fc.t !== 'heal';
    return `<span class="mini t-${fc.t}" title="${faceLabel(fc)}">${icon(fc.t)}${showV ? fc.v : ''}</span>`;
  }).join('');
}

function rosterHtml() {
  const f = S.fight;
  return S.crew.map((c) => {
    const ko = f.knocked.includes(c.id);
    const sel = f.selected.includes(c.id);
    const targeted = f.intent && f.intent.k === 'snipe' && f.intent.target === c.id && !f.intent.cancelled;
    const tag = ko ? '<span class="tag out">Out</span>' : targeted ? '<span class="tag target">Targeted</span>' : sel ? '<span class="tag go">Rolling</span>' : '';
    return `<button class="crew ${sel ? 'sel' : ''} ${ko ? 'ko' : ''}" data-act="pick" data-arg="${c.id}" ${f.phase !== 'pick' || ko ? 'disabled' : ''} aria-pressed="${sel}">
      <span class="head"><span class="tile">${personSvg(c.color)}</span><span class="nm"><b>${c.name}</b><span class="role">${c.role}</span></span>${tag}</span>
      <span class="faces">${miniFaces(c)}</span>
    </button>`;
  }).join('');
}

function actionsHtml() {
  const f = S.fight;
  const canBribe = S.coin >= f.bribeCost && !f.intent.cancelled;
  const bribe = `<button class="btn" data-act="bribe" ${canBribe ? '' : 'disabled'}>Bribe<small>${f.bribeCost} coin</small></button>`;
  if (f.phase === 'pick') {
    return `${bribe}<button class="btn primary" data-act="roll" ${f.selected.length ? '' : 'disabled'}>Roll ${f.selected.length} crew<small>Turn ${f.turn}</small></button>`;
  }
  const free = f.dice.some((d) => !d.held);
  return `${bribe}
    <button class="btn" data-act="reroll" ${f.rerolls > 0 && free ? '' : 'disabled'}>Reroll<small>${f.rerolls} left</small></button>
    <button class="btn primary" data-act="end">End turn<small>Enemy moves</small></button>`;
}

function fightHtml() {
  const f = S.fight, info = intentInfo(f.intent);
  return `
  <div class="intent ${f.intent.cancelled ? 'cancelled' : ''}">
    <span class="tile">${icon(info.icon)}</span>
    <span class="txt">
      <span class="eyebrow">${f.intent.cancelled ? 'Bribed, skipping this move' : `${f.enemy.name} · next move`}</span>
      <strong>${info.title}</strong>
      <span class="detail">${info.detail}</span>
    </span>
  </div>
  <section class="stack" style="gap:8px" aria-label="Your caravan">
    <div class="label"><span>Your wagons</span><span>Enemies hit the rear first</span></div>
    <div class="wagons">${wagonsHtml()}</div>
  </section>
  <section class="stack" style="gap:10px" aria-label="Dice">
    <div class="label"><span>${f.phase === 'pick' ? 'Who rolls this turn' : 'Tap a die to hold it'}</span><span>${f.phase === 'roll' ? `${f.dice.filter((d) => d.held).length} held` : `${f.selected.length}/${DICE_PER_TURN}`}</span></div>
    <div class="tray">${trayHtml()}</div>
    <div class="preview">${previewHtml()}</div>
  </section>
  <ul class="log" aria-live="polite">${S.log.slice(0, 3).map((l) => `<li>${l}</li>`).join('')}</ul>
  <section class="stack" style="gap:8px" aria-label="Crew">
    <div class="label"><span>Crew</span><span>${S.crew.length - f.knocked.length} standing</span></div>
    <div class="roster">${rosterHtml()}</div>
  </section>
  <details class="help">
    <summary>How a turn works</summary>
    <ol>
      <li>Read the enemy's next move.</li>
      <li>Pick up to ${DICE_PER_TURN} crew. Each crew member is a die with six faces, shown on their card.</li>
      <li>Roll. Tap dice to hold them, then reroll the rest. You get ${BASE_REROLLS} rerolls a turn, plus one for each Reroll face.</li>
      <li>Pour water on an Attack, Block or Coin die for +2. The Water Cart has to be standing.</li>
      <li>End the turn. Your attacks land first, then the enemy moves. Enemies hit the rear wagon.</li>
      <li>Coin can bribe an enemy to skip its next move. Crew who are knocked out return after the fight.</li>
    </ol>
  </details>
  <div class="actions">${actionsHtml()}</div>`;
}

function rewardHtml() {
  const next = ENEMIES[S.stop + 1];
  return `<section class="panel">
    <h1>${ENEMIES[S.stop].name} defeated</h1>
    <p>Your crew is back on their feet around the fire. The road to ${next.name} costs ${ROAD_WATER} water. Without it, every wagon takes damage. Choose one thing to do at camp.</p>
    <div class="choices">
      <button class="choice" data-act="reward" data-arg="repair"><span class="tile t-shd">${icon('shd')}</span><span class="txt"><b>Repair the wagons</b><span class="d">+7 health to each wagon, including wrecked ones.</span></span></button>
      <button class="choice" data-act="reward" data-arg="water"><span class="tile t-water">${icon('water')}</span><span class="txt"><b>Draw from the oasis</b><span class="d">+4 water. You have ${S.water}.</span></span></button>
      <button class="choice" data-act="reward" data-arg="train"><span class="tile t-atk">${icon('atk')}</span><span class="txt"><b>Train a crew member</b><span class="d">Their weakest face gets better.</span></span></button>
    </div>
    <div class="label"><span>Wagon order</span><span>Rear on the left</span></div>
    <div class="wagons">${wagonsHtml()}</div>
    <button class="btn" data-act="swap" style="flex:none">Swap wagon order<small>The rear wagon takes hits first</small></button>
  </section>`;
}

function trainHtml() {
  return `<section class="panel">
    <h1>Who trains?</h1>
    <p>Their weakest face is upgraded: a blank becomes Attack 3, a Reroll or Mend becomes Attack 4, and anything else gets +2.</p>
    <div class="roster">${S.crew.map((c) => `<button class="crew" data-act="train" data-arg="${c.id}">
      <span class="head"><span class="tile">${personSvg(c.color)}</span><span class="nm"><b>${c.name}</b><span class="role">${c.role}</span></span></span>
      <span class="faces">${miniFaces(c)}</span>
    </button>`).join('')}</div>
  </section>`;
}

function endHtml(won) {
  return `<section class="panel">
    <h1>${won ? 'You reached the city' : `Lost on the road to ${ENEMIES[S.stop].name}`}</h1>
    <p>${won ? 'The Gate Warden fell and the caravan rolled through. Every run starts from scratch, so try a different crew next time.' : S.loseReason + ' The caravan scatters into the sand.'}</p>
    <div class="stats">
      <div class="stat"><b class="num">${S.stats.turns}</b><span>turns</span></div>
      <div class="stat"><b class="num">${S.stats.dmg}</b><span>damage dealt</span></div>
      <div class="stat"><b class="num">${S.stats.coinEarned}</b><span>coin earned</span></div>
    </div>
    <ul class="log">${S.log.slice(0, 5).map((l) => `<li>${l}</li>`).join('')}</ul>
    <button class="btn primary" data-act="again" style="flex:none">Ride again</button>
  </section>`;
}

function render() {
  document.getElementById('top').innerHTML = headerHtml();
  document.getElementById('overlay').innerHTML = overlayHtml();
  const views = { fight: fightHtml, reward: rewardHtml, train: trainHtml, victory: () => endHtml(true), defeat: () => endHtml(false) };
  document.getElementById('app').innerHTML = views[S.screen]();
  if (Scene) {
    Scene.play(pendingFx);
    Scene.sync(S);
  }
  pendingFx = [];
  if (S.fight) for (const d of S.fight.dice) d.fresh = false;
}

document.getElementById('root').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]');
  if (!b || b.disabled) return;
  const prevScreen = S.screen;
  A[b.dataset.act](b.dataset.arg);
  render();
  if (S.screen !== prevScreen) window.scrollTo(0, 0);
});

function start(saved) {
  if (saved && saved.S) S = saved.S; else newRun();
  render();
}
window.claude?.hot?.snapshot?.(() => ({ S }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
</body>
</html>
