<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Caravan Dice</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=DM+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: one light column. A low-poly diorama sits on top, then the screen's controls, with a sticky action bar during dice rolls.
   Single light look on purpose: clean white page, beige icon tiles, orange accent, soft shadows. */
:root {
  --bg: #fafaf8;
  --card: #ffffff;
  --tile: #f3ede3;
  --line: #e9e4db;
  --ink: #262b29;
  --muted: #6a6f6b;
  --accent: #ef8a26;
  --accent-ink: #ffffff;
  --atk: #d4532d;
  --shd: #477b9b;
  --coin: #b9860c;
  --water: #2f8ea6;
  --heal: #5f9334;
  --rr: #8466ad;
  --shadow: 0 1px 0 rgba(70, 50, 20, 0.05), 0 6px 18px rgba(70, 50, 20, 0.08);
  --font-display: 'Poppins', 'Segoe UI', system-ui, sans-serif;
  --font-body: 'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: light;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.4;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.ic { width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.num { font-variant-numeric: tabular-nums; }

.shell {
  max-width: 600px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 0;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.stack { display: flex; flex-direction: column; gap: 14px; }

/* Header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 10px 12px; flex-wrap: wrap; }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 1.55rem; line-height: 1; letter-spacing: -0.01em; display: flex; flex-direction: column; gap: 6px; }
.brand::after { content: ""; width: 34px; height: 4px; border-radius: 3px; background: var(--accent); }
.res { display: flex; gap: 6px; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 5px 11px; border-radius: 999px; background: var(--card); box-shadow: var(--shadow); font-weight: 700; font-variant-numeric: tabular-nums; }
.chip.water .ic { color: var(--water); }
.chip.coin .ic { color: var(--coin); }
.iconbtn { width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--card); box-shadow: var(--shadow); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; color: var(--muted); font-size: 1.05rem; }
.road { display: flex; align-items: center; gap: 8px; width: 100%; font-size: 0.8rem; color: var(--muted); }
.road b { color: var(--ink); font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.road .dots { display: flex; gap: 5px; margin-left: auto; flex: none; }
.road .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--line); }
.road .dot.done { background: var(--accent); }
.road .dot.here { background: var(--card); box-shadow: inset 0 0 0 3px var(--accent); }
.road .dot.boss { border-radius: 3px; }

/* Diorama */
.scene {
  position: relative;
  width: 100%;
  max-width: 100%;
  aspect-ratio: 16 / 10.2;
  max-height: 360px;
  margin-inline: auto;
  touch-action: manipulation;
}
.scene canvas { display: block; width: 100% !important; height: 100% !important; cursor: pointer; }
.scene .overlay { position: absolute; inset: 0; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start; padding: 2px 0; }
.scene-status { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--muted); font-weight: 700; font-size: 0.9rem; pointer-events: none; }
.ctx { background: var(--card); box-shadow: var(--shadow); border-radius: 12px; padding: 7px 11px; display: flex; flex-direction: column; gap: 4px; min-width: 140px; max-width: 70%; }
.ctx .row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.ctx b { font-family: var(--font-display); font-weight: 600; font-size: 0.92rem; line-height: 1.2; }
.ctx .hp { font-weight: 700; color: var(--atk); font-variant-numeric: tabular-nums; font-size: 0.85rem; }
.ctx .block { font-size: 0.75rem; color: var(--shd); font-weight: 700; display: flex; align-items: center; gap: 4px; }
.wchips { display: flex; flex-wrap: wrap; gap: 5px; }
.wchip { background: color-mix(in srgb, var(--card) 92%, transparent); box-shadow: var(--shadow); border-radius: 9px; padding: 4px 7px; font-size: 0.68rem; font-weight: 700; display: flex; flex-direction: column; gap: 3px; min-width: 70px; border: 1.5px solid transparent; }
.wchip.rear { border-color: color-mix(in srgb, var(--atk) 45%, transparent); }
.wchip.dead { opacity: 0.5; }
.wchip .bar { height: 4px; }
.bar { height: 7px; border-radius: 4px; background: var(--tile); overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--atk); border-radius: 4px; transition: width 400ms ease; }
.bar.fill-ok > span { background: var(--heal); }
.float {
  position: absolute; z-index: 3; pointer-events: none; white-space: nowrap;
  font-family: var(--font-display); font-weight: 700; font-size: 1.3rem; line-height: 1;
  text-shadow: 0 2px 0 #fff, 0 0 6px #fff, 0 0 2px #fff;
  transform: translate(-50%, -50%);
  animation: floatUp 1.1s ease-out forwards;
}
.float.small { font-size: 0.9rem; }
@keyframes floatUp {
  0% { opacity: 0; transform: translate(-50%, -20%) scale(0.6); }
  15% { opacity: 1; transform: translate(-50%, -50%) scale(1.15); }
  70% { opacity: 1; }
  100% { opacity: 0; transform: translate(-50%, -190%) scale(1); }
}

/* Shared */
.label { font-size: 0.78rem; font-weight: 700; color: var(--muted); display: flex; align-items: center; gap: 8px; justify-content: space-between; }
.label > span:first-child { display: flex; align-items: center; gap: 8px; color: var(--ink); }
.label > span:first-child::before { content: ""; width: 3px; height: 14px; border-radius: 2px; background: var(--accent); flex: none; }
.tile { background: var(--tile); border-radius: 12px; display: flex; align-items: center; justify-content: center; flex: none; }
.card { background: var(--card); box-shadow: var(--shadow); border-radius: 16px; }

/* Intent */
.intent { display: flex; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 16px; background: var(--card); box-shadow: var(--shadow); transition: box-shadow 200ms; }
.intent .tile { width: 48px; height: 48px; font-size: 1.5rem; color: var(--atk); }
.intent .txt { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.intent .eyebrow { font-size: 0.72rem; font-weight: 700; color: var(--muted); }
.intent strong { font-family: var(--font-display); font-weight: 600; font-size: 1rem; line-height: 1.25; }
.intent .detail { font-size: 0.84rem; color: var(--muted); }
.intent.cancelled { opacity: 0.55; }
.intent.cancelled strong { text-decoration: line-through; }
.intent.acting { box-shadow: 0 0 0 3px var(--atk), var(--shadow); }
.intent.storm .tile { color: var(--shd); }

/* Dice tray */
.tray { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.slot { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.die {
  aspect-ratio: 1.15; width: 100%; max-width: 100%;
  border-radius: 16px; border: 0; background: var(--card);
  box-shadow: 0 4px 0 #e6dccb, 0 10px 20px rgba(70, 50, 20, 0.1);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  cursor: pointer; position: relative; padding: 4px;
}
.die .face { display: flex; align-items: center; gap: 4px; font-family: var(--font-display); font-weight: 700; font-size: clamp(1.35rem, 6.4vw, 2rem); line-height: 1; }
.die .face .ic { font-size: 0.75em; }
.die .who { font-size: 0.7rem; color: var(--muted); font-weight: 700; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.die.held { box-shadow: 0 0 0 3px var(--accent), 0 4px 0 3px #f3c08d, 0 10px 20px rgba(70, 50, 20, 0.1); }
.die .held-tag { position: absolute; top: -9px; left: 50%; transform: translateX(-50%); background: var(--accent); color: var(--accent-ink); font-size: 0.64rem; font-weight: 700; padding: 1px 8px; border-radius: 999px; }
.die:disabled { cursor: default; }
.t-atk { color: var(--atk); } .t-shd { color: var(--shd); } .t-coin { color: var(--coin); }
.t-water { color: var(--water); } .t-heal { color: var(--heal); } .t-rr { color: var(--rr); } .t-blank { color: #b9b2a6; }
.pour { border: 0; background: var(--card); box-shadow: var(--shadow); color: var(--water); border-radius: 10px; padding: 5px 0; font-size: 0.78rem; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 3px; cursor: pointer; }
.pour:disabled { opacity: 0.35; cursor: default; box-shadow: none; background: transparent; }
.pour.done { color: #fff; background: var(--water); opacity: 1; }
.tumble { animation: tumble 420ms cubic-bezier(.3,1.4,.5,1); }
@keyframes tumble { 0% { transform: rotate(-160deg) scale(.6); opacity: 0.2; } 100% { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .tumble, .float { animation-duration: 1ms; } .bar > span { transition: none; } }

.preview { display: flex; flex-wrap: wrap; gap: 4px 12px; font-weight: 700; font-size: 0.92rem; min-height: 1.3em; }
.preview span { display: inline-flex; align-items: center; gap: 4px; }
.preview .hint { font-weight: 400; color: var(--muted); }
.log { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 2px; font-size: 0.86rem; color: var(--muted); }
.log li:first-child { color: var(--ink); font-weight: 500; }

/* Crew (compact) */
.roster { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
@media (min-width: 560px) { .roster { grid-template-columns: repeat(4, 1fr); } }
.crew { position: relative; text-align: left; padding: 8px; border-radius: 14px; background: var(--card); box-shadow: var(--shadow); border: 2px solid transparent; display: flex; flex-direction: column; gap: 6px; cursor: pointer; min-width: 0; }
.crew .head { display: flex; gap: 7px; align-items: center; min-width: 0; }
.crew .tile { width: 30px; height: 30px; border-radius: 9px; }
.crew .tile svg { width: 21px; height: 21px; }
.crew .nm { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.crew .nm b { font-family: var(--font-display); font-weight: 600; font-size: 0.88rem; line-height: 1.15; }
.crew .role { font-size: 0.7rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.crew .badge { position: absolute; top: -8px; right: 6px; font-size: 0.62rem; font-weight: 700; padding: 1px 7px; border-radius: 999px; background: var(--accent); color: #fff; }
.crew .badge.red { background: var(--atk); }
.crew .badge.grey { background: #9a958c; }
.crew.sel { border-color: var(--accent); }
.crew.targeted { border-color: var(--atk); }
.crew.ko { opacity: 0.45; cursor: not-allowed; }
.crew:disabled { cursor: default; }
.faces { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; }
.mini { height: 22px; border-radius: 6px; background: var(--tile); display: flex; align-items: center; justify-content: center; gap: 1px; font-size: 0.7rem; font-weight: 700; border: 0; padding: 0; }
.mini .ic { font-size: 0.76rem; }
button.mini { cursor: pointer; height: 34px; font-size: 0.85rem; }
button.mini:disabled { cursor: default; opacity: 0.4; }
button.mini:not(:disabled):hover { box-shadow: 0 0 0 2px var(--accent); }

/* Actions */
.actions {
  position: sticky; bottom: 0; z-index: 5;
  margin-left: calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
  margin-right: calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(8px);
  border-top: 1px solid var(--line);
  display: flex; gap: 8px;
}
.btn { flex: 1; min-height: 50px; border-radius: 14px; border: 0; background: var(--card); box-shadow: var(--shadow); font-family: var(--font-display); font-weight: 600; font-size: 0.98rem; cursor: pointer; padding: 6px 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.15; }
.btn small { font-family: var(--font-body); font-weight: 500; font-size: 0.74rem; color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-ink); flex: 1.4; box-shadow: 0 4px 0 #c96d14, 0 8px 16px rgba(239, 138, 38, 0.25); }
.btn.primary small { color: inherit; opacity: 0.85; }
.btn:disabled { opacity: 0.4; cursor: default; }
.btn:not(:disabled):active { transform: translateY(2px); }
.btn.solo { flex: none; }

details.help { font-size: 0.9rem; color: var(--muted); padding-bottom: 6px; }
details.help summary { cursor: pointer; font-weight: 700; color: var(--ink); }
details.help ol, details.help ul { padding-left: 20px; margin: 8px 0 0; display: flex; flex-direction: column; gap: 4px; }

/* Panels (map, market, camp...) */
.panel { display: flex; flex-direction: column; gap: 14px; padding-bottom: 28px; }
.panel h1 { font-family: var(--font-display); font-weight: 700; font-size: 1.65rem; margin: 0; line-height: 1.12; letter-spacing: -0.01em; text-wrap: balance; }
.panel p { margin: 0; color: var(--muted); max-width: 60ch; }
.choices { display: grid; gap: 10px; }
.choice { text-align: left; padding: 11px; border-radius: 16px; border: 2px solid transparent; background: var(--card); box-shadow: var(--shadow); cursor: pointer; display: flex; gap: 12px; align-items: center; width: 100%; }
.choice .tile { width: 46px; height: 46px; font-size: 1.35rem; }
.choice .txt { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0; }
.choice b { font-family: var(--font-display); font-weight: 600; font-size: 0.98rem; }
.choice span.d { color: var(--muted); font-size: 0.86rem; }
.choice .price { font-weight: 700; display: inline-flex; align-items: center; gap: 4px; color: var(--coin); white-space: nowrap; font-variant-numeric: tabular-nums; }
.choice:not(:disabled):hover { border-color: var(--accent); }
.choice:disabled { opacity: 0.45; cursor: default; }
.choice.done { opacity: 0.55; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat { padding: 12px; border-radius: 14px; background: var(--card); box-shadow: var(--shadow); }
.stat b { display: block; font-family: var(--font-display); font-weight: 700; font-size: 1.5rem; }
.stat span { font-size: 0.78rem; color: var(--muted); }

/* Route map */
.map { position: relative; width: 100%; max-width: 100%; aspect-ratio: 3 / 3.4; max-height: 440px; margin-inline: auto; border-radius: 20px; background: linear-gradient(#f6efe2, #efe3cc); box-shadow: var(--shadow); overflow: hidden; }
.map svg.lines { position: absolute; inset: 0; width: 100%; height: 100%; }
.node { position: absolute; transform: translate(-50%, -50%); width: 64px; border: 0; background: none; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: default; }
.node .disc { width: 50px; height: 50px; border-radius: 16px; background: var(--card); box-shadow: var(--shadow); display: flex; align-items: center; justify-content: center; font-size: 1.35rem; color: var(--muted); }
.node .nl { font-size: 0.68rem; font-weight: 700; color: var(--muted); background: color-mix(in srgb, var(--card) 85%, transparent); padding: 0 5px; border-radius: 6px; white-space: nowrap; }
.node.reach { cursor: pointer; }
.node.reach .disc { box-shadow: 0 0 0 3px var(--accent), var(--shadow); color: var(--ink); animation: pulse 1.6s ease-in-out infinite; }
.node.reach .nl { color: var(--ink); }
.node.visited .disc { background: var(--tile); box-shadow: none; color: #b5a98f; }
.node.here .disc { background: var(--accent); color: #fff; box-shadow: 0 4px 0 #c96d14; }
.node.far { opacity: 0.5; }
.node.boss .disc { width: 60px; height: 60px; border-radius: 18px; color: var(--atk); }
.node.boss.reach .disc { color: var(--atk); }
.node[data-t="ambush"] .disc { color: var(--atk); } .node[data-t="oasis"] .disc { color: var(--water); }
.node[data-t="market"] .disc { color: var(--coin); } .node[data-t="ruins"] .disc { color: #8a7a5c; } .node[data-t="storm"] .disc { color: var(--shd); }
.node.visited .disc, .node.here .disc { color: inherit; }
@keyframes pulse { 50% { transform: translateY(-3px); } }
@media (prefers-reduced-motion: reduce) { .node.reach .disc { animation: none; } }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 0.8rem; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.wlist { display: grid; gap: 8px; }
.wrow { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 14px; background: var(--card); box-shadow: var(--shadow); }
.wrow .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.wrow b { font-family: var(--font-display); font-weight: 600; font-size: 0.92rem; }
.wrow .d { font-size: 0.8rem; color: var(--muted); }
.wrow .pos { font-size: 0.7rem; font-weight: 700; color: var(--muted); width: 36px; text-align: center; }
.small-btn { border: 0; background: var(--tile); border-radius: 10px; padding: 6px 10px; font-size: 0.78rem; font-weight: 700; cursor: pointer; }
.small-btn:disabled { opacity: 0.35; cursor: default; }
.scout { padding: 12px; display: flex; flex-direction: column; gap: 6px; }
.scout ol { margin: 0; padding-left: 20px; font-size: 0.88rem; display: flex; flex-direction: column; gap: 2px; }

/* Title */
.hero h1 { font-size: 2rem; }
.hero .cta { display: flex; flex-direction: column; gap: 10px; }
.credit { font-size: 0.75rem; color: var(--muted); }
</style>
</head>
<body>
<div class="shell" id="root">
  <div id="top"></div>
  <div class="scene" id="scene">
    <div class="scene-status" id="scene-status">Unpacking the caravan…</div>
    <div class="overlay" id="overlay"></div>
  </div>
  <div class="stack" id="app"></div>
</div>
<script src="vendor/three.min.js"></script>
<script src="vendor/GLTFLoader.js"></script>
<script src="vendor/SkeletonUtils.js"></script>
<script>
'use strict';

/* =========================================================
   Icons
   ========================================================= */
const ICON_D = {
  atk: 'M19 4l-9.5 9.5M19 4h-4.5M19 4v4.5M7 13.5l3.5 3.5M5 19l3.2-3.2',
  shd: 'M12 3.5l7 2.8v5c0 4.6-3 7.8-7 9.7-4-1.9-7-5.1-7-9.7v-5z',
  coin: 'M20 12a8 8 0 1 1-16 0a8 8 0 1 1 16 0M15.5 12a3.5 3.5 0 1 1-7 0a3.5 3.5 0 1 1 7 0',
  rr: 'M19.5 12a7.5 7.5 0 1 1-2.6-5.7M19.5 4v4.6h-4.6',
  heal: 'M12 5v14M5 12h14',
  water: 'M12 3.5c3 4.6 6 7.6 6 11.5a6 6 0 0 1-12 0c0-3.9 3-6.9 6-11.5z',
  blank: 'M7 12h10',
  bag: 'M5 8h14l-1 12H6zM9 8a3 3 0 0 1 6 0',
  ruin: 'M5 20V9M10 20V9M15 20v-5M19 20v-8M3 6.5h12M3 20h18',
  wind: 'M3 8h11a3 3 0 1 0-3-3M3 12h16a3 3 0 1 1-3 3M3 16h8',
  crown: 'M4 18l-1-10 5 4 4-7 4 7 5-4-1 10z',
  cart: 'M3 7h14v8H3zM17 10h4M7 19a1.5 1.5 0 1 0 0.1 0M14 19a1.5 1.5 0 1 0 0.1 0',
  flag: 'M5 21V4M5 4h11l-2 4 2 4H5',
  sound: 'M4 9h4l5-4v14l-5-4H4zM16.5 9a4 4 0 0 1 0 6M19 6.5a7.5 7.5 0 0 1 0 11',
  mute: 'M4 9h4l5-4v14l-5-4H4zM17 9l5 6M22 9l-5 6',
  up: 'M12 19V5M6 11l6-6 6 6',
};
const icon = (t) => `<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="${ICON_D[t]}"/></svg>`;
const FACE_NAME = { atk: 'Attack', shd: 'Block', coin: 'Coin', rr: 'Reroll', heal: 'Mend', water: 'Water', blank: 'Blank' };
const FACE_COLOR = { atk: '#d4532d', shd: '#477b9b', coin: '#b9860c', rr: '#8466ad', heal: '#5f9334', water: '#2f8ea6', blank: '#b9b2a6' };

function parseFace(s) {
  if (s === '-') return { t: 'blank', v: 0 };
  if (s === 'r') return { t: 'rr', v: 0 };
  if (s === 'h') return { t: 'heal', v: 0 };
  return { t: { a: 'atk', s: 'shd', c: 'coin', w: 'water' }[s[0]], v: Number(s.slice(1)) };
}
const hasValue = (f) => f.t !== 'blank' && f.t !== 'rr' && f.t !== 'heal';

/* =========================================================
   State, saving, helpers
   ========================================================= */
const SAVE_KEY = 'caravan-dice-save-v2';
let S = null;
let pendingFx = [];
const rand = (n) => Math.floor(Math.random() * n);
const pick = (arr) => arr[rand(arr.length)];
const shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = rand(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const crewById = (id) => S.crew.find((c) => c.id === id);
const has = (type) => S.wagons.some((w) => w.type === type && w.hp > 0);
const rearWagon = () => [...S.wagons].reverse().find((w) => w.hp > 0);
const wagonName = (w) => WAGON_TYPES[w.type].name;
function log(msg) { S.log.unshift(msg); S.log.length = Math.min(S.log.length, 30); }
function fx(e) { pendingFx.push(e); }

function save() {
  if (!S) return;
  try {
    if ( !['victory', 'defeat'].includes(S.screen)) localStorage.setItem(SAVE_KEY, JSON.stringify(S));
    else localStorage.removeItem(SAVE_KEY);
  } catch (err) { /* storage unavailable: the run still works, it just won't resume */ }
}
function loadSave() {
  try { const s = localStorage.getItem(SAVE_KEY); return s ? JSON.parse(s) : null; } catch (err) { return null; }
}

// Delayed steps (the enemy's turn, the end of a fight). Ignored if a new run started meanwhile.
function later(ms, fn) {
  const run = S && S.runId;
  setTimeout(() => { if (S && S.runId === run) { fn(); render(); } }, ms);
}

function mkCrew(id) {
  const d = CREW_POOL[id];
  return { id, name: d.name, role: d.role, model: d.model, color: d.color, faces: d.faces.map(parseFace) };
}
function mkWagon(type) { return { type, hp: WAGON_TYPES[type].max, max: WAGON_TYPES[type].max }; }

function genLeg() {
  const weights = (row) => (row === 0
    ? [['ambush', 55], ['ruins', 15], ['oasis', 15], ['storm', 15]]
    : [['ambush', 40], ['market', 20], ['oasis', 15], ['ruins', 15], ['storm', 10]]);
  const roll = (row) => { const w = weights(row); let r = Math.random() * w.reduce((s, x) => s + x[1], 0); for (const [t, n] of w) { if ((r -= n) < 0) return t; } return 'ambush'; };
  const rows = [];
  for (let r = 0; r < 3; r++) {
    const lanes = [1];
    if (Math.random() < 0.7) lanes.unshift(0);
    if (Math.random() < 0.7) lanes.push(2);
    if (lanes.length === 1) { lanes.push(Math.random() < 0.5 ? 0 : 2); lanes.sort(); }
    rows.push(lanes.map((lane) => ({ lane, type: roll(r) })));
  }
  if (!rows.flat().some((n) => n.type === 'market')) { const row = rows[1 + rand(2)]; pick(row).type = 'market'; }
  if (!rows[0].some((n) => n.type === 'ambush')) rows[0][0].type = 'ambush';
  return { rows };
}

function newRun() {
  S = {
    runId: Math.random(),
    crew: START_CREW.map(mkCrew),
    wagons: [mkWagon('water'), mkWagon('armory')],
    water: 6, coin: 4, leg: 0, pos: { row: -1, lane: 1 },
    map: LEGS.map(() => genLeg()), visited: [],
    screen: 'map', log: [], fight: null, storm: null, market: null, upgrade: null, lastSel: null,
    upgradeCost: 5,
    stats: { dmg: 0, turns: 0, coinEarned: 0, fights: 0 },
  };
  log(`The caravan sets out across ${LEGS[0].name}.`);
}

/* =========================================================
   Route map
   ========================================================= */
function reachable() {
  const leg = S.map[S.leg], p = S.pos;
  if (p.row >= 3) return [];
  if (p.row === 2) return [{ key: 'boss', row: 3, lane: 1, type: 'boss' }];
  return leg.rows[p.row + 1].filter((n) => Math.abs(n.lane - p.lane) <= 1)
    .map((n) => ({ key: `${p.row + 1}-${n.lane}`, row: p.row + 1, lane: n.lane, type: n.type }));
}

function travelCost() {
  if (S.water >= 1) { S.water -= 1; return; }
  for (const w of S.wagons) if (w.hp > 0) w.hp = Math.max(1, w.hp - 3);
  log('No water for the road. Every wagon took 3 damage.');
}

function enterNode(type) {
  const leg = LEGS[S.leg];
  if (type === 'ambush') startFight(pick(leg.normals));
  else if (type === 'boss') startFight(leg.boss);
  else if (type === 'oasis') { S.screen = 'oasis'; log('An oasis. Palms, shade and clean water.'); }
  else if (type === 'market') { S.market = genMarket(); S.screen = 'market'; log('A market in the dunes.'); }
  else if (type === 'ruins') { S.screen = 'ruins'; log('Half-buried ruins beside the road.'); }
  else if (type === 'storm') startStorm();
}

function nextLeg() {
  S.leg++;
  S.pos = { row: -1, lane: 1 };
  S.screen = 'map';
  log(`On to ${LEGS[S.leg].name}.`);
}

/* =========================================================
   Dice (shared by fights and storms)
   ========================================================= */
const roller = () => (S.screen === 'storm' ? S.storm : S.screen === 'fight' ? S.fight : null);
const rollFace = (id) => ({ ...pick(crewById(id).faces) });
const canPour = (d) => has('water') && S.water > 0 && !d.poured && ['atk', 'shd', 'coin'].includes(d.face.t);
function defaultSel() {
  const ids = S.crew.map((c) => c.id);
  const prev = (S.lastSel || []).filter((id) => ids.includes(id));
  for (const id of ids) if (prev.length < Math.min(DICE_PER_TURN, ids.length) && !prev.includes(id)) prev.push(id);
  return prev.slice(0, DICE_PER_TURN);
}
function gainRerolls(R, dice) {
  const n = dice.filter((d) => d.face.t === 'rr').length;
  if (n) { R.rerolls += n; log(`A Reroll face: +${n} reroll${n > 1 ? 's' : ''}.`); }
}

function totals(R) {
  const t = { atk: 0, shd: 0, coin: 0, water: 0, heal: 0, bell: 0 };
  const armory = has('armory'), spice = has('spice');
  const counts = {};
  for (const d of R.dice) {
    const v = d.face.v + (d.poured ? 2 : 0);
    const c = crewById(d.crew);
    if (d.face.t === 'atk') t.atk += v + (armory && c.role === 'Guard' ? 1 : 0);
    else if (d.face.t === 'shd') t.shd += v;
    else if (d.face.t === 'coin') t.coin += v + (spice ? 1 : 0);
    else if (d.face.t === 'water') t.water += v;
    else if (d.face.t === 'heal') t.heal += 1;
    if (hasValue(d.face)) { const k = d.face.t + d.face.v; counts[k] = (counts[k] || 0) + 1; }
  }
  if (has('bell')) { for (const k in counts) t.bell += Math.floor(counts[k] / 2) * 3; t.atk += t.bell; }
  if (has('bulwark')) t.shd += 2;
  return t;
}

/* =========================================================
   Fights
   ========================================================= */
function startFight(kind) {
  const e = ENEMY_TYPES[kind];
  S.fight = {
    id: Math.random(), kind,
    enemy: { name: e.name, blurb: e.blurb, hp: e.hp, max: e.hp, block: 0, step: 0 },
    intent: null, knocked: [], selected: defaultSel(), dice: [], rerolls: 0,
    phase: 'pick', bribeCost: 6, turn: 1, shield: 0,
  };
  S.screen = 'fight';
  S.stats.fights++;
  log(e.boss ? `${e.name} stands in the road.` : `Ambush: ${e.name}!`);
  nextIntent();
}

function nextIntent() {
  const f = S.fight, e = f.enemy, pattern = ENEMY_TYPES[f.kind].pattern, len = pattern.length;
  const base = pattern[e.step % len];
  const bump = Math.floor(e.step / len); // enemies get a little meaner each time their pattern loops
  e.step++;
  const it = { k: base.k, v: base.k === 'drain' ? base.v : base.v + bump, dmg: base.dmg != null ? base.dmg + bump : 0 };
  if (it.k === 'snipe') {
    const pool = S.crew.filter((c) => !f.knocked.includes(c.id));
    it.target = pick(pool).id;
  }
  e.block = it.k === 'guard' ? it.v : 0;
  f.intent = it;
}

function intentInfo(it) {
  const rear = rearWagon();
  const rn = rear ? wagonName(rear) : 'caravan';
  switch (it.k) {
    case 'atk': return { icon: 'atk', title: `Attack the ${rn} for ${it.v}`, detail: 'Block reduces the damage.' };
    case 'guard': return { icon: 'shd', title: `Brace, then hit the ${rn} for ${it.dmg}`, detail: `Absorbs ${it.v} of your damage this turn.` };
    case 'drain': return { icon: 'water', title: `Steal ${it.v} water, hit the ${rn} for ${it.dmg}`, detail: 'Spend your water now or lose it.' };
    case 'snipe': {
      const n = crewById(it.target).name;
      return { icon: 'atk', title: `Snipe ${n} for ${it.v}`, detail: `If ${n} rolls and you block less than ${it.v}, ${n} is knocked out. If ${n} stays back, the ${rn} takes it.` };
    }
  }
}

function hitCaravan(dmg, state, from) {
  const target = rearWagon();
  const blocked = Math.min(state.shield, dmg);
  state.shield -= blocked;
  let rem = dmg - blocked;
  if (target) fx({ k: from === 'storm' ? 'stormhit' : 'eshot', to: 'wagon', id: target.type, dmg: rem, blocked: rem === 0 });
  const parts = [];
  if (blocked) parts.push(`${blocked} blocked`);
  while (rem > 0) {
    const w = rearWagon();
    if (!w) break;
    const take = Math.min(rem, w.hp);
    w.hp -= take; rem -= take;
    parts.push(`${wagonName(w)} −${take}`);
    if (w.hp === 0) parts.push(`${wagonName(w)} wrecked`);
  }
  return parts.join(', ') || 'no damage';
}

function playerPhase() {
  const f = S.fight, e = f.enemy;
  const t = totals(f);
  const dealt = Math.max(0, t.atk - e.block);
  e.hp = Math.max(0, e.hp - dealt);
  S.stats.dmg += dealt; S.stats.turns++;
  S.coin += t.coin; S.stats.coinEarned += t.coin;
  S.water += t.water;
  f.shield = t.shd;
  for (const d of f.dice.filter((x) => x.face.t === 'heal')) {
    if (f.knocked.length) {
      const id = f.knocked.pop();
      log(`${crewById(d.crew).name} patched up ${crewById(id).name}.`);
      fx({ k: 'float', at: 'crew', id, text: 'Back up', cls: 't-heal' });
    } else f.shield += 2;
  }
  if (t.atk) fx({ k: 'pshot', ids: f.dice.filter((d) => d.face.t === 'atk').map((d) => d.crew), dmg: dealt, absorbed: Math.min(e.block, t.atk) });
  if (t.coin) fx({ k: 'gain', text: `+${t.coin} coin`, cls: 't-coin', sfx: 'coin' });
  if (t.water) fx({ k: 'gain', text: `+${t.water} water`, cls: 't-water', sfx: 'water', delay: 250 });
  const bits = [`Hit for ${dealt}`];
  if (e.block && t.atk) bits.push(`${Math.min(e.block, t.atk)} absorbed`);
  if (t.bell) bits.push(`bell +${t.bell}`);
  if (t.coin) bits.push(`+${t.coin} coin`);
  if (t.water) bits.push(`+${t.water} water`);
  log(bits.join(', ') + '.');

  if (e.hp <= 0) {
    f.phase = 'done';
    fx({ k: 'edown' });
    later(1700, winFight);
    return;
  }
  f.phase = 'enemy';
  later(1150, enemyPhase);
}

function enemyPhase() {
  const f = S.fight, e = f.enemy, it = f.intent;
  const state = { shield: f.shield };
  if (it.cancelled) log(`${e.name} took the bribe and held back.`);
  else {
    if (it.k === 'atk') log(`${e.name}: ${hitCaravan(it.v, state)}.`);
    if (it.k === 'guard') log(`${e.name}: ${hitCaravan(it.dmg, state)}.`);
    if (it.k === 'drain') {
      const lost = Math.min(S.water, it.v); S.water -= lost;
      if (lost) fx({ k: 'gain', text: `−${lost} water`, cls: 't-water', delay: 500 });
      log(`Lost ${lost} water. ${hitCaravan(it.dmg, state)}.`);
    }
    if (it.k === 'snipe') {
      const c = crewById(it.target);
      if (f.dice.some((d) => d.crew === it.target)) {
        const blocked = state.shield >= it.v;
        fx({ k: 'eshot', to: 'crew', id: c.id, dmg: it.v, blocked, ko: !blocked });
        if (blocked) log(`The shot at ${c.name} was blocked.`);
        else { f.knocked.push(c.id); log(`${c.name} was knocked out for this fight.`); }
      } else log(`${c.name} stayed back. ${hitCaravan(it.v, state)}.`);
    }
  }
  if (!rearWagon()) { f.phase = 'done'; later(1300, () => lose('Every wagon was wrecked.')); return; }
  if (f.knocked.length >= S.crew.length) { f.phase = 'done'; later(1300, () => lose('The whole crew was knocked out.')); return; }
  f.dice = [];
  f.phase = 'pick';
  f.turn++;
  f.selected = f.selected.filter((id) => !f.knocked.includes(id));
  nextIntent();
}

function winFight() {
  const f = S.fight, e = ENEMY_TYPES[f.kind];
  S.lastSel = f.selected.slice();
  S.coin += e.loot; S.stats.coinEarned += e.loot;
  log(`${e.name} defeated.${e.loot ? ` +${e.loot} coin.` : ''}`);
  for (const w of S.wagons) if (w.hp > 0) w.hp = Math.min(w.max, w.hp + 2);
  if (has('cook')) { for (const w of S.wagons) if (w.hp > 0) w.hp = Math.min(w.max, w.hp + 3); log('The Cook Wagon fed everyone: wagons +3.'); }
  Sfx.play('win');
  if (f.kind === LEGS[LEGS.length - 1].boss) { S.screen = 'victory'; return; }
  S.screen = e.boss ? 'camp' : 'reward';
}
function lose(why) { S.screen = 'defeat'; S.loseReason = why; Sfx.play('lose'); }

/* =========================================================
   Storms, markets, ruins, camps
   ========================================================= */
function startStorm() {
  S.storm = { need: LEGS[S.leg].storm, selected: defaultSel(), dice: [], rerolls: 0, phase: 'pick', knocked: [] };
  S.screen = 'storm';
  log('A sandstorm rolls over the road.');
}

function genMarket() {
  const hires = shuffle(Object.keys(CREW_POOL).filter((id) => !S.crew.some((c) => c.id === id))).slice(0, 2);
  const wagons = Object.keys(WAGON_TYPES).filter((t) => !S.wagons.some((w) => w.type === t));
  return { hires, wagon: wagons.length ? pick(wagons) : null, bought: [] };
}

function upgradeFace(c, i) {
  const f = c.faces[i];
  const before = faceLabel(f);
  if (f.t === 'blank') { f.t = 'atk'; f.v = 3; } else f.v += 2;
  log(`${c.name}: ${before} became ${faceLabel(f)}.`);
}
function trainWorst(c) {
  const score = (f) => (f.t === 'blank' ? -1 : hasValue(f) ? f.v : 99);
  let worst = 0;
  c.faces.forEach((f, i) => { if (score(f) < score(c.faces[worst])) worst = i; });
  upgradeFace(c, worst);
}

/* =========================================================
   Player actions
   ========================================================= */
const A = {
  newRun() { newRun(); },
  resume() { const s = loadSave(); if (s) { S = s; resumePending(); } },
  mute() { Sfx.toggle(); },

  // Map
  go(key) {
    if (S.screen !== 'map') return;
    const n = reachable().find((x) => x.key === key);
    if (!n) return;
    travelCost();
    S.pos = { row: n.row, lane: n.lane };
    S.visited.push(`${S.leg}-${n.row}-${n.lane}`);
    Sfx.play('click');
    enterNode(n.type);
  },
  front(i) { i = +i; if (i > 0) { [S.wagons[i - 1], S.wagons[i]] = [S.wagons[i], S.wagons[i - 1]]; } },

  // Dice
  pick(id) {
    const R = roller();
    if (!R || R.phase !== 'pick' || R.knocked.includes(id) || !crewById(id)) return;
    const i = R.selected.indexOf(id);
    if (i >= 0) R.selected.splice(i, 1);
    else if (R.selected.length < DICE_PER_TURN) R.selected.push(id);
    else { R.selected.shift(); R.selected.push(id); }
    Sfx.play('click');
  },
  roll() {
    const R = roller();
    if (!R || R.phase !== 'pick' || !R.selected.length) return;
    R.dice = R.selected.map((id) => ({ crew: id, face: rollFace(id), held: false, poured: false, fresh: true }));
    R.rerolls = S.screen === 'storm' ? 1 : BASE_REROLLS;
    R.phase = 'roll';
    gainRerolls(R, R.dice);
    Sfx.play('roll');
  },
  hold(i) {
    const R = roller();
    const d = R && R.phase === 'roll' && R.dice[+i];
    if (d && !d.poured) { d.held = !d.held; Sfx.play('click'); }
  },
  reroll() {
    const R = roller();
    if (!R || R.phase !== 'roll') return;
    const free = R.dice.filter((d) => !d.held);
    if (R.rerolls < 1 || !free.length) return;
    R.rerolls--;
    for (const d of free) { d.face = rollFace(d.crew); d.fresh = true; }
    gainRerolls(R, free);
    Sfx.play('roll');
  },
  pour(i) {
    const R = roller();
    const d = R && R.phase === 'roll' && R.dice[+i];
    if (!d || !canPour(d)) return;
    S.water--; d.poured = true; d.held = true;
    Sfx.play('water');
  },
  bribe() {
    const f = S.fight;
    if (!f || !['pick', 'roll'].includes(f.phase) || S.coin < f.bribeCost || f.intent.cancelled) return;
    S.coin -= f.bribeCost;
    log(`Paid ${f.bribeCost} coin. ${f.enemy.name} will skip its move.`);
    f.bribeCost += 3;
    f.intent.cancelled = true;
    Sfx.play('coin');
  },
  end() { if (S.screen === 'fight' && S.fight.phase === 'roll') playerPhase(); },
  weather() {
    const R = S.storm;
    if (S.screen !== 'storm' || R.phase !== 'roll') return;
    const t = totals(R);
    const prot = t.shd + t.heal * 2;
    S.coin += t.coin; S.water += t.water;
    const short = Math.max(0, R.need - prot);
    if (short) log(`The storm got through: ${hitCaravan(short, { shield: 0 }, 'storm')}.`);
    else { log(`You held against the storm with ${prot} block.`); fx({ k: 'gain', text: 'Held!', cls: 't-shd', sfx: 'block' }); }
    S.lastSel = R.selected.slice();
    R.phase = 'done';
    later(1300, () => {
      if (!rearWagon()) { lose('The storm wrecked every wagon.'); return; }
      S.screen = 'map';
    });
  },

  // After a normal fight
  reward(kind) {
    if (kind === 'repair') { for (const w of S.wagons) w.hp = Math.min(w.max, Math.max(w.hp, 0) + 8); log('Wagons patched: +8 each.'); }
    if (kind === 'water') { S.water += 3; log('Found water in the wreckage: +3.'); }
    if (kind === 'loot') { S.coin += 5; S.stats.coinEarned += 5; log('Searched the wreckage: +5 coin.'); Sfx.play('coin'); }
    S.screen = 'map';
  },
  // After a boss
  camp(kind) {
    if (kind === 'rest') { for (const w of S.wagons) w.hp = w.max; log('A full night of repairs. Every wagon is like new.'); }
    if (kind === 'recruit') {
      const pool = Object.keys(CREW_POOL).filter((id) => !S.crew.some((c) => c.id === id));
      if (pool.length && S.crew.length < MAX_CREW) { const c = mkCrew(pick(pool)); S.crew.push(c); log(`${c.name} the ${c.role} joined the caravan.`); }
    }
    if (kind === 'train') { S.upgrade = { free: true, crew: null }; S.screen = 'upgrade'; return; }
    nextLeg();
  },
  oasis(kind) {
    if (kind === 'water') { S.water += 5; log('Filled every water skin: +5.'); Sfx.play('water'); }
    if (kind === 'rest') { for (const w of S.wagons) w.hp = Math.min(w.max, Math.max(w.hp, 0) + 6); log('Rested in the shade: wagons +6.'); }
    S.screen = 'map';
  },
  ruins(kind) {
    if (kind === 'dig') {
      if (Math.random() < 0.5) { S.coin += 10; S.stats.coinEarned += 10; log('You dug up an old coin chest: +10 coin.'); Sfx.play('coin'); S.screen = 'map'; }
      else { log('The dead do not like being disturbed.'); startFight(LEGS[S.leg].ruins); }
      return;
    }
    if (kind === 'pray') {
      if (S.water < 2) return;
      S.water -= 2;
      const c = pick(S.crew);
      log(`You left 2 water at the statue. ${c.name} feels stronger.`);
      trainWorst(c);
    }
    S.screen = 'map';
  },

  // Market
  buy(key) {
    const m = S.market;
    if (S.screen !== 'market' || m.bought.includes(key)) return;
    const [kind, arg] = key.split(':');
    const cost = kind === 'upgrade' ? S.upgradeCost : PRICES[kind];
    if (S.coin < cost) return;
    if (kind === 'hire') {
      if (S.crew.length >= MAX_CREW) return;
      const c = mkCrew(arg); S.crew.push(c); log(`Hired ${c.name} the ${c.role}.`);
    } else if (kind === 'wagon') {
      if (S.wagons.length >= MAX_WAGONS) return;
      S.wagons.push(mkWagon(arg)); log(`Bought a ${WAGON_TYPES[arg].name}. It joins at the rear.`);
    } else if (kind === 'water') { S.water += 3; log('Bought 3 water.'); }
    else if (kind === 'repair') { for (const w of S.wagons) w.hp = Math.min(w.max, Math.max(w.hp, 0) + 5); log('The wainwright patched every wagon: +5.'); }
    else if (kind === 'upgrade') { S.upgrade = { free: false, crew: null }; S.screen = 'upgrade'; Sfx.play('click'); return; }
    S.coin -= cost;
    if (kind !== 'water' && kind !== 'repair') m.bought.push(key);
    Sfx.play('coin');
  },
  leave() { S.screen = 'map'; },
  upCrew(id) { if (S.upgrade) S.upgrade.crew = id; Sfx.play('click'); },
  upFace(i) {
    const u = S.upgrade, c = u && crewById(u.crew);
    if (!c) return;
    const f = c.faces[+i];
    if (f.t === 'rr' || f.t === 'heal') return;
    if (!u.free) { if (S.coin < S.upgradeCost) return; S.coin -= S.upgradeCost; S.upgradeCost += 2; }
    upgradeFace(c, +i);
    Sfx.play('coin');
    S.upgrade = null;
    if (u.free) nextLeg(); else S.screen = 'market';
  },
  upBack() {
    const u = S.upgrade;
    if (u.crew) { u.crew = null; return; }
    S.upgrade = null;
    S.screen = u.free ? 'camp' : 'market';
  },
};

// A save made in the middle of an enemy turn picks up where it stopped.
function resumePending() {
  if (S.screen === 'fight') {
    const f = S.fight;
    if (f.phase === 'enemy') enemyPhase();
    else if (f.phase === 'done') { if (f.enemy.hp <= 0) winFight(); else if (!rearWagon()) lose('Every wagon was wrecked.'); else lose('The whole crew was knocked out.'); }
  }
  if (S.screen === 'storm' && S.storm.phase === 'done') S.screen = 'map';
}

/* =========================================================
   Sound (synthesised with Web Audio, starts after the first tap)
   ========================================================= */
const Sfx = (() => {
  let ctx = null;
  let muted = false;
  try { muted = localStorage.getItem('caravan-mute') === '1'; } catch (err) { /* ignore */ }
  function ac() {
    if (!ctx) { const C = window.AudioContext || window.webkitAudioContext; if (!C) return null; try { ctx = new C(); } catch (err) { return null; } }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  function tone(freq, dur, type, vol, when = 0, slide = 0) {
    const c = ac(); if (!c) return;
    const t = c.currentTime + when;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq * slide), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g).connect(c.destination); o.start(t); o.stop(t + dur + 0.02);
  }
  function noise(dur, vol, when = 0, freq = 1800) {
    const c = ac(); if (!c) return;
    const t = c.currentTime + when;
    const len = Math.max(1, Math.floor(c.sampleRate * dur));
    const buf = c.createBuffer(1, len, c.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const s = c.createBufferSource(); s.buffer = buf;
    const f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = 1.2;
    const g = c.createGain(); g.gain.value = vol;
    s.connect(f).connect(g).connect(c.destination); s.start(t);
  }
  const P = {
    roll() { for (let i = 0; i < 7; i++) noise(0.045, 0.35, i * 0.055 + Math.random() * 0.03, 2200 + Math.random() * 1800); },
    land() { noise(0.06, 0.4, 0, 1100); },
    hit() { tone(150, 0.25, 'sine', 0.35, 0, 0.4); noise(0.12, 0.3, 0, 700); },
    hurt() { tone(95, 0.35, 'triangle', 0.3, 0, 0.5); noise(0.22, 0.25, 0, 420); },
    block() { tone(880, 0.18, 'triangle', 0.12); tone(1320, 0.24, 'sine', 0.08, 0.02); },
    coin() { tone(1568, 0.08, 'square', 0.05); tone(2093, 0.16, 'square', 0.045, 0.07); },
    water() { tone(420, 0.16, 'sine', 0.12, 0, 2); },
    click() { tone(680, 0.05, 'triangle', 0.06); },
    ko() { tone(330, 0.45, 'sawtooth', 0.07, 0, 0.35); },
    win() { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.28, 'triangle', 0.12, i * 0.11)); },
    lose() { [392, 330, 262].forEach((f, i) => tone(f, 0.45, 'triangle', 0.12, i * 0.2)); },
  };
  return {
    play(n) { if (muted) return; try { P[n] && P[n](); } catch (err) { /* ignore */ } },
    get muted() { return muted; },
    toggle() { muted = !muted; try { localStorage.setItem('caravan-mute', muted ? '1' : '0'); } catch (err) { /* ignore */ } if (!muted) ac(); },
    unlock() { if (!muted) ac(); },
  };
})();

  /* 3D dice */
  const diceGroup = new T.Group(); W.add(diceGroup);
  const dieGeo = new T.BoxGeometry(0.68, 0.68, 0.68);
  const faceMats = {};
  function faceMat(f) {
    const key = f.t + f.v;
    if (faceMats[key]) return faceMats[key];
    const cv = document.createElement('canvas'); cv.width = cv.height = 128;
    const x = cv.getContext('2d');
    x.fillStyle = '#fffcf6'; x.fillRect(0, 0, 128, 128);
    x.strokeStyle = '#ead9bf'; x.lineWidth = 10; x.strokeRect(5, 5, 118, 118);
    const col = FACE_COLOR[f.t];
    x.strokeStyle = col; x.lineCap = 'round'; x.lineJoin = 'round';
    x.save();
    if (hasValue(f)) { x.translate(64 - 22, 12); x.scale(44 / 24, 44 / 24); } else { x.translate(64 - 36, 28); x.scale(72 / 24, 72 / 24); }
    x.lineWidth = 2.6; x.stroke(new Path2D(ICON_D[f.t]));
    x.restore();
    if (hasValue(f)) { x.fillStyle = col; x.font = '700 56px Poppins, "Segoe UI", sans-serif'; x.textAlign = 'center'; x.fillText(String(f.v), 64, 114); }
    const tex = new T.CanvasTexture(cv);
    tex.encoding = T.sRGBEncoding; tex.anisotropy = 4;
    return (faceMats[key] = new T.MeshStandardMaterial({ map: tex, roughness: 0.7 }));
  }
  const dieMeshes = [];
  function makeDie() {

    const r = ring(); r.scale.setScalar(1.1); r.position.y = -0.31; m.add(r); m.userData.ring = r;
    diceGroup.add(m); hitTargets.push(m);

  }
  function setDieFaces(m, d, crew) {
    const others = crew ? crew.faces.slice() : [];

    if (idx >= 0) others.splice(idx, 1);
    while (others.length < 5) others.push({ t: 'blank', v: 0 });
    const o = others.map(faceMat);
    m.material = [o[0], o[1], faceMat(d.face), o[2], o[3], o[4]];
  }
  const dieHome = (i) => new T.Vector3(-0.6 + i * 0.95, 0.34, 1.95);
  function animateRoll(m, home, i) {
    const start = home.clone().add(new T.Vector3(-1.6 + sr() * 0.4, 2.4, 0.8));
    const spin = new T.Vector3((sr() - 0.5) * 14, (sr() - 0.5) * 10, (sr() - 0.5) * 14);

  }
  function syncDice(R) {

    const show = R && R.phase !== 'pick' && R.dice.length && (scr === 'fight' || scr === 'storm');

    dieMeshes.forEach((m) => { m.visible = false; m.userData.pick = null; });
    if (!show) return;

  /* Tweens and effects */
  const tweens = [];
  function tween(dur, fn, doneFn, delay = 0) { tweens.push({ t0: performance.now() + delay, dur, fn, done: doneFn }); }
  function bump(obj, delay = 0) { tween(320, (p) => obj.scale.setScalar(1 + Math.sin(p * PI) * 0.14), () => obj.scale.setScalar(1), delay); }
  function shake(obj, delay = 0) { tween(440, (p) => { obj.rotation.z = Math.sin(p * PI * 6) * 0.12 * (1 - p); }, () => { obj.rotation.z = 0; }, delay); }
  function burst(p, color, delay = 0) {

  }
  function shot(from, to, color, delay, onHit) {

      m.visible = true;

  const front = () => { const w = S && S.wagons[0]; return w && wagonEnt[w.type]; };

  function play(list) {

        });

      }

      }
    }
  }

  /* Sync scene to game state */
  let lastS = null;

        base = 'sit';
      } else if (scr === 'map') base = 'walk';
      else if (scr === 'defeat') base = 'die';
      else {
        if (forward.includes(c.id)) z += 0.55;
        if (knocked.includes(c.id)) base = 'die';
      }
      setT(e, { x, z, ry });
      e.wantBase = base;
      const sel = R && R.phase === 'pick' && R.selected.includes(c.id);
      e.ring.visible = !!sel || c.id === target;
      e.ring.material = c.id === target ? ringMats.target : ringMats.sel;
      e.hit.userData.pick = R && R.phase === 'pick' ? { crew: c.id } : null;
    });
    syncDice(R);
  }

  /* Tapping figures and dice */
  const ray = new T.Raycaster();
  let down = null;
  const handlers = { crew: null, die: null };
  renderer.domElement.addEventListener('pointerdown', (ev) => { down = { x: ev.clientX, y: ev.clientY }; });
  renderer.domElement.addEventListener('pointerup', (ev) => {
    if (!down || Math.hypot(ev.clientX - down.x, ev.clientY - down.y) > 10) return;
    const r = renderer.domElement.getBoundingClientRect();
    ray.setFromCamera({ x: ((ev.clientX - r.left) / r.width) * 2 - 1, y: -((ev.clientY - r.top) / r.height) * 2 + 1 }, cam);
    const hits = ray.intersectObjects(hitTargets.filter((h) => h.userData.pick), false);
    if (!hits.length) return;
    const p = hits[0].object.userData.pick;
    if (p.crew && handlers.crew) handlers.crew(p.crew);
    if (p.die != null && handlers.die) handlers.die(p.die);
  });

  /* Size and render loop */
  function resize() {
    const w = host.clientWidth, h = host.clientHeight;
    if (!w || !h) return;
    renderer.setSize(w, h, false);
    const aspect = w / h;
    let worldW = 14.2, worldH = worldW / aspect;
    if (worldH < 8.2) { worldH = 8.2; worldW = worldH * aspect; }
    cam.left = -worldW / 2; cam.right = worldW / 2; cam.top = worldH / 2 + 0.5; cam.bottom = -worldH / 2 + 0.5;
    cam.updateProjectionMatrix();
  }
  new ResizeObserver(resize).observe(host);
  resize();

  let last = performance.now();
  function angleLerp(a, b, k) { let d = b - a; while (d > PI) d -= 2 * PI; while (d < -PI) d += 2 * PI; return a + d * k; }
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    for (let i = tweens.length - 1; i >= 0; i--) {
      const tw = tweens[i];
      const p = (now - tw.t0) / tw.dur;
      if (p < 0) continue;
      tw.fn(Math.min(p, 1));
      if (p >= 1) { tweens.splice(i, 1); if (tw.done) tw.done(); }
    }
    mixers.forEach((m) => m.update(dt));
    const k = 1 - Math.pow(0.002, dt);
    for (const e of ents) {
      if (now < e.lock) continue;
      const o = e.outer, t = e.t;
      o.position.x += (t.x - o.position.x) * k;
      o.position.y += (t.y - o.position.y) * k;
      o.position.z += (t.z - o.position.z) * k;
      o.rotation.y = angleLerp(o.rotation.y, t.ry, k);
      o.rotation.x += (t.rx - o.rotation.x) * k;
      if (e.ch && e.wantBase && e.ch.base !== e.wantBase) {
        e.ch.base = e.wantBase;
        setAnim(e, e.wantBase, e.wantBase === 'die');
      }
    }
    if (!reduced) {
      const t = now / 1000;
      if (enemy && !enemy.dying) {
        if (enemy.spin) enemy.spin.rotation.y = t * 1.3;
        if (enemy.kind === 'wraith' || enemy.kind === 'storm') enemy.inner.position.y = 0.2 + Math.sin(t * 1.6) * 0.15;
      }
      flames.forEach((fl, i) => fl.scale.set(1 + Math.sin(t * 13 + i) * 0.08, 1 + Math.sin(t * 9 + i * 2) * 0.16, 1));
      if (groups.storm && groups.storm.visible) groups.storm.rotation.y = t * 0.9;
    }
    renderer.render(scene, cam);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  Promise.all(loads).then(() => {
    loaded = true;
    buildWorld();
    status.hidden = true;
    sync(lastS);
  });

  return { sync, play, handlers };
})();

/* =========================================================
   Rendering (DOM)
   ========================================================= */
function personSvg(color) {
  return `<svg viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="8" r="4.2" fill="#c99a72"/><path d="M7 23c0-6 2.6-10 6-10s6 4 6 10z" fill="${color}" stroke="#00000018"/></svg>`;
}

function headerHtml() {
  const muteBtn = `<button class="iconbtn" data-act="mute" aria-label="${Sfx.muted ? 'Turn sound on' : 'Turn sound off'}">${icon(Sfx.muted ? 'mute' : 'sound')}</button>`;
  if (!S) return `<header class="top"><div class="brand">Caravan</div><div class="res">${muteBtn}</div></header>`;
  const p = S.pos;
  const dots = [0, 1, 2, 3].map((r) => {
    const cls = r < p.row || (r === p.row && S.screen === 'map') ? 'done' : r === p.row ? 'here' : '';
    return `<span class="dot ${cls} ${r === 3 ? 'boss' : ''}"></span>`;
  }).join('');
  return `<header class="top">
    <div class="brand">Caravan</div>
    <div class="res">
      <span class="chip water" title="Water">${icon('water')}<span class="num">${S.water}</span></span>
      <span class="chip coin" title="Coin">${icon('coin')}<span class="num">${S.coin}</span></span>
      ${muteBtn}
    </div>
    <div class="road"><span>Leg ${S.leg + 1} of ${LEGS.length}</span><b>${LEGS[S.leg].name}</b><span class="dots">${dots}</span></div>
  </header>`;
}

function overlayHtml() {
  if (!S) return '';
  const scr = S.screen;
  let ctx = '';
  if (scr === 'fight') {
    const e = S.fight.enemy;
    ctx = `<div class="ctx">
      <div class="row"><b>${e.name}</b><span class="hp">${e.hp}/${e.max}</span></div>
      <div class="bar"><span style="width:${(100 * e.hp) / e.max}%"></span></div>
      ${e.block && S.fight.phase !== 'done' ? `<span class="block">${icon('shd')} Absorbs ${e.block} this turn</span>` : ''}
    </div>`;
  } else {
    const names = { map: 'On the road', oasis: 'Oasis', market: 'Market', upgrade: 'Market', ruins: 'Ruins', storm: 'Sandstorm', reward: 'After the fight', camp: 'Camp', victory: 'The city gate', defeat: 'Lost in the sand' };
    ctx = `<div class="ctx"><b>${names[scr] || ''}</b></div>`;
  }
  const rear = rearWagon();
  const chips = [...S.wagons].reverse().map((w) => `<div class="wchip ${w.hp <= 0 ? 'dead' : ''} ${w === rear ? 'rear' : ''}">
      <span>${wagonName(w)} <span class="num">${Math.max(0, w.hp)}</span></span>
      <div class="bar fill-ok"><span style="width:${(100 * Math.max(0, w.hp)) / w.max}%"></span></div>
    </div>`).join('');
  return `${ctx}<div class="wchips">${chips}</div>`;
}

function faceHtml(f, bonus = 0) {
  return `<span class="face t-${f.t}">${icon(f.t)}${hasValue(f) ? `<span class="num">${f.v + bonus}</span>` : ''}</span>`;
}
function miniFaces(c, act) {
  return c.faces.map((fc, i) => {
    const inner = `${icon(fc.t)}${hasValue(fc) ? fc.v : ''}`;
    if (!act) return `<span class="mini t-${fc.t}" title="${faceLabel(fc)}">${inner}</span>`;
    const ok = fc.t !== 'rr' && fc.t !== 'heal';
    return `<button class="mini t-${fc.t}" data-act="${act}" data-arg="${i}" ${ok ? '' : 'disabled'} aria-label="Upgrade ${faceLabel(fc)}">${inner}</button>`;
  }).join('');
}

function trayHtml(R) {
  return R.dice.map((d, i) => {
    const c = crewById(d.crew);
    const bonus = (d.poured ? 2 : 0) + (d.face.t === 'atk' && c.role === 'Guard' && has('armory') ? 1 : 0) + (d.face.t === 'coin' && has('spice') ? 1 : 0);
    const live = R.phase === 'roll';
    return `<div class="slot">
      <button class="die ${d.held ? 'held' : ''} ${d.fresh ? 'tumble' : ''}" data-act="hold" data-arg="${i}" ${live ? '' : 'disabled'} aria-pressed="${d.held}" aria-label="${c.name}: ${faceLabel(d.face)}${d.held ? ', held' : ''}">
        ${d.held ? '<span class="held-tag">Held</span>' : ''}
        ${faceHtml(d.face, bonus)}
        <span class="who">${c.name}</span>
      </button>
      <button class="pour ${d.poured ? 'done' : ''}" data-act="pour" data-arg="${i}" ${live && canPour(d) ? '' : 'disabled'} aria-label="Pour water on ${c.name} for +2">${icon('water')}+2</button>
    </div>`;
  }).join('');
}

function previewHtml(R, storm) {
  if (R.phase === 'pick') return `<span class="hint">Pick up to ${DICE_PER_TURN} crew here or by tapping them on the island, then roll.</span>`;
  const t = totals(R);
  const out = [];
  if (storm) {
    const prot = t.shd + t.heal * 2;
    out.push(`<span class="t-shd">${icon('shd')}<span class="num">${prot}</span>&nbsp;of ${R.need} block</span>`);
  } else {
    const e = S.fight.enemy;
    out.push(`<span class="t-atk">${icon('atk')}<span class="num">${Math.max(0, t.atk - e.block)}</span>&nbsp;damage${e.block && t.atk ? ` (${Math.min(e.block, t.atk)} absorbed)` : ''}${t.bell ? ` incl. bell +${t.bell}` : ''}</span>`);
    out.push(`<span class="t-shd">${icon('shd')}<span class="num">${t.shd}</span>&nbsp;block</span>`);
    if (t.heal) out.push(`<span class="t-heal">${icon('heal')}${t.heal} mend</span>`);
  }
  if (t.coin) out.push(`<span class="t-coin">${icon('coin')}+${t.coin}</span>`);
  if (t.water) out.push(`<span class="t-water">${icon('water')}+${t.water}</span>`);
  return out.join('');
}

function rosterHtml(R) {
  const f = S.screen === 'fight' ? S.fight : null;
  return S.crew.map((c) => {
    const ko = R.knocked.includes(c.id);
    const sel = R.selected.includes(c.id);
    const targeted = f && f.intent && f.intent.k === 'snipe' && f.intent.target === c.id && !f.intent.cancelled;
    const badge = ko ? '<span class="badge grey">Out</span>' : targeted ? '<span class="badge red">Targeted</span>' : sel ? '<span class="badge">Rolling</span>' : '';
    return `<button class="crew ${sel ? 'sel' : ''} ${targeted ? 'targeted' : ''} ${ko ? 'ko' : ''}" data-act="pick" data-arg="${c.id}" ${R.phase !== 'pick' || ko ? 'disabled' : ''} aria-pressed="${sel}">
      ${badge}
      <span class="head"><span class="tile">${personSvg(c.color)}</span><span class="nm"><b>${c.name}</b><span class="role">${c.role}</span></span></span>
      <span class="faces">${miniFaces(c)}</span>
    </button>`;
  }).join('');
}

function diceSection(R, storm) {
  const picking = R.phase === 'pick';
  const head = picking
    ? `<div class="label"><span>Who rolls</span><span>${R.selected.length}/${Math.min(DICE_PER_TURN, S.crew.length - R.knocked.length)} chosen</span></div><div class="roster">${rosterHtml(R)}</div>`
    : `<div class="label"><span>${R.phase === 'roll' ? 'Tap a die to hold it' : 'Resolving…'}</span><span>${R.dice.filter((d) => d.held).length} held</span></div><div class="tray">${trayHtml(R)}</div>`;
  return `<section class="stack" style="gap:10px" aria-label="Dice">${head}<div class="preview">${previewHtml(R, storm)}</div></section>`;
}

function fightHtml() {
  const f = S.fight, info = intentInfo(f.intent);
  const busy = f.phase === 'enemy' || f.phase === 'done';
  const canBribe = !busy && S.coin >= f.bribeCost && !f.intent.cancelled;
  const bribe = `<button class="btn" data-act="bribe" ${canBribe ? '' : 'disabled'}>Bribe<small>${f.bribeCost} coin</small></button>`;
  let actions;
  if (f.phase === 'pick') actions = `${bribe}<button class="btn primary" data-act="roll" ${f.selected.length ? '' : 'disabled'}>Roll ${f.selected.length} crew<small>Turn ${f.turn}</small></button>`;
  else if (f.phase === 'roll') {
    const free = f.dice.some((d) => !d.held);
    actions = `${bribe}<button class="btn" data-act="reroll" ${f.rerolls > 0 && free ? '' : 'disabled'}>Reroll<small>${f.rerolls} left</small></button>
      <button class="btn primary" data-act="end">End turn<small>Enemy moves</small></button>`;
  } else actions = `<button class="btn primary" disabled>${f.phase === 'enemy' ? `${f.enemy.name} moves…` : 'Fight over'}</button>`;
  return `
  <div class="intent ${f.intent.cancelled ? 'cancelled' : ''} ${f.phase === 'enemy' ? 'acting' : ''}">
    <span class="tile">${icon(info.icon)}</span>
    <span class="txt">
      <span class="eyebrow">${f.intent.cancelled ? 'Bribed, skipping this move' : `${f.enemy.name} · next move`}</span>
      <strong>${info.title}</strong>
      <span class="detail">${info.detail}</span>
    </span>
  </div>
  ${diceSection(f, false)}
  <ul class="log" aria-live="polite">${S.log.slice(0, 2).map((l) => `<li>${l}</li>`).join('')}</ul>
  <details class="help">
    <summary>How a turn works</summary>
    <ol>
      <li>Read the enemy's next move.</li>
      <li>Pick up to ${DICE_PER_TURN} crew. Each crew member is a die with six faces, shown on their card.</li>
      <li>Roll. Tap dice to hold them, then reroll the rest. You get ${BASE_REROLLS} rerolls a turn, plus one for each Reroll face.</li>
      <li>Pour water on an Attack, Block or Coin die for +2. The Water Cart has to be standing.</li>
      <li>End the turn. Your attacks land first, then the enemy moves. Enemies hit the rear wagon.</li>
      <li>Coin bribes an enemy to skip its next move. Knocked-out crew come back after the fight.</li>
    </ol>
  </details>
  <div class="actions">${actions}</div>`;
}

function stormHtml() {
  const R = S.storm;
  let actions;
  if (R.phase === 'pick') actions = `<button class="btn primary" data-act="roll" ${R.selected.length ? '' : 'disabled'}>Roll ${R.selected.length} crew<small>Brace for the storm</small></button>`;
  else if (R.phase === 'roll') {
    const free = R.dice.some((d) => !d.held);
    actions = `<button class="btn" data-act="reroll" ${R.rerolls > 0 && free ? '' : 'disabled'}>Reroll<small>${R.rerolls} left</small></button>
      <button class="btn primary" data-act="weather">Weather it<small>Need ${R.need} block</small></button>`;
  } else actions = `<button class="btn primary" disabled>The storm passes…</button>`;
  return `
  <div class="intent storm">
    <span class="tile">${icon('wind')}</span>
    <span class="txt">
      <span class="eyebrow">Sandstorm</span>
      <strong>Roll at least ${R.need} block</strong>
      <span class="detail">Every point short hits the rear wagon. Mend faces count as 2 block. You get 1 reroll.</span>
    </span>
  </div>
  ${diceSection(R, true)}
  <ul class="log" aria-live="polite">${S.log.slice(0, 2).map((l) => `<li>${l}</li>`).join('')}</ul>
  <div class="actions">${actions}</div>`;
}

function mapHtml() {
  const leg = S.map[S.leg], p = S.pos;
  const reach = reachable();
  const reachKeys = reach.map((n) => n.key);
  // Grid: 5 rows from the top (boss) to the bottom (start), 3 lanes.
  const X = (lane) => ((lane + 0.5) / 3) * 100;
  const Y = (row) => ((4 - (row + 1) + 0.5) / 5) * 100; // row -1 = start at bottom, row 3 = boss at top
  const lines = [];
  const link = (r1, l1, r2, l2, hot) => lines.push(`<line x1="${X(l1) * 3}" y1="${Y(r1) * 3.4}" x2="${X(l2) * 3}" y2="${Y(r2) * 3.4}" stroke="${hot ? '#ef8a26' : '#d6c5a5'}" stroke-width="${hot ? 3 : 2}" stroke-dasharray="${hot ? '0' : '5 5'}" stroke-linecap="round"/>`);
  leg.rows[0].forEach((n) => link(-1, 1, 0, n.lane, p.row === -1));
  for (let r = 0; r < 2; r++) for (const a of leg.rows[r]) for (const b of leg.rows[r + 1]) if (Math.abs(a.lane - b.lane) <= 1) link(r, a.lane, r + 1, b.lane, p.row === r && p.lane === a.lane);
  leg.rows[2].forEach((n) => link(2, n.lane, 3, 1, p.row === 2 && p.lane === n.lane));
  const nodeBtn = (row, lane, type, extra = '') => {
    const key = row === 3 ? 'boss' : `${row}-${lane}`;
    const visited = S.visited.includes(`${S.leg}-${row}-${lane}`);
    const here = p.row === row && p.lane === lane;
    const can = reachKeys.includes(key);
    const info = NODE_INFO[type];
    const label = type === 'boss' ? ENEMY_TYPES[LEGS[S.leg].boss].name.replace('The ', '') : info.label;
    const cls = [here ? 'here' : visited ? 'visited' : can ? 'reach' : (row <= p.row ? 'far' : ''), type === 'boss' ? 'boss' : ''].join(' ');
    return `<button class="node ${cls}" data-t="${type}" style="left:${X(lane)}%;top:${Y(row)}%" ${can ? `data-act="go" data-arg="${key}"` : 'tabindex="-1" aria-disabled="true"'} aria-label="${label}${can ? ', go here' : ''}">
      <span class="disc">${icon(info.icon)}</span><span class="nl">${label}</span>${extra}</button>`;
  };
  const nodes = [];
  nodes.push(`<div class="node ${p.row === -1 ? 'here' : 'visited'}" style="left:${X(1)}%;top:${Y(-1)}%"><span class="disc">${icon('flag')}</span><span class="nl">Start</span></div>`);
  leg.rows.forEach((row, r) => row.forEach((n) => nodes.push(nodeBtn(r, n.lane, n.type))));
  nodes.push(nodeBtn(3, 1, 'boss'));
  const boss = ENEMY_TYPES[LEGS[S.leg].boss];
  const moves = boss.pattern.map((it) => `<li>${it.k === 'atk' ? `Attack for ${it.v}` : it.k === 'guard' ? `Brace (absorbs ${it.v}), hit for ${it.dmg}` : it.k === 'drain' ? `Steal ${it.v} water, hit for ${it.dmg}` : `Snipe a crew member for ${it.v}`}</li>`).join('');
  const wl = S.wagons.map((w, i) => `<div class="wrow">
      <span class="pos">${i === 0 ? 'Front' : i === S.wagons.length - 1 ? 'Rear' : i + 1}</span>
      <span class="txt"><b>${wagonName(w)} <span class="num" style="font-weight:500;color:var(--muted)">${Math.max(0, w.hp)}/${w.max}</span></b><span class="d">${WAGON_TYPES[w.type].perk}</span></span>
      <button class="small-btn" data-act="front" data-arg="${i}" ${i === 0 ? 'disabled' : ''} aria-label="Move ${wagonName(w)} forward">${icon('up')}</button>
    </div>`).join('');
  return `<section class="panel">
    <h1>${p.row === -1 ? `Set out across ${LEGS[S.leg].name}` : 'Choose the next stop'}</h1>
    <p>Tap a glowing stop. Each step on the road costs 1 water${S.water < 1 ? '. You have none, so every wagon will take 3 damage' : ''}.</p>
    <div class="map">
      <svg class="lines" viewBox="0 0 300 340" preserveAspectRatio="none" aria-hidden="true">${lines.join('')}</svg>
      ${nodes.join('')}
    </div>
    <div class="legend">${['ambush', 'oasis', 'market', 'ruins', 'storm'].map((t) => `<span>${icon(NODE_INFO[t].icon)} <b>${NODE_INFO[t].label}</b> ${NODE_INFO[t].desc}</span>`).join('')}</div>
    <div class="card scout"><div class="label"><span>Scout report: ${boss.name}</span><span class="num">${boss.hp} health</span></div><p>${boss.blurb} Its moves, in order, then repeating and getting stronger:</p><ol>${moves}</ol></div>
    <div class="label"><span>Wagon order</span><span>Enemies hit the rear first</span></div>
    <div class="wlist">${wl}</div>
    <ul class="log">${S.log.slice(0, 3).map((l) => `<li>${l}</li>`).join('')}</ul>
  </section>`;
}

function choice(act, arg, ic, cls, title, desc, opts = {}) {
  return `<button class="choice ${opts.done ? 'done' : ''}" data-act="${act}" data-arg="${arg}" ${opts.disabled ? 'disabled' : ''}>
    <span class="tile ${cls}">${ic.startsWith('<') ? ic : icon(ic)}</span>
    <span class="txt"><b>${title}</b><span class="d">${desc}</span></span>
    ${opts.price != null ? `<span class="price">${icon('coin')}${opts.price}</span>` : ''}
  </button>`;
}

function rewardHtml() {
  return `<section class="panel">
    <h1>${ENEMY_TYPES[S.fight.kind].name} defeated</h1>
    <p>Your crew is back on their feet and patched every wagon for 2. Choose one more thing before you move on.</p>
    <div class="choices">
      ${choice('reward', 'repair', 'shd', 't-shd', 'Patch the wagons', '+8 health to every wagon, including wrecked ones.')}
      ${choice('reward', 'water', 'water', 't-water', 'Look for water', `+3 water. You have ${S.water}.`)}
      ${choice('reward', 'loot', 'coin', 't-coin', 'Search the wreckage', `+5 coin. You have ${S.coin}.`)}
    </div>
    <ul class="log">${S.log.slice(0, 3).map((l) => `<li>${l}</li>`).join('')}</ul>
  </section>`;
}

function campHtml() {
  const full = S.crew.length >= MAX_CREW;
  return `<section class="panel">
    <h1>${ENEMY_TYPES[S.fight.kind].name} is beaten</h1>
    <p>You made it across ${LEGS[S.leg].name}. Camp for the night, then set out for ${LEGS[S.leg + 1].name}. Choose one.</p>
    <div class="choices">
      ${choice('camp', 'rest', 'shd', 't-shd', 'Full repairs', 'Every wagon goes back to full health.')}
      ${choice('camp', 'recruit', personSvg('#ef8a26'), '', 'Recruit a traveller', full ? 'Your caravan is full.' : 'A random new crew member joins for free.', { disabled: full })}
      ${choice('camp', 'train', 'atk', 't-atk', 'Train', 'Upgrade any one face for free.')}
    </div>
    <ul class="log">${S.log.slice(0, 3).map((l) => `<li>${l}</li>`).join('')}</ul>
  </section>`;
}

function oasisHtml() {
  return `<section class="panel">
    <h1>An oasis</h1>
    <p>Shade, palms and a clear pool. You have time for one thing.</p>
    <div class="choices">
      ${choice('oasis', 'water', 'water', 't-water', 'Fill the water skins', `+5 water. You have ${S.water}.`)}
      ${choice('oasis', 'rest', 'shd', 't-shd', 'Rest in the shade', '+6 health to every wagon, including wrecked ones.')}
    </div>
  </section>`;
}

function ruinsHtml() {
  return `<section class="panel">
    <h1>Half-buried ruins</h1>
    <p>An old statue watches the road. Something glints in the sand under the pillars.</p>
    <div class="choices">
      ${choice('ruins', 'dig', 'coin', 't-coin', 'Dig under the pillars', 'Even odds: a chest of 10 coin, or the tomb guards wake up and fight.')}
      ${choice('ruins', 'pray', 'water', 't-water', 'Leave water at the statue', 'Costs 2 water. A random crew member\'s weakest face improves.', { disabled: S.water < 2 })}
      ${choice('ruins', 'leave', 'flag', '', 'Walk on', 'Nothing gained, nothing lost.')}
    </div>
  </section>`;
}

function marketHtml() {
  const m = S.market;
  const items = [];
  for (const id of m.hires) {
    const d = CREW_POOL[id], key = `hire:${id}`, bought = m.bought.includes(key);
    const faces = d.faces.map(parseFace).map(faceLabel).join(', ');
    items.push(choice('buy', key, personSvg(d.color), '', `Hire ${d.name} the ${d.role}`, bought ? 'Hired.' : S.crew.length >= MAX_CREW ? 'Your caravan is full.' : faces,
      { price: PRICES.hire, done: bought, disabled: bought || S.coin < PRICES.hire || S.crew.length >= MAX_CREW }));
  }
  if (m.wagon) {
    const key = `wagon:${m.wagon}`, bought = m.bought.includes(key), def = WAGON_TYPES[m.wagon];
    items.push(choice('buy', key, 'cart', '', `Buy a ${def.name}`, bought ? 'Bought.' : S.wagons.length >= MAX_WAGONS ? 'You already have 4 wagons.' : `${def.perk} ${def.max} health.`,
      { price: PRICES.wagon, done: bought, disabled: bought || S.coin < PRICES.wagon || S.wagons.length >= MAX_WAGONS }));
  }
  items.push(choice('buy', 'upgrade', 'atk', 't-atk', 'Upgrade a face', 'Pick any crew member and face: +2, or a blank becomes Attack 3.', { price: S.upgradeCost, disabled: S.coin < S.upgradeCost }));
  items.push(choice('buy', 'water', 'water', 't-water', 'Buy water', '+3 water.', { price: PRICES.water, disabled: S.coin < PRICES.water }));
  items.push(choice('buy', 'repair', 'shd', 't-shd', 'Hire the wainwright', '+5 health to every wagon.', { price: PRICES.repair, disabled: S.coin < PRICES.repair }));
  return `<section class="panel">
    <h1>A market in the dunes</h1>
    <p>You have <b class="num">${S.coin}</b> coin. Buy as much as you can afford.</p>
    <div class="choices">${items.join('')}</div>
    <ul class="log">${S.log.slice(0, 2).map((l) => `<li>${l}</li>`).join('')}</ul>
    <button class="btn primary solo" data-act="leave">Leave the market</button>
  </section>`;
}

function upgradeHtml() {
  const u = S.upgrade;
  const cost = u.free ? 'Free' : `${S.upgradeCost} coin`;
  if (!u.crew) {
    return `<section class="panel">
      <h1>Who trains?</h1>
      <p>Choose a crew member, then the face to improve. ${cost}.</p>
      <div class="roster">${S.crew.map((c) => `<button class="crew" data-act="upCrew" data-arg="${c.id}">
        <span class="head"><span class="tile">${personSvg(c.color)}</span><span class="nm"><b>${c.name}</b><span class="role">${c.role}</span></span></span>
        <span class="faces">${miniFaces(c)}</span></button>`).join('')}</div>
      <button class="btn solo" data-act="upBack">Back</button>
    </section>`;
  }
  const c = crewById(u.crew);
  return `<section class="panel">
    <h1>Upgrade one of ${c.name}'s faces</h1>
    <p>Attack, Block, Coin and Water faces get +2. A blank becomes Attack 3. Reroll and Mend faces can't be upgraded. ${cost}.</p>
    <div class="card" style="padding:12px"><div class="faces" style="gap:8px">${miniFaces(c, 'upFace')}</div></div>
    <button class="btn solo" data-act="upBack">Choose someone else</button>
  </section>`;
}

function endHtml(won) {
  return `<section class="panel">
    <h1>${won ? 'You reached the city' : `Lost on ${LEGS[S.leg].name}`}</h1>
    <p>${won ? 'The Gate Warden fell and the caravan rolled through the gate. Every run starts from scratch, so try a different route and crew next time.' : `${S.loseReason} The caravan scatters into the sand.`}</p>
    <div class="stats">
      <div class="stat"><b class="num">${S.stats.fights}</b><span>fights</span></div>
      <div class="stat"><b class="num">${S.stats.dmg}</b><span>damage dealt</span></div>
      <div class="stat"><b class="num">${S.stats.coinEarned}</b><span>coin earned</span></div>
    </div>
    <ul class="log">${S.log.slice(0, 5).map((l) => `<li>${l}</li>`).join('')}</ul>
    <button class="btn primary solo" data-act="newRun">Ride again</button>
  </section>`;
}

function titleHtml() {
  const s = loadSave();
  const cont = s ? `<button class="btn primary solo" data-act="resume">Continue run<small>Leg ${s.leg + 1}: ${LEGS[s.leg].name} · ${s.crew.length} crew · ${s.coin} coin</small></button>` : '';
  return `<section class="panel hero">
    <h1>Cross the desert, one roll at a time</h1>
    <p>Lead a merchant caravan to the city on the far side of the sand. Your crew are your dice. Each turn, choose who rolls and spend the faces to fight, block, trade and survive.</p>
    <div class="cta">${cont}<button class="btn ${s ? '' : 'primary'} solo" data-act="newRun">${s ? 'Start a new run' : 'Start a run'}<small>Three legs, about 45 minutes</small></button></div>
    <details class="help"><summary>How a run works</summary><ul>
      <li>Pick a route across each leg's map: ambushes, oases, markets, ruins and sandstorms.</li>
      <li>Each leg ends with a boss. The Gate Warden waits at the end of the third.</li>
      <li>Spend coin at markets to hire crew, buy wagons and upgrade faces.</li>
      <li>Your progress saves after every step, so you can close the page and come back.</li>
    </ul></details>
    <p class="credit">3D models by Kenney (kenney.nl), CC0.</p>
  </section>`;
}

const VIEWS = {
  map: mapHtml, fight: fightHtml, storm: stormHtml, reward: rewardHtml, camp: campHtml, oasis: oasisHtml,
  ruins: ruinsHtml, market: marketHtml, upgrade: upgradeHtml, victory: () => endHtml(true), defeat: () => endHtml(false),
};

function render() {
  document.getElementById('top').innerHTML = headerHtml();
  document.getElementById('overlay').innerHTML = overlayHtml();
  document.getElementById('app').innerHTML = S ? VIEWS[S.screen]() : titleHtml();
  if (Scene) { Scene.play(pendingFx); Scene.sync(S); }
  pendingFx = [];
  const R = S && roller();
  if (R) for (const d of R.dice) d.fresh = false;
  save();
}

function act(name, arg) {
  if (!A[name]) return;
  Sfx.unlock();
  const prev = S && S.screen;
  A[name](arg);
  render();
  if (S && S.screen !== prev) window.scrollTo(0, 0);
}
document.getElementById('root').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]');
  if (!b || b.disabled) return;
  act(b.dataset.act, b.dataset.arg);
});
if (Scene) {
  Scene.handlers.crew = (id) => act('pick', id);
  Scene.handlers.die = (i) => act('hold', i);
}

function start(saved) {
  if (saved && saved.S) S = saved.S;
  render();
}
window.claude?.hot?.snapshot?.(() => ({ S }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
</body>
</html>
