<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Caravan Dice</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=DM+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: one light column. A low-poly diorama sits on top, then the screen's controls, with a sticky action bar during dice rolls.
   Single light look on purpose: clean white page, beige icon tiles, orange accent, soft shadows. */
:root {
  --bg: #fafaf8;
  --card: #ffffff;
  --tile: #f3ede3;
  --line: #e9e4db;
  --ink: #262b29;
  --muted: #6a6f6b;
  --accent: #ef8a26;
  --accent-ink: #ffffff;
  --atk: #d4532d;
  --shd: #477b9b;
  --coin: #b9860c;
  --heal: #5f9334;
  --shadow: 0 1px 0 rgba(70, 50, 20, 0.05), 0 6px 18px rgba(70, 50, 20, 0.08);
  --font-display: 'Poppins', 'Segoe UI', system-ui, sans-serif;
  --font-body: 'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: light;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.4;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.ic { width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.num { font-variant-numeric: tabular-nums; }

.shell {
  max-width: 600px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 0;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.stack { display: flex; flex-direction: column; gap: 14px; }

/* Header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 10px 12px; flex-wrap: wrap; }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 1.55rem; line-height: 1; letter-spacing: -0.01em; display: flex; flex-direction: column; gap: 6px; }
.brand::after { content: ""; width: 34px; height: 4px; border-radius: 3px; background: var(--accent); }
.res { display: flex; gap: 6px; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 5px 11px; border-radius: 999px; background: var(--card); box-shadow: var(--shadow); font-weight: 700; font-variant-numeric: tabular-nums; }
.chip.coin .ic { color: var(--coin); }
.iconbtn { width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--card); box-shadow: var(--shadow); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; color: var(--muted); font-size: 1.05rem; }
.road { display: flex; align-items: center; gap: 8px; width: 100%; font-size: 0.8rem; color: var(--muted); }
.road b { color: var(--ink); font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.road .dots { display: flex; gap: 5px; margin-left: auto; flex: none; }
.road .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--line); }
.road .dot.done { background: var(--accent); }
.road .dot.here { background: var(--card); box-shadow: inset 0 0 0 3px var(--accent); }
.road .dot.boss { border-radius: 3px; }

/* Diorama */
.scene {
  position: relative;
  width: 100%;
  max-width: 100%;
  aspect-ratio: 16 / 10.2;
  max-height: 360px;
  margin-inline: auto;
  touch-action: manipulation;
}
.scene canvas { display: block; width: 100% !important; height: 100% !important; cursor: pointer; }
.scene .overlay { position: absolute; inset: 0; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start; padding: 2px 0; }
.scene-status { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--muted); font-weight: 700; font-size: 0.9rem; pointer-events: none; }
.ctx { background: var(--card); box-shadow: var(--shadow); border-radius: 12px; padding: 7px 11px; display: flex; flex-direction: column; gap: 4px; min-width: 140px; max-width: 70%; }
.ctx .row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.ctx b { font-family: var(--font-display); font-weight: 600; font-size: 0.92rem; line-height: 1.2; }
.ctx .hp { font-weight: 700; color: var(--atk); font-variant-numeric: tabular-nums; font-size: 0.85rem; }
.ctx .block { font-size: 0.75rem; color: var(--shd); font-weight: 700; display: flex; align-items: center; gap: 4px; }
.wchips { display: flex; flex-wrap: wrap; gap: 5px; }
.wchip { background: color-mix(in srgb, var(--card) 92%, transparent); box-shadow: var(--shadow); border-radius: 9px; padding: 4px 7px; font-size: 0.68rem; font-weight: 700; display: flex; flex-direction: column; gap: 3px; min-width: 70px; border: 1.5px solid transparent; }
.wchip.rear { border-color: color-mix(in srgb, var(--atk) 45%, transparent); }
.wchip.dead { opacity: 0.5; }
.wchip .bar { height: 4px; }
.bar { height: 7px; border-radius: 4px; background: var(--tile); overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--atk); border-radius: 4px; transition: width 400ms ease; }
.bar.fill-ok > span { background: var(--heal); }
.float {
  position: absolute; z-index: 3; pointer-events: none; white-space: nowrap;
  font-family: var(--font-display); font-weight: 700; font-size: 1.3rem; line-height: 1;
  text-shadow: 0 2px 0 #fff, 0 0 6px #fff, 0 0 2px #fff;
  transform: translate(-50%, -50%);
  animation: floatUp 1.1s ease-out forwards;
}
@keyframes floatUp {
  0% { opacity: 0; transform: translate(-50%, -20%) scale(0.6); }
  15% { opacity: 1; transform: translate(-50%, -50%) scale(1.15); }
  70% { opacity: 1; }
  100% { opacity: 0; transform: translate(-50%, -190%) scale(1); }
}

/* Shared */
.label { font-size: 0.78rem; font-weight: 700; color: var(--muted); display: flex; align-items: center; gap: 8px; justify-content: space-between; }
.label > span:first-child { display: flex; align-items: center; gap: 8px; color: var(--ink); }
.label > span:first-child::before { content: ""; width: 3px; height: 14px; border-radius: 2px; background: var(--accent); flex: none; }
.tile { background: var(--tile); border-radius: 12px; display: flex; align-items: center; justify-content: center; flex: none; }
.card { background: var(--card); box-shadow: var(--shadow); border-radius: 16px; }

/* Intent */
.intent { display: flex; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 16px; background: var(--card); box-shadow: var(--shadow); transition: box-shadow 200ms; }
.intent .tile { width: 48px; height: 48px; font-size: 1.5rem; color: var(--atk); }
.intent .txt { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.intent .eyebrow { font-size: 0.72rem; font-weight: 700; color: var(--muted); }
.intent strong { font-family: var(--font-display); font-weight: 600; font-size: 1rem; line-height: 1.25; }
.intent .detail { font-size: 0.84rem; color: var(--muted); }
.intent.cancelled { opacity: 0.55; }
.intent.cancelled strong { text-decoration: line-through; }
.intent.acting { box-shadow: 0 0 0 3px var(--atk), var(--shadow); }

/* Dice tray */
.tray { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.die {
  aspect-ratio: 1.15; width: 100%; max-width: 100%;
  border-radius: 16px; border: 0; background: var(--card);
  box-shadow: 0 4px 0 #e6dccb, 0 10px 20px rgba(70, 50, 20, 0.1);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  cursor: pointer; position: relative; padding: 4px;
}
.die .face { display: flex; align-items: center; gap: 4px; font-family: var(--font-display); font-weight: 700; font-size: clamp(1.35rem, 6.4vw, 2rem); line-height: 1; }
.die .face .ic { font-size: 0.75em; }
.die .who { font-size: 0.7rem; color: var(--muted); font-weight: 700; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.die.held { box-shadow: 0 0 0 3px var(--accent), 0 4px 0 3px #f3c08d, 0 10px 20px rgba(70, 50, 20, 0.1); }
.die .held-tag { position: absolute; top: -9px; left: 50%; transform: translateX(-50%); background: var(--accent); color: var(--accent-ink); font-size: 0.64rem; font-weight: 700; padding: 1px 8px; border-radius: 999px; }
.die:disabled { cursor: default; }
.t-atk { color: var(--atk); } .t-shd { color: var(--shd); } .t-coin { color: var(--coin); }
.t-heal { color: var(--heal); } .t-blank { color: #b9b2a6; }
.tumble { animation: tumble 420ms cubic-bezier(.3,1.4,.5,1); }
@keyframes tumble { 0% { transform: rotate(-160deg) scale(.6); opacity: 0.2; } 100% { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .tumble, .float { animation-duration: 1ms; } .bar > span { transition: none; } }

.preview { display: flex; flex-wrap: wrap; gap: 4px 12px; font-weight: 700; font-size: 0.92rem; min-height: 1.3em; }
.preview span { display: inline-flex; align-items: center; gap: 4px; }
.preview .hint { font-weight: 400; color: var(--muted); }

/* Crew (compact) */
.roster { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
@media (min-width: 560px) { .roster { grid-template-columns: repeat(4, 1fr); } }
.crew { position: relative; text-align: left; padding: 8px; border-radius: 14px; background: var(--card); box-shadow: var(--shadow); border: 2px solid transparent; display: flex; flex-direction: column; gap: 6px; cursor: pointer; min-width: 0; }
.crew .head { display: flex; gap: 7px; align-items: center; min-width: 0; }
.crew .tile { width: 30px; height: 30px; border-radius: 9px; }
.crew .tile svg { width: 21px; height: 21px; }
.crew .nm { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.crew .nm b { font-family: var(--font-display); font-weight: 600; font-size: 0.88rem; line-height: 1.15; }
.crew .role { font-size: 0.7rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.crew .badge { position: absolute; top: -8px; right: 6px; font-size: 0.62rem; font-weight: 700; padding: 1px 7px; border-radius: 999px; background: var(--accent); color: #fff; }
.crew.sel { border-color: var(--accent); }
.crew:disabled { cursor: default; }
.faces { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; }
.mini { height: 22px; border-radius: 6px; background: var(--tile); display: flex; align-items: center; justify-content: center; gap: 1px; font-size: 0.7rem; font-weight: 700; border: 0; padding: 0; }
.mini .ic { font-size: 0.76rem; }
button.mini { cursor: pointer; height: 34px; font-size: 0.85rem; }
button.mini:disabled { cursor: default; opacity: 0.4; }
button.mini:not(:disabled):hover { box-shadow: 0 0 0 2px var(--accent); }

/* Actions */
.actions {
  position: sticky; bottom: 0; z-index: 5;
  margin-left: calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
  margin-right: calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(8px);
  border-top: 1px solid var(--line);
  display: flex; gap: 8px;
}
.btn { flex: 1; min-height: 50px; border-radius: 14px; border: 0; background: var(--card); box-shadow: var(--shadow); font-family: var(--font-display); font-weight: 600; font-size: 0.98rem; cursor: pointer; padding: 6px 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.15; }
.btn small { font-family: var(--font-body); font-weight: 500; font-size: 0.74rem; color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-ink); flex: 1.4; box-shadow: 0 4px 0 #c96d14, 0 8px 16px rgba(239, 138, 38, 0.25); }
.btn.primary small { color: inherit; opacity: 0.85; }
.btn:disabled { opacity: 0.4; cursor: default; }
.btn:not(:disabled):active { transform: translateY(2px); }
.btn.solo { flex: none; }


/* Panels (map, market, camp...) */
.panel { display: flex; flex-direction: column; gap: 14px; padding-bottom: 28px; }
.panel h1 { font-family: var(--font-display); font-weight: 700; font-size: 1.65rem; margin: 0; line-height: 1.12; letter-spacing: -0.01em; text-wrap: balance; }
.panel p { margin: 0; color: var(--muted); max-width: 60ch; }
.choices { display: grid; gap: 10px; }
.choice { text-align: left; padding: 11px; border-radius: 16px; border: 2px solid transparent; background: var(--card); box-shadow: var(--shadow); cursor: pointer; display: flex; gap: 12px; align-items: center; width: 100%; }
.choice .tile { width: 46px; height: 46px; font-size: 1.35rem; }
.choice .txt { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0; }
.choice b { font-family: var(--font-display); font-weight: 600; font-size: 0.98rem; }
.choice span.d { color: var(--muted); font-size: 0.86rem; }
.choice .price { font-weight: 700; display: inline-flex; align-items: center; gap: 4px; color: var(--coin); white-space: nowrap; font-variant-numeric: tabular-nums; }
.choice:not(:disabled):hover { border-color: var(--accent); }
.choice:disabled { opacity: 0.45; cursor: default; }
.choice.done { opacity: 0.55; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat { padding: 12px; border-radius: 14px; background: var(--card); box-shadow: var(--shadow); }
.stat b { display: block; font-family: var(--font-display); font-weight: 700; font-size: 1.5rem; }
.stat span { font-size: 0.78rem; color: var(--muted); }

/* Route map */
.map { position: relative; width: 100%; max-width: 100%; aspect-ratio: 3 / 3.4; max-height: 440px; margin-inline: auto; border-radius: 20px; background: linear-gradient(#f6efe2, #efe3cc); box-shadow: var(--shadow); overflow: hidden; }
.map svg.lines { position: absolute; inset: 0; width: 100%; height: 100%; }
.node { position: absolute; transform: translate(-50%, -50%); width: 64px; border: 0; background: none; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: default; }
.node .disc { width: 50px; height: 50px; border-radius: 16px; background: var(--card); box-shadow: var(--shadow); display: flex; align-items: center; justify-content: center; font-size: 1.35rem; color: var(--muted); }
.node .nl { font-size: 0.68rem; font-weight: 700; color: var(--muted); background: color-mix(in srgb, var(--card) 85%, transparent); padding: 0 5px; border-radius: 6px; white-space: nowrap; }
.node.reach { cursor: pointer; }
.node.reach .disc { box-shadow: 0 0 0 3px var(--accent), var(--shadow); color: var(--ink); animation: pulse 1.6s ease-in-out infinite; }
.node.reach .nl { color: var(--ink); }
.node.visited .disc { background: var(--tile); box-shadow: none; color: #b5a98f; }
.node.here .disc { background: var(--accent); color: #fff; box-shadow: 0 4px 0 #c96d14; }
.node.far { opacity: 0.5; }
.node.boss .disc { width: 60px; height: 60px; border-radius: 18px; color: var(--atk); }
.node.boss.reach .disc { color: var(--atk); }
.node[data-t="ambush"] .disc { color: var(--atk); } .node[data-t="camp"] .disc { color: var(--accent); }
.node[data-t="market"] .disc { color: var(--coin); }
.node.visited .disc, .node.here .disc { color: inherit; }
@keyframes pulse { 50% { transform: translateY(-3px); } }
@media (prefers-reduced-motion: reduce) { .node.reach .disc { animation: none; } }

/* Title */
.hero h1 { font-size: 2rem; }
.hero .cta { display: flex; flex-direction: column; gap: 10px; }
.credit { font-size: 0.75rem; color: var(--muted); }
</style>
</head>
<body>
<div class="shell" id="root">
  <div id="top"></div>
  <div class="scene" id="scene">
    <div class="scene-status" id="scene-status">Unpacking the caravan…</div>
    <div class="overlay" id="overlay"></div>
  </div>
  <div class="stack" id="app"></div>
</div>
<script src="vendor/three.min.js"></script>
<script src="vendor/GLTFLoader.js"></script>
<script src="vendor/SkeletonUtils.js"></script>
<script>
'use strict';

/* =========================================================
   Icons
   ========================================================= */
const ICON_D = {
  atk: 'M19 4l-9.5 9.5M19 4h-4.5M19 4v4.5M7 13.5l3.5 3.5M5 19l3.2-3.2',
  shd: 'M12 3.5l7 2.8v5c0 4.6-3 7.8-7 9.7-4-1.9-7-5.1-7-9.7v-5z',
  coin: 'M20 12a8 8 0 1 1-16 0a8 8 0 1 1 16 0M15.5 12a3.5 3.5 0 1 1-7 0a3.5 3.5 0 1 1 7 0',
  heal: 'M12 5v14M5 12h14',
  blank: 'M7 12h10',
  bag: 'M5 8h14l-1 12H6zM9 8a3 3 0 0 1 6 0',
  fire: 'M12 3c1 4 5 5.5 5 10a5 5 0 0 1-10 0c0-2.5 1.5-4 2.5-5 .3 2 1.5 3 2.5 3-1-3 0-6 0-8z',
  crown: 'M4 18l-1-10 5 4 4-7 4 7 5-4-1 10z',
  cart: 'M3 7h14v8H3zM17 10h4M7 19a1.5 1.5 0 1 0 0.1 0M14 19a1.5 1.5 0 1 0 0.1 0',
  flag: 'M5 21V4M5 4h11l-2 4 2 4H5',
  sound: 'M4 9h4l5-4v14l-5-4H4zM16.5 9a4 4 0 0 1 0 6M19 6.5a7.5 7.5 0 0 1 0 11',
  mute: 'M4 9h4l5-4v14l-5-4H4zM17 9l5 6M22 9l-5 6',
};
const icon = (t) => `<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="${ICON_D[t]}"/></svg>`;
const FACE_NAME = { atk: 'Attack', shd: 'Block', coin: 'Coin', heal: 'Mend', blank: 'Blank' };
const FACE_COLOR = { atk: '#d4532d', shd: '#477b9b', coin: '#b9860c', heal: '#5f9334', blank: '#b9b2a6' };

function parseFace(s) {
  if (s === '-') return { t: 'blank', v: 0 };
  if (s === 'h') return { t: 'heal', v: 0 };
  return { t: { a: 'atk', s: 'shd', c: 'coin' }[s[0]], v: Number(s.slice(1)) };
}
const hasValue = (f) => f.t !== 'blank' && f.t !== 'heal';
const faceLabel = (f) => (hasValue(f) ? `${FACE_NAME[f.t]} ${f.v}` : FACE_NAME[f.t]);

/* =========================================================
   Game data
   ========================================================= */
const MEND = 3; // health restored by each Mend face

// Crew portraits use their colour. Their 3D looks (Quaternius modular outfits) are in LOOKS below.
const CREW_POOL = {
  amir: { name: 'Amir', role: 'Guard', color: '#8a7f70', faces: ['a2', 'a3', 'a4', 's2', 's3', 's3'] },
  lena: { name: 'Lena', role: 'Guard', color: '#a3794e', faces: ['a2', 'a3', 'a3', 's2', 's3', 's4'] },
  tavi: { name: 'Tavi', role: 'Scout', color: '#9c7a4e', faces: ['a2', 'a3', 's2', 's2', 'c2', 'h'] },
  oskar: { name: 'Oskar', role: 'Trader', color: '#8f3a2a', faces: ['c2', 'c3', 'c4', 'c2', 'a1', 's1'] },
  noor: { name: 'Noor', role: 'Medic', color: '#c9bba3', faces: ['h', 'h', 's3', 's2', 'a1', 'a2'] },
  zane: { name: 'Zane', role: 'Fire-eater', color: '#9a4a2c', faces: ['-', '-', 'a5', 'a6', 'a7', 'a8'] },
  ilse: { name: 'Ilse', role: 'Archer', color: '#7d6a4c', faces: ['a3', 'a3', 'a4', 'a2', 's1', 's2'] },
  bram: { name: 'Bram', role: 'Smith', color: '#6b6560', faces: ['s4', 's3', 's3', 'a3', 'c1', 'a2'] },
  rhea: { name: 'Rhea', role: 'Healer', color: '#8a9468', faces: ['h', 'h', 'h', 's2', 'a2', 'c1'] },
  dov: { name: 'Dov', role: 'Brawler', color: '#7a5a42', faces: ['a4', 'a5', 'a5', '-', 's2', 's2'] },
  sela: { name: 'Sela', role: 'Fortune-teller', color: '#6e5878', faces: ['c3', 'c3', 'a3', 's3', 'h', '-'] },
  kito: { name: 'Kito', role: 'Lookout', color: '#8c7650', faces: ['a2', 'a3', 's3', 's3', 'h', 'c1'] },
};

// 3D looks: a head, hair and outfit parts sharing one skeleton, plus skin, hair and cloth tints.
const OUTFIT = {
  knight: ['Male_Knight_Body_Armor', 'Male_Knight_Arms', 'Male_Knight_Legs_Armor', 'Male_Knight_Feet_Armor'],
  mRanger: ['Male_Ranger_Body', 'Male_Ranger_Arms', 'Male_Ranger_Legs', 'Male_Ranger_Feet_Boots'],
  fRanger: ['Female_Ranger_Body', 'Female_Ranger_Arms', 'Female_Ranger_Legs', 'Female_Ranger_Feet'],
  noble: ['Male_Noble_Body', 'Male_Noble_Arms', 'Male_Noble_Legs', 'Male_Noble_Feet'],
  mPeasant: ['Male_Peasant_Body', 'Male_Peasant_Arms', 'Male_Peasant_Legs', 'Male_Peasant_Feet'],
  fPeasant: ['Female_Peasant_Body', 'Female_Peasant_Arms', 'Female_Peasant_Legs', 'Female_Peasant_Feet'],
};
const MH = 'Regular_Male_OnlyHead', FH = 'Regular_Female_OnlyHead';
const LOOKS = {

const START_CREW = ['amir', 'lena', 'tavi', 'oskar', 'noor', 'zane'];

const MAX_WAGONS = 4;

  supply: { name: 'Supply Cart', hp: 20, perk: 'Carries the supplies. No perk.', model: 'cart', props: 'barrels' },

const ENEMY_TYPES = {

  warden: { name: 'The Gate Warden', boss: true, hp: 75, loot: 0, pattern: [{ k: 'guard', v: 9, dmg: 6 }, { k: 'atk', v: 14 }, { k: 'atk', v: 11 }, { k: 'atk', v: 18 }, { k: 'atk', v: 8 }] },

const LEGS = [
  { name: 'The Salt Flats', normals: ['bandits', 'skeletons'], boss: 'king' },
  { name: 'The Shifting Sea', normals: ['wraith', 'siege'], boss: 'storm' },
  { name: 'The Brass Road', normals: ['sentinel', 'legion'], boss: 'warden' },
];

const NODE_INFO = {
  ambush: { label: 'Fight', icon: 'atk' },
  camp: { label: 'Camp', icon: 'fire' },
  market: { label: 'Market', icon: 'bag' },
  boss: { label: 'Boss', icon: 'crown' },
};

const DICE_PER_TURN = 4;
const REROLLS = 2;
const CAMP_HEAL = 10;
const PRICES = { hire: 9, wagon: 12, repair: 4 };
const REPAIR = 8;

/* =========================================================
   State, saving, helpers
   ========================================================= */
const SAVE_KEY = 'caravan-dice-save-v3';
let S = null;
let pendingFx = [];
const rand = (n) => Math.floor(Math.random() * n);
const pick = (arr) => arr[rand(arr.length)];
const shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = rand(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const crewById = (id) => S.crew.find((c) => c.id === id);
const has = (type) => S.wagons.some((w) => w.type === type);
const maxHp = () => S.wagons.reduce((s, w) => s + WAGON_TYPES[w.type].hp, 0);
const heal = (n) => { const before = S.hp; S.hp = Math.min(maxHp(), S.hp + n); return S.hp - before; };
function log(msg) { S.log.unshift(msg); S.log.length = Math.min(S.log.length, 20); }
function fx(e) { pendingFx.push(e); }

function save() {
  if (!S) return;
  try {
    if (!['victory', 'defeat'].includes(S.screen)) localStorage.setItem(SAVE_KEY, JSON.stringify(S));
    else localStorage.removeItem(SAVE_KEY);
  } catch (err) { /* storage unavailable: the run still works, it just won't resume */ }
}
function loadSave() {
  try { const s = localStorage.getItem(SAVE_KEY); return s ? JSON.parse(s) : null; } catch (err) { return null; }
}

// Delayed steps (the enemy's turn, the end of a fight). Ignored if a new run started meanwhile.
function later(ms, fn) {
  const run = S && S.runId;
  setTimeout(() => { if (S && S.runId === run) { fn(); render(); } }, ms);
}

function mkCrew(id) {
  const d = CREW_POOL[id];
  return { id, name: d.name, role: d.role, color: d.color, faces: d.faces.map(parseFace) };
}

function genLeg() {
  const weights = (row) => (row === 0 ? [['ambush', 70], ['camp', 30]] : [['ambush', 50], ['market', 25], ['camp', 25]]);
  const roll = (row) => { const w = weights(row); let r = Math.random() * 100; for (const [t, n] of w) { if ((r -= n) < 0) return t; } return 'ambush'; };
  const rows = [];
  for (let r = 0; r < 3; r++) {
    const lanes = [1];
    if (Math.random() < 0.7) lanes.unshift(0);
    if (Math.random() < 0.7) lanes.push(2);
    if (lanes.length === 1) { lanes.push(Math.random() < 0.5 ? 0 : 2); lanes.sort(); }
    rows.push(lanes.map((lane) => ({ lane, type: roll(r) })));
  }
  if (!rows.flat().some((n) => n.type === 'market')) pick(rows[1 + rand(2)]).type = 'market';
  if (!rows[0].some((n) => n.type === 'ambush')) rows[0][0].type = 'ambush';
  return { rows };
}

function newRun() {
  S = {
    runId: Math.random(),
    crew: START_CREW.map(mkCrew),
    wagons: [{ type: 'supply' }, { type: 'armory' }],
    hp: 0, coin: 4, leg: 0, pos: { row: -1, lane: 1 },
    map: LEGS.map(() => genLeg()), visited: [],
    screen: 'map', log: [], fight: null, market: null, upgrade: null, lastSel: null,
    upgradeCost: 5,
    stats: { dmg: 0, turns: 0, coinEarned: 0, fights: 0 },
  };
  S.hp = maxHp();
  log(`The caravan sets out across ${LEGS[0].name}.`);
}

/* =========================================================
   Route map
   ========================================================= */
function reachable() {
  const leg = S.map[S.leg], p = S.pos;
  if (p.row >= 3) return [];
  if (p.row === 2) return [{ key: 'boss', row: 3, lane: 1, type: 'boss' }];
  return leg.rows[p.row + 1].filter((n) => Math.abs(n.lane - p.lane) <= 1)
    .map((n) => ({ key: `${p.row + 1}-${n.lane}`, row: p.row + 1, lane: n.lane, type: n.type }));
}

function enterNode(type) {
  const leg = LEGS[S.leg];
  if (type === 'ambush') startFight(pick(leg.normals));
  else if (type === 'boss') startFight(leg.boss);
  else if (type === 'market') { S.market = genMarket(); S.screen = 'market'; }
  else if (type === 'camp') {
    const got = heal(CAMP_HEAL);
    log(`Rested at camp: +${got} health.`);
    fx({ k: 'gain', text: `+${got} health`, cls: 't-heal', sfx: 'block' });
  }
}

function nextLeg() {
  S.leg++;
  S.pos = { row: -1, lane: 1 };
  S.screen = 'map';
  log(`On to ${LEGS[S.leg].name}.`);
}

/* =========================================================
   Fights
   ========================================================= */
const rollFace = (id) => ({ ...pick(crewById(id).faces) });
function defaultSel() {
  const ids = S.crew.map((c) => c.id);
  const sel = (S.lastSel || []).filter((id) => ids.includes(id));
  for (const id of ids) if (sel.length < DICE_PER_TURN && !sel.includes(id)) sel.push(id);
  return sel.slice(0, DICE_PER_TURN);
}

function totals(f) {
  const t = { atk: 0, shd: 0, coin: 0, heal: 0, bell: 0 };
  const counts = {};
  for (const d of f.dice) {
    const c = crewById(d.crew);
    if (d.face.t === 'atk') t.atk += d.face.v + (has('armory') && c.role === 'Guard' ? 1 : 0);
    else if (d.face.t === 'shd') t.shd += d.face.v;
    else if (d.face.t === 'coin') t.coin += d.face.v + (has('spice') ? 1 : 0);
    else if (d.face.t === 'heal') t.heal += MEND;
    if (hasValue(d.face)) { const k = d.face.t + d.face.v; counts[k] = (counts[k] || 0) + 1; }
  }
  if (has('bell')) { for (const k in counts) t.bell += Math.floor(counts[k] / 2) * 3; t.atk += t.bell; }
  if (has('bulwark')) t.shd += 2;
  return t;
}

function startFight(kind) {
  const e = ENEMY_TYPES[kind];
  S.fight = {
    id: Math.random(), kind,
    enemy: { name: e.name, hp: e.hp, max: e.hp, block: 0, step: 0 },
    intent: null, selected: defaultSel(), dice: [], rerolls: 0, phase: 'pick', turn: 1, shield: 0,
  };
  S.screen = 'fight';
  S.stats.fights++;
  nextIntent();
}

function nextIntent() {
  const f = S.fight, e = f.enemy, pattern = ENEMY_TYPES[f.kind].pattern;
  const base = pattern[e.step % pattern.length];
  const bump = Math.floor(e.step / pattern.length); // a little meaner each time the pattern repeats
  e.step++;
  f.intent = { k: base.k, v: base.v + bump, dmg: (base.dmg || 0) + bump };
  e.block = f.intent.k === 'guard' ? f.intent.v : 0;
}

function intentText(it) {
  return it.k === 'guard'
    ? { icon: 'shd', title: `Brace, then attack for ${it.dmg}`, detail: `Absorbs ${it.v} of your damage this turn.` }
    : { icon: 'atk', title: `Attack for ${it.v}`, detail: 'Your block reduces it.' };
}

function playerPhase() {
  const f = S.fight, e = f.enemy;
  const t = totals(f);
  const dealt = Math.max(0, t.atk - e.block);
  e.hp = Math.max(0, e.hp - dealt);
  S.stats.dmg += dealt; S.stats.turns++;
  S.coin += t.coin; S.stats.coinEarned += t.coin;
  f.shield = t.shd;
  const healed = t.heal ? heal(t.heal) : 0;
  if (t.atk) fx({ k: 'pshot', ids: f.dice.filter((d) => d.face.t === 'atk').map((d) => d.crew), dmg: dealt, absorbed: Math.min(e.block, t.atk) });
  if (t.coin) fx({ k: 'gain', text: `+${t.coin} coin`, cls: 't-coin', sfx: 'coin' });
  if (healed) fx({ k: 'gain', text: `+${healed} health`, cls: 't-heal', delay: 250 });
  if (e.hp <= 0) { f.phase = 'done'; fx({ k: 'edown' }); later(1700, winFight); return; }
  f.phase = 'enemy';
  later(1150, enemyPhase);
}

function enemyPhase() {
  const f = S.fight, it = f.intent;
  const dmg = it.k === 'guard' ? it.dmg : it.v;
  const taken = Math.max(0, dmg - f.shield);
  S.hp = Math.max(0, S.hp - taken);
  fx({ k: 'eshot', to: 'wagon', id: S.wagons[S.wagons.length - 1].type, dmg: taken, blocked: taken === 0 });
  if (S.hp <= 0) { f.phase = 'done'; later(1300, lose); return; }
  f.dice = [];
  f.phase = 'pick';
  f.turn++;
  nextIntent();
}

function winFight() {
  const f = S.fight, e = ENEMY_TYPES[f.kind];
  S.lastSel = f.selected.slice();
  S.coin += e.loot; S.stats.coinEarned += e.loot;
  let note = `Beat ${e.name}.${e.loot ? ` +${e.loot} coin.` : ''}`;
  if (has('cook')) { const got = heal(4); if (got) note += ` Cook Wagon: +${got} health.`; }
  log(note);
  Sfx.play('win');
  if (f.kind === LEGS[LEGS.length - 1].boss) { S.screen = 'victory'; return; }
  if (e.boss) { S.hp = maxHp(); S.screen = 'camp'; return; }
  S.screen = 'map';
}
function lose() { S.screen = 'defeat'; log(`The caravan fell to ${S.fight.enemy.name}.`); Sfx.play('lose'); }

/* =========================================================
   Market and training
   ========================================================= */
function genMarket() {
  const hires = shuffle(Object.keys(CREW_POOL).filter((id) => !S.crew.some((c) => c.id === id))).slice(0, 2);
  const wagons = Object.keys(WAGON_TYPES).filter((t) => !has(t));
  return { hires, wagon: wagons.length ? pick(wagons) : null, bought: [] };
}
function upgradeFace(c, i) {
  const f = c.faces[i];
  const before = faceLabel(f);
  if (f.t === 'blank') { f.t = 'atk'; f.v = 3; } else f.v += 2;
  log(`${c.name}: ${before} became ${faceLabel(f)}.`);
}

/* =========================================================
   Player actions
   ========================================================= */
const A = {
  newRun() { newRun(); },
  resume() { const s = loadSave(); if (s) { S = s; resumePending(); } },
  mute() { Sfx.toggle(); },

  go(key) {
    if (S.screen !== 'map') return;
    const n = reachable().find((x) => x.key === key);
    if (!n) return;
    S.pos = { row: n.row, lane: n.lane };
    S.visited.push(`${S.leg}-${n.row}-${n.lane}`);
    Sfx.play('click');
    enterNode(n.type);
  },

  pick(id) {
    const f = S.fight;
    if (!f || f.phase !== 'pick' || !crewById(id)) return;
    const i = f.selected.indexOf(id);
    if (i >= 0) f.selected.splice(i, 1);
    else if (f.selected.length < DICE_PER_TURN) f.selected.push(id);
    else { f.selected.shift(); f.selected.push(id); }
    Sfx.play('click');
  },
  roll() {
    const f = S.fight;
    if (!f || f.phase !== 'pick' || !f.selected.length) return;
    f.dice = f.selected.map((id) => ({ crew: id, face: rollFace(id), held: false, fresh: true }));
    f.rerolls = REROLLS;
    f.phase = 'roll';
    Sfx.play('roll');
  },
  hold(i) {
    const f = S.fight;
    const d = f && f.phase === 'roll' && f.dice[+i];
    if (d) { d.held = !d.held; Sfx.play('click'); }
  },
  reroll() {
    const f = S.fight;
    if (!f || f.phase !== 'roll' || f.rerolls < 1) return;
    const free = f.dice.filter((d) => !d.held);
    if (!free.length) return;
    f.rerolls--;
    for (const d of free) { d.face = rollFace(d.crew); d.fresh = true; }
    Sfx.play('roll');
  },
  end() { if (S.screen === 'fight' && S.fight.phase === 'roll') playerPhase(); },

  camp(kind) {
    if (kind === 'recruit') {
      const pool = Object.keys(CREW_POOL).filter((id) => !S.crew.some((c) => c.id === id));
      if (!pool.length || S.crew.length >= MAX_CREW) return;
      const c = mkCrew(pick(pool)); S.crew.push(c); log(`${c.name} the ${c.role} joined the caravan.`);
    }
    if (kind === 'train') { S.upgrade = { free: true, crew: null }; S.screen = 'upgrade'; return; }
    nextLeg();
  },

  buy(key) {
    const m = S.market;
    if (S.screen !== 'market' || m.bought.includes(key)) return;
    const [kind, arg] = key.split(':');
    const cost = kind === 'upgrade' ? S.upgradeCost : PRICES[kind];
    if (S.coin < cost) return;
    if (kind === 'hire') {
      if (S.crew.length >= MAX_CREW) return;
      const c = mkCrew(arg); S.crew.push(c); log(`Hired ${c.name} the ${c.role}.`);
    } else if (kind === 'wagon') {
      if (S.wagons.length >= MAX_WAGONS) return;
      S.wagons.push({ type: arg }); S.hp += WAGON_TYPES[arg].hp; log(`Bought a ${WAGON_TYPES[arg].name}.`);
    } else if (kind === 'repair') {
      if (S.hp >= maxHp()) return;
      log(`Repairs: +${heal(REPAIR)} health.`);
    } else if (kind === 'upgrade') { S.upgrade = { free: false, crew: null }; S.screen = 'upgrade'; Sfx.play('click'); return; }
    S.coin -= cost;
    if (kind === 'hire' || kind === 'wagon') m.bought.push(key);
    Sfx.play('coin');
  },
  leave() { S.screen = 'map'; },
  upCrew(id) { if (S.upgrade) S.upgrade.crew = id; Sfx.play('click'); },
  upFace(i) {
    const u = S.upgrade, c = u && crewById(u.crew);
    if (!c || c.faces[+i].t === 'heal') return;
    if (!u.free) { if (S.coin < S.upgradeCost) return; S.coin -= S.upgradeCost; S.upgradeCost += 2; }
    upgradeFace(c, +i);
    Sfx.play('coin');
    S.upgrade = null;
    if (u.free) nextLeg(); else S.screen = 'market';
  },
  upBack() {
    const u = S.upgrade;
    if (u.crew) { u.crew = null; return; }
    S.upgrade = null;
    S.screen = u.free ? 'camp' : 'market';
  },
};

// A save made in the middle of an enemy turn picks up where it stopped.
function resumePending() {
  if (S.screen !== 'fight') return;
  const f = S.fight;
  if (f.phase === 'enemy') enemyPhase();
  else if (f.phase === 'done') { if (f.enemy.hp <= 0) winFight(); else lose(); }
}
/* =========================================================
   Sound (synthesised with Web Audio, starts after the first tap)
   ========================================================= */
const Sfx = (() => {
  let ctx = null;
  let muted = false;
  try { muted = localStorage.getItem('caravan-mute') === '1'; } catch (err) { /* ignore */ }
  function ac() {
    if (!ctx) { const C = window.AudioContext || window.webkitAudioContext; if (!C) return null; try { ctx = new C(); } catch (err) { return null; } }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  function tone(freq, dur, type, vol, when = 0, slide = 0) {
    const c = ac(); if (!c) return;
    const t = c.currentTime + when;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq * slide), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g).connect(c.destination); o.start(t); o.stop(t + dur + 0.02);
  }
  function noise(dur, vol, when = 0, freq = 1800) {
    const c = ac(); if (!c) return;
    const t = c.currentTime + when;
    const len = Math.max(1, Math.floor(c.sampleRate * dur));
    const buf = c.createBuffer(1, len, c.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const s = c.createBufferSource(); s.buffer = buf;
    const f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = 1.2;
    const g = c.createGain(); g.gain.value = vol;
    s.connect(f).connect(g).connect(c.destination); s.start(t);
  }
  const P = {

/* =========================================================

const Scene = (() => {

  const basic = (c, extra = {}) => new T.MeshBasicMaterial({ color: new T.Color(c).convertSRGBToLinear(), ...extra });

  }
  let seed = 11;
  const sr = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const C = {
    sand: '#dcb478', sandDark: '#c99c5c', road: '#e8cf9c', dirt: '#b98457', rock: '#8e6748',
    stone: '#a59d92', woodDark: '#6e4a2b', orange: '#ef8a26', water: '#5d9dbb', leafDark: '#557d2c',
    brass: '#c9953a', brassDark: '#9d7128', ember: '#ff9d3b',
  };

  /* Island base (procedural) */
  function slab(rx, rz, depth, top, side, y, jitter) {
    const pts = [];
    for (let i = 0; i < 18; i++) {
      const a = (i / 18) * PI * 2, r = 1 + (sr() - 0.5) * jitter;
      pts.push(new T.Vector2(Math.cos(a) * rx * r, Math.sin(a) * rz * r));
    }
    const m = mesh(new T.ExtrudeGeometry(new T.Shape(pts), { depth, bevelEnabled: false }), [top, side], { receive: true });
    m.rotation.x = -PI / 2;
    m.position.y = y - depth;

  }
  W.add(slab(8.6, 5.3, 1.1, C.sand, C.dirt, 0, 0.12));
  W.add(slab(8.0, 4.8, 0.9, C.rock, C.rock, -1.1, 0.16));
  const road = mesh(new T.BoxGeometry(15.6, 0.04, 1.6), C.road, { cast: false, receive: true });
  road.position.set(0, 0.02, 0.5);
  W.add(road);
  const pond = mesh(new T.CylinderGeometry(1.5, 1.5, 0.08, 9), C.water, { cast: false, receive: true });
  pond.scale.z = 0.7; pond.position.set(-1.4, 0.03, -3.0); W.add(pond);
  const shore = mesh(new T.CylinderGeometry(1.75, 1.75, 0.05, 9), C.road, { cast: false, receive: true });
  shore.scale.z = 0.72; shore.position.set(-1.4, 0.01, -3.0); W.add(shore);
  for (let i = 0; i < 5; i++) { const reed = mesh(new T.ConeGeometry(0.05, 0.6, 4), C.leafDark); reed.position.set(-0.3 + sr() * 0.4, 0.3, -2.4 - sr() * 0.5); W.add(reed); }
  function dune(x, z, s) {

    m.scale.set(1.6 * s, 0.5 * s, 1.1 * s); m.rotation.y = sr() * PI; m.position.set(x, 0, z); W.add(m);
  }
  dune(3.2, -3.1, 1.1); dune(6.0, -1.6, 0.8); dune(-6.2, -1.8, 0.9); dune(1.4, 3.6, 0.6);

  /* Model loading */
  const MODEL_FILES = [
    'town/cart', 'town/cart-high', 'town/stall-red', 'town/lantern', 'town/banner-red',
    'pirate/ship-small', 'pirate/palm-bend', 'pirate/palm-straight', 'pirate/barrel', 'pirate/crate', 'pirate/chest', 'pirate/rocks-sand-a', 'pirate/rocks-sand-b',
    'survival/tent', 'survival/campfire', 'survival/signpost',
    'nature/cactus-tall', 'nature/cactus-short', 'nature/statue-head', 'nature/stone-tall',

  const PEOPLE_PARTS = [...new Set(Object.values(LOOKS).flatMap((l) => l.parts)), 'animations'];
  const M = {};
  let loaded = false;
  const MODEL_EXT = 'glb'; // the published copy uses JSON glTF files instead
  const loader = new T.GLTFLoader();
  let done = 0;
  const total = MODEL_FILES.length + PEOPLE_PARTS.length;
  const tick = () => { done++; status.textContent = `Unpacking the caravan… ${Math.round((100 * done) / total)}%`; };
  const loads = MODEL_FILES.map((file) => new Promise((res) => {

  }
  function prop(name, { h, s, ry = 0 } = {}) {

  }

  /* Animated characters */
  const mixers = new Set();
  function charObj(model, s, tint) {

  const PEOPLE_ANIMS = { idle: 'Idle_Loop', walk: 'Walk_Loop', 'attack-melee-right': 'Sword_Attack', die: 'Death01', sit: 'Sitting_Idle_Loop', 'emote-yes': 'Dance_Loop' };
  function personObj(look, s) {

    const g = e.inner;
    const addChar = (model, s, x, z, tint, ry = -PI / 4) => {
      const h = charObj(model, s, tint); h.obj.position.set(x, 0, z); h.obj.rotation.y = ry; g.add(h.obj); e.chars.push(h); return h;
    };
    const addPerson = (look, s, x, z, ry = -PI / 4) => {
      const h = personObj(LOOKS[look], s); h.obj.position.set(x, 0, z); h.obj.rotation.y = ry; g.add(h.obj); e.chars.push(h); return h;
    };
    const add = (o, x, z, y = 0) => { o.position.set(x, y, z); g.add(o); return o; };
    if (kind === 'bandits' || kind === 'king') {
      const big = kind === 'king';
      add(prop('ship-small', { h: big ? 3.6 : 2.8, ry: PI }), 1.1, -0.4);
      addPerson(big ? 'king' : 'banditA', big ? 1.05 : 0.8, -0.7, 0.3);
      addPerson('banditB', 0.78, -0.3, -0.9);
      if (big) { addPerson('banditA', 0.8, -0.2, 1.2); add(prop('banner-red', { s: 2, ry: PI / 2 }), -1.2, -0.4); }
    } else if (kind === 'skeletons' || kind === 'legion') {
      const spots = kind === 'legion' ? [[-0.6, 0.4], [0.1, -0.6], [0.3, 1.0], [0.9, 0.1], [1.2, -1.1]] : [[-0.5, 0.4], [0.2, -0.6], [0.5, 1.0]];
      spots.forEach(([x, z]) => addChar('skeleton', kind === 'legion' ? 1.8 : 1.7, x, z));
      if (kind === 'legion') add(prop('pillar', { h: 1.6 }), 1.6, 0.9);
    } else if (kind === 'wraith' || kind === 'storm') {
      const big = kind === 'storm';
      addChar('ghost', big ? 4.4 : 2.9, 0, 0, '#ecd3a2');
      if (big) { addChar('ghost', 1.7, -0.4, 1.4, '#e3c48f'); addChar('ghost', 1.7, 0.4, -1.4, '#e3c48f'); }
      orbitRocks(e, big ? 9 : 6, big ? 2.1 : 1.5, big ? 1.8 : 1.2);
      const swirl = mesh(new T.CylinderGeometry(big ? 2 : 1.4, big ? 2.2 : 1.6, 0.08, 10), C.sandDark, { cast: false });
      swirl.position.y = 0.04; g.add(swirl);
    } else if (kind === 'siege') {
      add(prop('siege-tower', { h: 3.6, ry: PI / 2 }), 0.6, 0);
      addPerson('banditA', 0.8, -0.9, 0.9);
      addPerson('banditB', 0.78, -0.9, -0.9);
    } else if (kind === 'sentinel') {
      colossus(g, 0.75);
    } else if (kind === 'warden') {
      add(prop('tower', { s: 1.5 }), 1.6, -1.6);
      add(prop('tower', { s: 1.5 }), 1.6, 1.6);
      add(prop('gate', { s: 2.4, ry: 0 }), 1.6, 0);
      colossus(g, 1);
    }
    setT(e, { x: 3.7, z: 0.2 });
    return e;
  }

  /* 3D dice */
  const diceGroup = new T.Group(); W.add(diceGroup);
  const dieGeo = new T.BoxGeometry(0.68, 0.68, 0.68);
  const faceMats = {};
  function faceMat(f) {
    const key = f.t + f.v;
    if (faceMats[key]) return faceMats[key];
    const cv = document.createElement('canvas'); cv.width = cv.height = 128;
    const x = cv.getContext('2d');
    x.fillStyle = '#fffcf6'; x.fillRect(0, 0, 128, 128);
    x.strokeStyle = '#ead9bf'; x.lineWidth = 10; x.strokeRect(5, 5, 118, 118);
    const col = FACE_COLOR[f.t];
    x.strokeStyle = col; x.lineCap = 'round'; x.lineJoin = 'round';
    x.save();
    if (hasValue(f)) { x.translate(64 - 22, 12); x.scale(44 / 24, 44 / 24); } else { x.translate(64 - 36, 28); x.scale(72 / 24, 72 / 24); }
    x.lineWidth = 2.6; x.stroke(new Path2D(ICON_D[f.t]));
    x.restore();
    if (hasValue(f)) { x.fillStyle = col; x.font = '700 56px Poppins, "Segoe UI", sans-serif'; x.textAlign = 'center'; x.fillText(String(f.v), 64, 114); }
    const tex = new T.CanvasTexture(cv);
    tex.encoding = T.sRGBEncoding; tex.anisotropy = 4;
    return (faceMats[key] = new T.MeshStandardMaterial({ map: tex, roughness: 0.7 }));
  }
  const dieMeshes = [];
  function makeDie() {
    const m = new T.Mesh(dieGeo, Array(6).fill(faceMat({ t: 'blank', v: 0 })));
    m.castShadow = true;
    const r = ring(); r.scale.setScalar(1.1); r.position.y = -0.31; m.add(r); m.userData.ring = r;
    diceGroup.add(m); hitTargets.push(m);
    return m;
  }
  function setDieFaces(m, d, crew) {
    const others = crew ? crew.faces.slice() : [];
    const idx = others.findIndex((f) => f.t === d.face.t && f.v === d.face.v);
    if (idx >= 0) others.splice(idx, 1);
    while (others.length < 5) others.push({ t: 'blank', v: 0 });
    const o = others.map(faceMat);
    m.material = [o[0], o[1], faceMat(d.face), o[2], o[3], o[4]];
  }
  const dieHome = (i) => new T.Vector3(-0.6 + i * 0.95, 0.34, 1.95);
  function animateRoll(m, home, i) {
    const start = home.clone().add(new T.Vector3(-1.6 + sr() * 0.4, 2.4, 0.8));
    const spin = new T.Vector3((sr() - 0.5) * 14, (sr() - 0.5) * 10, (sr() - 0.5) * 14);
    const finalY = (sr() - 0.5) * 0.4;
    m.position.copy(start);
    tween(reduced ? 1 : 720, (p) => {
      const e = 1 - Math.pow(1 - p, 3);
      m.position.x = start.x + (home.x - start.x) * e;
      m.position.z = start.z + (home.z - start.z) * e;
      m.position.y = home.y + (start.y - home.y) * (1 - e) * Math.abs(Math.cos(e * PI * 1.5));
      m.rotation.set(spin.x * (1 - e), finalY + spin.y * (1 - e), spin.z * (1 - e));
    }, () => { m.position.copy(home); m.rotation.set(0, finalY, 0); if (i === 0) Sfx.play('land'); }, i * 70);
  }
  function syncDice(R) {
    const scr = S ? S.screen : '';
    const show = R && R.phase !== 'pick' && R.dice.length && scr === 'fight';
    diceGroup.visible = !!show;
    dieMeshes.forEach((m) => { m.visible = false; m.userData.pick = null; });
    if (!show) return;
    R.dice.forEach((d, i) => {
      const m = dieMeshes[i] || (dieMeshes[i] = makeDie());
      m.visible = true;
      m.userData.pick = R.phase === 'roll' ? { die: i } : null;
      const key = `${d.crew}:${d.face.t}${d.face.v}`;
      const home = dieHome(i);
      if (d.fresh || m.userData.key !== key) {
        setDieFaces(m, d, S.crew.find((c) => c.id === d.crew));
        m.userData.key = key;
        if (d.fresh) animateRoll(m, home, i); else { m.position.copy(home); m.rotation.set(0, 0.1, 0); }
      }
      m.userData.ring.visible = d.held;
    });
  }

  /* Tweens and effects */
  const tweens = [];
  function tween(dur, fn, doneFn, delay = 0) { tweens.push({ t0: performance.now() + delay, dur, fn, done: doneFn }); }
  function bump(obj, delay = 0) { tween(320, (p) => obj.scale.setScalar(1 + Math.sin(p * PI) * 0.14), () => obj.scale.setScalar(1), delay); }
  function shake(obj, delay = 0) { tween(440, (p) => { obj.rotation.z = Math.sin(p * PI * 6) * 0.12 * (1 - p); }, () => { obj.rotation.z = 0; }, delay); }
  function burst(p, color, delay = 0) {
    const m = new T.Mesh(new T.IcosahedronGeometry(0.6, 1), basic(color, { transparent: true, opacity: 0.5 }));
    m.position.copy(p); m.visible = false; W.add(m);
    tween(380, (q) => { m.visible = true; m.scale.setScalar(0.4 + q * 1.2); m.material.opacity = 0.5 * (1 - q); }, () => { W.remove(m); m.geometry.dispose(); m.material.dispose(); }, delay);
  }
  function shot(from, to, color, delay, onHit) {
    const m = new T.Mesh(new T.OctahedronGeometry(0.18, 0), basic(color));
    m.visible = false; W.add(m);
    tween(460, (p) => {
      m.visible = true;
      m.position.lerpVectors(from, to, p);
      m.position.y += Math.sin(p * PI) * 1.8;
      m.rotation.x += 0.25; m.rotation.y += 0.2;
    }, () => { W.remove(m); m.geometry.dispose(); m.material.dispose(); if (onHit) onHit(); }, delay);
  }
  function floatAt(localPos, text, cls, delay = 0) {
    setTimeout(() => {
      const v = W.localToWorld(localPos.clone()).project(cam);
      const el = document.createElement('div');
      el.className = `float ${cls || ''}`;
      el.textContent = text;
      el.style.left = `${((v.x + 1) / 2) * 100}%`;
      el.style.top = `${((1 - v.y) / 2) * 100}%`;
      host.appendChild(el);
      el.addEventListener('animationend', () => el.remove());
      setTimeout(() => el.remove(), 2000);
    }, delay);
  }
  const front = () => { const w = S && S.wagons[0]; return w && wagonEnt[w.type]; };

  function play(list) {
    if (!loaded) return;
    let t = 0;
    const now = performance.now();
    for (const f of list) {
      if (f.k === 'pshot' && enemy) {
        f.ids.forEach((id, i) => {
          const c = crewEnt[id]; if (!c) return;
          const d = i * 120;
          oneShot(c, 'attack-melee-right', d);
          shot(pos(c, 0.9), pos(enemy, 1.3), '#ef8a26', d + 150, () => { bump(enemy.inner); burst(pos(enemy, 1.3), '#ef8a26'); });
        });
        const land = (f.ids.length - 1) * 120 + 610;
        setTimeout(() => Sfx.play('hit'), land);
        floatAt(pos(enemy, 2.6), f.dmg > 0 ? `−${f.dmg}` : '0', 't-atk', land);
        if (f.absorbed) floatAt(pos(enemy, 1.7), `${f.absorbed} absorbed`, 't-shd small', land + 150);
        t = land + 150;
      }
      if (f.k === 'gain') {
        const fr = front();
        if (fr) floatAt(pos(fr, 1.8), f.text, f.cls, (f.delay || 0) + t);
        if (f.sfx) setTimeout(() => Sfx.play(f.sfx), (f.delay || 0) + t);
      }
      if (f.k === 'eshot') {
        const target = wagonEnt[f.id];
        if (!target) continue;
        const tp = pos(target, 1.0);
        const d = t;
        const onHit = () => {
          if (f.blocked) { burst(tp, '#6fa8d0'); floatAt(pos(target, 1.9), 'Blocked', 't-shd'); Sfx.play('block'); }
          else {
            shake(target.inner); burst(tp, '#d4532d');
            floatAt(pos(target, 1.9), `−${f.dmg}`, 't-atk');
            Sfx.play('hurt');
          }
        };
        if (!enemy) { onHit(); continue; }
        target.lock = now + d + 640;
        tween(300, (p) => { enemy.inner.position.x = -Math.sin(p * PI) * 0.5; }, () => { enemy.inner.position.x = 0; }, d);
        enemy.chars.forEach((h, i) => oneShot(h, 'attack-melee-right', d + i * 60));
        shot(pos(enemy, 1.6), tp, f.blocked ? '#2f8ea6' : '#8f3328', d + 120, onHit);
        t += 320;
      }
      if (f.k === 'edown' && enemy) {
        const e = enemy;
        e.dying = true;
        setTimeout(() => e.chars.forEach((h) => { h.ch.base = 'die'; setAnim(h, 'die', true); }), t + 300);
        tween(900, (p) => { e.inner.position.y = -p * 1.6; e.inner.rotation.z = p * 0.5; },
          () => { e.outer.visible = false; e.dying = false; }, t + 900);
      }
    }
  }

  /* Sync scene to game state */
  let lastS = null;
  function sync(state) {
    lastS = state;
    if (!loaded) return;
    const scr = state ? state.screen : 'title';
    const f = state && state.fight;

    groups.camp.visible = scr === 'camp' || scr === 'victory';
    groups.market.visible = scr === 'market' || (scr === 'upgrade' && state.upgrade && !state.upgrade.free);
    groups.ruins.visible = scr === 'fight' && f && (f.kind === 'skeletons' || f.kind === 'legion');

    if (f && scr === 'fight' && f.id !== enemyFightId) {
      if (enemy) removeEntity(enemy);
      enemy = buildEnemy(f.kind);
      enemyFightId = f.id;
    }
    if (enemy && !enemy.dying) enemy.outer.visible = scr === 'fight' && f && f.id === enemyFightId && f.enemy.hp > 0;

    const wagons = state ? state.wagons : [{ type: 'supply' }, { type: 'armory' }];
    for (const type of Object.keys(wagonEnt)) if (!wagons.some((w) => w.type === type)) { removeEntity(wagonEnt[type]); delete wagonEnt[type]; }
    wagons.forEach((w, i) => {
      const e = wagonEnt[w.type] || (wagonEnt[w.type] = buildWagon(w.type));
      setT(e, { x: -1.5 - i * 2.15, z: 0.5 });
    });

    const crew = state ? state.crew : START_CREW.map((id) => ({ id }));
    for (const id of Object.keys(crewEnt)) if (!crew.some((c) => c.id === id)) {
      const e = crewEnt[id]; hitTargets.splice(hitTargets.indexOf(e.hit), 1); removeEntity(e); delete crewEnt[id];
    }
    const R = state && scr === 'fight' ? f : null;
    const forward = R ? (R.phase === 'pick' ? R.selected : R.dice.map((d) => d.crew)) : [];
    const n = crew.length;
    crew.forEach((c, i) => {
      const e = crewEnt[c.id] || (crewEnt[c.id] = buildCrew(c));
      let x = -7.0 + i * 0.8, z = 2.35, ry = PI / 4, base = 'idle';
      if (scr === 'camp' || scr === 'victory') {
        const st = campSeat(i, scr === 'victory' ? 1.75 : 1.85);
        x = st.x; z = st.z;
        ry = Math.atan2(2.6 - x, 1.0 - z);
        base = scr === 'victory' ? 'emote-yes' : 'sit';
      } else if (scr === 'map') base = 'walk';
      else if (scr === 'defeat') base = 'die';
      else if (forward.includes(c.id)) z += 0.55;
      setT(e, { x, z, ry });
      e.wantBase = base;
      const sel = R && R.phase === 'pick' && R.selected.includes(c.id);
      e.ring.visible = !!sel;
      e.hit.userData.pick = R && R.phase === 'pick' ? { crew: c.id } : null;
    });
    syncDice(R);
  }

  /* Tapping figures and dice */
  const ray = new T.Raycaster();
  let down = null;
  const handlers = { crew: null, die: null };
  renderer.domElement.addEventListener('pointerdown', (ev) => { down = { x: ev.clientX, y: ev.clientY }; });
  renderer.domElement.addEventListener('pointerup', (ev) => {
    if (!down || Math.hypot(ev.clientX - down.x, ev.clientY - down.y) > 10) return;
    const r = renderer.domElement.getBoundingClientRect();
    ray.setFromCamera({ x: ((ev.clientX - r.left) / r.width) * 2 - 1, y: -((ev.clientY - r.top) / r.height) * 2 + 1 }, cam);
    const hits = ray.intersectObjects(hitTargets.filter((h) => h.userData.pick), false);
    if (!hits.length) return;
    const p = hits[0].object.userData.pick;
    if (p.crew && handlers.crew) handlers.crew(p.crew);
    if (p.die != null && handlers.die) handlers.die(p.die);
  });

  /* Size and render loop */
  function resize() {
    const w = host.clientWidth, h = host.clientHeight;
    if (!w || !h) return;
    renderer.setSize(w, h, false);
    const aspect = w / h;
    let worldW = 14.2, worldH = worldW / aspect;
    if (worldH < 8.2) { worldH = 8.2; worldW = worldH * aspect; }
    cam.left = -worldW / 2; cam.right = worldW / 2; cam.top = worldH / 2 + 0.5; cam.bottom = -worldH / 2 + 0.5;
    cam.updateProjectionMatrix();
  }
  new ResizeObserver(resize).observe(host);
  resize();

  let last = performance.now();
  function angleLerp(a, b, k) { let d = b - a; while (d > PI) d -= 2 * PI; while (d < -PI) d += 2 * PI; return a + d * k; }
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    for (let i = tweens.length - 1; i >= 0; i--) {
      const tw = tweens[i];
      const p = (now - tw.t0) / tw.dur;
      if (p < 0) continue;
      tw.fn(Math.min(p, 1));
      if (p >= 1) { tweens.splice(i, 1); if (tw.done) tw.done(); }
    }
    mixers.forEach((m) => m.update(dt));
    const k = 1 - Math.pow(0.002, dt);
    for (const e of ents) {
      if (now < e.lock) continue;
      const o = e.outer, t = e.t;
      o.position.x += (t.x - o.position.x) * k;
      o.position.y += (t.y - o.position.y) * k;
      o.position.z += (t.z - o.position.z) * k;
      o.rotation.y = angleLerp(o.rotation.y, t.ry, k);
      o.rotation.x += (t.rx - o.rotation.x) * k;
      if (e.ch && e.wantBase && e.ch.base !== e.wantBase) {
        e.ch.base = e.wantBase;
        setAnim(e, e.wantBase, e.wantBase === 'die');
      }
    }
    if (!reduced) {
      const t = now / 1000;
      if (enemy && !enemy.dying) {
        if (enemy.spin) enemy.spin.rotation.y = t * 1.3;
        if (enemy.kind === 'wraith' || enemy.kind === 'storm') enemy.inner.position.y = 0.2 + Math.sin(t * 1.6) * 0.15;
      }
      flames.forEach((fl, i) => fl.scale.set(1 + Math.sin(t * 13 + i) * 0.08, 1 + Math.sin(t * 9 + i * 2) * 0.16, 1));
    }
    renderer.render(scene, cam);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  Promise.all(loads).then(() => {
    loaded = true;
    buildWorld();
    status.hidden = true;
    sync(lastS);
  });

  return { sync, play, handlers };
})();

/* =========================================================
   Rendering (DOM)
   ========================================================= */
function personSvg(color) {
  return `<svg viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="8" r="4.2" fill="#c99a72"/><path d="M7 23c0-6 2.6-10 6-10s6 4 6 10z" fill="${color}" stroke="#00000018"/></svg>`;
}

function headerHtml() {
  const muteBtn = `<button class="iconbtn" data-act="mute" aria-label="${Sfx.muted ? 'Turn sound on' : 'Turn sound off'}">${icon(Sfx.muted ? 'mute' : 'sound')}</button>`;
  if (!S) return `<header class="top"><div class="brand">Caravan</div><div class="res">${muteBtn}</div></header>`;
  const p = S.pos;
  const dots = [0, 1, 2, 3].map((r) => {
    const cls = r < p.row || (r === p.row && S.screen === 'map') ? 'done' : r === p.row ? 'here' : '';
    return `<span class="dot ${cls} ${r === 3 ? 'boss' : ''}"></span>`;
  }).join('');
  return `<header class="top">
    <div class="brand">Caravan</div>
    <div class="res">
      <span class="chip coin" title="Coin">${icon('coin')}<span class="num">${S.coin}</span></span>
      ${muteBtn}
    </div>
    <div class="road"><span>Leg ${S.leg + 1} of ${LEGS.length}</span><b>${LEGS[S.leg].name}</b><span class="dots">${dots}</span></div>
  </header>`;
}

function overlayHtml() {
  if (!S) return '';
  let ctx = '';
  if (S.screen === 'fight') {
    const e = S.fight.enemy;
    ctx = `<div class="ctx">
      <div class="row"><b>${e.name}</b><span class="hp">${e.hp}/${e.max}</span></div>
      <div class="bar"><span style="width:${(100 * e.hp) / e.max}%"></span></div>
    </div>`;
  }
  const mx = maxHp();
  return `${ctx || '<span></span>'}<div class="ctx">
      <div class="row"><b>Caravan</b><span class="hp" style="color:var(--heal)">${S.hp}/${mx}</span></div>
      <div class="bar fill-ok"><span style="width:${(100 * S.hp) / mx}%"></span></div>
    </div>`;
}

function faceHtml(f, bonus = 0) {
  return `<span class="face t-${f.t}">${icon(f.t)}${hasValue(f) ? `<span class="num">${f.v + bonus}</span>` : ''}</span>`;
}
function miniFaces(c, act) {
  return c.faces.map((fc, i) => {
    const inner = `${icon(fc.t)}${hasValue(fc) ? fc.v : ''}`;
    if (!act) return `<span class="mini t-${fc.t}" title="${faceLabel(fc)}">${inner}</span>`;
    return `<button class="mini t-${fc.t}" data-act="${act}" data-arg="${i}" ${fc.t === 'heal' ? 'disabled' : ''} aria-label="Upgrade ${faceLabel(fc)}">${inner}</button>`;
  }).join('');
}
function crewCard(c, act, opts = {}) {
  return `<button class="crew ${opts.sel ? 'sel' : ''}" data-act="${act}" data-arg="${c.id}" ${opts.disabled ? 'disabled' : ''} ${opts.sel != null ? `aria-pressed="${!!opts.sel}"` : ''}>
    ${opts.sel ? '<span class="badge">Rolling</span>' : ''}
    <span class="head"><span class="tile">${personSvg(c.color)}</span><span class="nm"><b>${c.name}</b><span class="role">${c.role}</span></span></span>
    <span class="faces">${miniFaces(c)}</span>
  </button>`;
}

function fightHtml() {
  const f = S.fight, it = intentText(f.intent);
  let body, actions;
  if (f.phase === 'pick') {
    body = `<div class="label"><span>Choose who rolls</span><span>${f.selected.length}/${Math.min(DICE_PER_TURN, S.crew.length)}</span></div>
      <div class="roster">${S.crew.map((c) => crewCard(c, 'pick', { sel: f.selected.includes(c.id) })).join('')}</div>`;
    actions = `<button class="btn primary" data-act="roll" ${f.selected.length ? '' : 'disabled'}>Roll ${f.selected.length} crew</button>`;
  } else {
    const t = totals(f);
    const dice = f.dice.map((d, i) => {
      const c = crewById(d.crew);
      const bonus = (d.face.t === 'atk' && c.role === 'Guard' && has('armory') ? 1 : 0) + (d.face.t === 'coin' && has('spice') ? 1 : 0);
      return `<button class="die ${d.held ? 'held' : ''} ${d.fresh ? 'tumble' : ''}" data-act="hold" data-arg="${i}" ${f.phase === 'roll' ? '' : 'disabled'} aria-pressed="${d.held}" aria-label="${c.name}: ${faceLabel(d.face)}${d.held ? ', held' : ''}">
        ${d.held ? '<span class="held-tag">Held</span>' : ''}${faceHtml(d.face, bonus)}<span class="who">${c.name}</span></button>`;
    }).join('');
    const sum = [`<span class="t-atk">${icon('atk')}<span class="num">${Math.max(0, t.atk - f.enemy.block)}</span>&nbsp;damage</span>`,
      `<span class="t-shd">${icon('shd')}<span class="num">${t.shd}</span>&nbsp;block</span>`];
    if (t.coin) sum.push(`<span class="t-coin">${icon('coin')}+${t.coin}</span>`);
    if (t.heal) sum.push(`<span class="t-heal">${icon('heal')}+${t.heal}</span>`);
    body = `<div class="label"><span>${f.phase === 'roll' ? 'Tap a die to keep it' : 'Enemy turn'}</span><span></span></div>
      <div class="tray">${dice}</div><div class="preview">${sum.join('')}</div>`;
    actions = f.phase === 'roll'
      ? `<button class="btn" data-act="reroll" ${f.rerolls > 0 && f.dice.some((d) => !d.held) ? '' : 'disabled'}>Reroll<small>${f.rerolls} left</small></button>
         <button class="btn primary" data-act="end">End turn</button>`
      : `<button class="btn primary" disabled>${f.phase === 'enemy' ? `${f.enemy.name} attacks…` : 'Fight over'}</button>`;
  }
  return `
  <div class="intent ${f.phase === 'enemy' ? 'acting' : ''}">
    <span class="tile">${icon(it.icon)}</span>
    <span class="txt"><span class="eyebrow">Enemy's next move</span><strong>${it.title}</strong><span class="detail">${it.detail}</span></span>
  </div>
  <section class="stack" style="gap:10px">${body}</section>
  <div class="actions">${actions}</div>`;
}

function mapHtml() {
  const leg = S.map[S.leg], p = S.pos;
  const reachKeys = reachable().map((n) => n.key);
  const X = (lane) => ((lane + 0.5) / 3) * 100;
  const Y = (row) => ((4 - (row + 1) + 0.5) / 5) * 100; // start at the bottom, boss at the top
  const lines = [];
  const link = (r1, l1, r2, l2, hot) => lines.push(`<line x1="${X(l1) * 3}" y1="${Y(r1) * 3.4}" x2="${X(l2) * 3}" y2="${Y(r2) * 3.4}" stroke="${hot ? '#ef8a26' : '#d6c5a5'}" stroke-width="${hot ? 3 : 2}" stroke-dasharray="${hot ? '0' : '5 5'}" stroke-linecap="round"/>`);
  leg.rows[0].forEach((n) => link(-1, 1, 0, n.lane, p.row === -1));
  for (let r = 0; r < 2; r++) for (const a of leg.rows[r]) for (const b of leg.rows[r + 1]) if (Math.abs(a.lane - b.lane) <= 1) link(r, a.lane, r + 1, b.lane, p.row === r && p.lane === a.lane);
  leg.rows[2].forEach((n) => link(2, n.lane, 3, 1, p.row === 2 && p.lane === n.lane));
  const node = (row, lane, type) => {
    const key = row === 3 ? 'boss' : `${row}-${lane}`;
    const here = p.row === row && p.lane === lane;
    const visited = S.visited.includes(`${S.leg}-${row}-${lane}`);
    const can = reachKeys.includes(key);
    const label = type === 'boss' ? ENEMY_TYPES[LEGS[S.leg].boss].name.replace('The ', '') : NODE_INFO[type].label;
    const cls = [here ? 'here' : visited ? 'visited' : can ? 'reach' : (row <= p.row ? 'far' : ''), type === 'boss' ? 'boss' : ''].join(' ');
    return `<button class="node ${cls}" data-t="${type}" style="left:${X(lane)}%;top:${Y(row)}%" ${can ? `data-act="go" data-arg="${key}"` : 'tabindex="-1" aria-disabled="true"'} aria-label="${label}${can ? ', go here' : ''}">
      <span class="disc">${icon(NODE_INFO[type].icon)}</span><span class="nl">${label}</span></button>`;
  };
  const nodes = [`<div class="node ${p.row === -1 ? 'here' : 'visited'}" style="left:${X(1)}%;top:${Y(-1)}%"><span class="disc">${icon('flag')}</span><span class="nl">Start</span></div>`];
  leg.rows.forEach((row, r) => row.forEach((n) => nodes.push(node(r, n.lane, n.type))));
  nodes.push(node(3, 1, 'boss'));
  return `<section class="panel">
    <p>${S.log[0] || ''} Tap a glowing stop to move on.</p>
    <div class="map">
      <svg class="lines" viewBox="0 0 300 340" preserveAspectRatio="none" aria-hidden="true">${lines.join('')}</svg>
      ${nodes.join('')}
    </div>
  </section>`;
}

function choice(act, arg, ic, cls, title, desc, opts = {}) {
  return `<button class="choice ${opts.done ? 'done' : ''}" data-act="${act}" data-arg="${arg}" ${opts.disabled ? 'disabled' : ''}>
    <span class="tile ${cls}">${ic.startsWith('<') ? ic : icon(ic)}</span>
    <span class="txt"><b>${title}</b><span class="d">${desc}</span></span>
    ${opts.price != null ? `<span class="price">${icon('coin')}${opts.price}</span>` : ''}
  </button>`;
}

function campHtml() {
  const full = S.crew.length >= MAX_CREW;
  return `<section class="panel">
    <h1>${ENEMY_TYPES[S.fight.kind].name} is beaten</h1>
    <p>The caravan is fully repaired. Choose one before you set out for ${LEGS[S.leg + 1].name}.</p>
    <div class="choices">
      ${choice('camp', 'recruit', personSvg('#ef8a26'), '', 'Recruit a traveller', full ? 'Your caravan is full.' : 'A random new crew member joins.', { disabled: full })}
      ${choice('camp', 'train', 'atk', 't-atk', 'Train', 'Upgrade any one face.')}
    </div>
  </section>`;
}

function marketHtml() {
  const m = S.market;
  const items = m.hires.map((id) => {
    const d = CREW_POOL[id], key = `hire:${id}`, bought = m.bought.includes(key);
    return choice('buy', key, personSvg(d.color), '', `Hire ${d.name} the ${d.role}`, bought ? 'Hired.' : d.faces.map(parseFace).map(faceLabel).join(', '),
      { price: PRICES.hire, done: bought, disabled: bought || S.coin < PRICES.hire || S.crew.length >= MAX_CREW });
  });
  if (m.wagon) {
    const key = `wagon:${m.wagon}`, bought = m.bought.includes(key), def = WAGON_TYPES[m.wagon];
    items.push(choice('buy', key, 'cart', '', `Buy a ${def.name}`, bought ? 'Bought.' : `+${def.hp} caravan health. ${def.perk}`,
      { price: PRICES.wagon, done: bought, disabled: bought || S.coin < PRICES.wagon || S.wagons.length >= MAX_WAGONS }));
  }
  items.push(choice('buy', 'upgrade', 'atk', 't-atk', 'Upgrade a face', '+2 to one face, or a blank becomes Attack 3.', { price: S.upgradeCost, disabled: S.coin < S.upgradeCost }));
  items.push(choice('buy', 'repair', 'heal', 't-heal', 'Repairs', `+${REPAIR} caravan health.`, { price: PRICES.repair, disabled: S.coin < PRICES.repair || S.hp >= maxHp() }));
  return `<section class="panel">
    <h1>Market</h1>
    <div class="choices">${items.join('')}</div>
    <button class="btn primary solo" data-act="leave">Leave</button>
  </section>`;
}

function upgradeHtml() {
  const u = S.upgrade;
  const cost = u.free ? 'Free' : `${S.upgradeCost} coin`;
  if (!u.crew) {
    return `<section class="panel">
      <h1>Who trains?</h1>
      <p>${cost}.</p>
      <div class="roster">${S.crew.map((c) => crewCard(c, 'upCrew')).join('')}</div>
      <button class="btn solo" data-act="upBack">Back</button>
    </section>`;
  }
  const c = crewById(u.crew);
  return `<section class="panel">
    <h1>Pick one of ${c.name}'s faces</h1>
    <p>It gets +2, or a blank becomes Attack 3. ${cost}.</p>
    <div class="card" style="padding:12px"><div class="faces" style="gap:8px">${miniFaces(c, 'upFace')}</div></div>
    <button class="btn solo" data-act="upBack">Back</button>
  </section>`;
}

function endHtml(won) {
  return `<section class="panel">
    <h1>${won ? 'You reached the city' : 'The caravan fell'}</h1>
    <p>${won ? 'The Gate Warden fell and the caravan rolled through the gate.' : `${S.log[0]} Every run starts fresh, so try a different route and crew.`}</p>
    <div class="stats">
      <div class="stat"><b class="num">${S.stats.fights}</b><span>fights</span></div>
      <div class="stat"><b class="num">${S.stats.dmg}</b><span>damage dealt</span></div>
      <div class="stat"><b class="num">${S.stats.coinEarned}</b><span>coin earned</span></div>
    </div>
    <button class="btn primary solo" data-act="newRun">Ride again</button>
  </section>`;
}

function titleHtml() {
  const s = loadSave();
  const cont = s ? `<button class="btn primary solo" data-act="resume">Continue<small>Leg ${s.leg + 1}: ${LEGS[s.leg].name}</small></button>` : '';
  return `<section class="panel hero">
    <h1>Cross the desert, one roll at a time</h1>
    <p>Your crew are your dice. In each fight, choose who rolls, keep the faces you like, reroll the rest, then end your turn. Attack hurts the enemy, Block stops its next hit, Coin buys things at markets and Mend repairs the caravan.</p>
    <div class="cta">${cont}<button class="btn ${s ? '' : 'primary'} solo" data-act="newRun">${s ? 'New run' : 'Start'}</button></div>
    <p class="credit">3D models by Kenney (kenney.nl), CC0.</p>
  </section>`;
}

const VIEWS = { map: mapHtml, fight: fightHtml, camp: campHtml, market: marketHtml, upgrade: upgradeHtml, victory: () => endHtml(true), defeat: () => endHtml(false) };

function render() {
  document.getElementById('top').innerHTML = headerHtml();
  document.getElementById('overlay').innerHTML = overlayHtml();
  document.getElementById('app').innerHTML = S ? VIEWS[S.screen]() : titleHtml();
  if (Scene) { Scene.play(pendingFx); Scene.sync(S); }
  pendingFx = [];
  if (S && S.fight) for (const d of S.fight.dice) d.fresh = false;
  save();
}

function act(name, arg) {
  if (!A[name]) return;
  Sfx.unlock();
  const prev = S && S.screen;
  A[name](arg);
  render();
  if (S && S.screen !== prev) window.scrollTo(0, 0);
}
document.getElementById('root').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]');
  if (!b || b.disabled) return;
  act(b.dataset.act, b.dataset.arg);
});
if (Scene) {
  Scene.handlers.crew = (id) => act('pick', id);
  Scene.handlers.die = (i) => act('hold', i);
}

function start(saved) {
  if (saved && saved.S) S = saved.S;
  render();
}
window.claude?.hot?.snapshot?.(() => ({ S }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
</body>
</html>
